name: Compilar Lite DLNA (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. Descargar Codigo
      uses: actions/checkout@v4

    - name: 2. Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: 3. Compilar para Windows (.exe)
      env:
        GOOS: windows
        GOARCH: amd64
      run: |
        go mod init litedlna
        mkdir dist
        go build -ldflags="-s -w" -o dist/mini_dlna_player.exe main.go

    - name: 4. Crear Release y Subir .exe
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.0"
        name: "Lite DLNA Player"
        body: "Descarga el archivo ejecutable .exe adjunto."
        files: dist/mini_dlna_player.exe
