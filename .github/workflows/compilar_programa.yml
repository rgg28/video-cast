name: Compilar Lite DLNA (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Máquina virtual nativa de Windows

    steps:
    - name: 1. Descargar Archivos Locales
      uses: actions/checkout@v4

    - name: 2. Configurar Entorno de Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false # Limpieza estricta de compilaciones anteriores

    - name: 3. Incrustar Icono mediante Recurso Nativo de Windows
      run: |
        # 1. Convertir tu icono.PNG local a formato de sistema (.ico)
        Add-Type -AssemblyName System.Drawing
        $png = [System.Drawing.Bitmap]::FromFile("icono.PNG")
        $hIcon = $png.GetHicon()
        $ico = [System.Drawing.Icon]::FromHandle($hIcon)
        $stream = [System.IO.File]::Create("app.ico")
        $ico.Save($stream)
        $stream.Close()
        $png.Dispose()
        $ico.Dispose()

        # 2. Crear un archivo de recursos (.rc) nativo de Microsoft
        Set-Content -Path "app.rc" -Value "id ICON app.ico"

        # 3. Compilar el recurso usando el compilador de recursos nativo del sistema
        windres -i app.rc -o app_windows_amd64.syso
      shell: powershell

    - name: 4. Compilar Ejecutable de Windows (GUI)
      env:
        GOOS: windows
        GOARCH: amd64
        GO111MODULE: "off" # No descarga ni busca módulos externos de internet
      run: |
        mkdir dist
        # Go detectará automáticamente el archivo .syso nativo y fusionará el icono dentro del ejecutable
        go build -ldflags="-s -w -H=windowsgui" -o dist/mini_dlna_player.exe main.go

    - name: 5. Guardar Ejecutable Terminado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: mini_dlna_player_con_icono
        path: dist/mini_dlna_player.exe

    - name: 6. Publicar Release Dinámico
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.${{ github.run_number }}.0" # Genera un número de versión único en cada ejecución
        name: "Lite DLNA Player v1.${{ github.run_number }}.0"
        body: "Compilación limpia en Windows con tu archivo icono.PNG integrado."
        files: dist/mini_dlna_player.exe
