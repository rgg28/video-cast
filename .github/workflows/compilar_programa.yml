name: Compilar Lite DLNA (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Cambiamos a Windows nativo para no usar herramientas de Linux

    steps:
    - name: 1. Descargar Codigo
      uses: actions/checkout@v4

    - name: 2. Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false # Desactivado por completo para borrar el historial de errores

    - name: 3. Descargar Icono de Reproductor Nativamente
      run: |
        # Usamos PowerShell nativo de Windows para bajar el icono sin instalar nada más
        Invoke-WebRequest -Uri "https://githubusercontent.com" -OutFile "reproductor.ico"
      shell: powershell

    - name: 4. Compilar Ejecutable Puro (Cero Dependencias Externas)
      env:
        GOOS: windows
        GOARCH: amd64
        GO111MODULE: "off" # Desactiva por completo los módulos y peticiones a internet de Go
      run: |
        mkdir dist
        # Compila directamente tu main.go usando el entorno limpio de Windows
        go build -ldflags="-s -w -H=windowsgui" -o dist/mini_dlna_player.exe main.go

    - name: 5. Subir .exe como Artefacto Directo
      uses: actions/upload-artifact@v4
      with:
        name: mini_dlna_player_windows
        path: dist/mini_dlna_player.exe

    - name: 6. Publicar en Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.6.0"
        name: "Lite DLNA Player"
        body: "Ejecutable compilado nativamente sin dependencias."
        files: dist/mini_dlna_player.exe
