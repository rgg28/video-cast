name: Compilar Programa Portable C++ (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: 2. Crear Recurso con tu icono.ico local
      run: |
        Set-Content -Path "resource.rc" -Value "MAINICON ICON ""icono.ico"""
        windres resource.rc -O coff -o resource.res
      shell: powershell

    - name: 3. Compilar en C++ 100% Estático y Portable
      run: |
        mkdir dist
        # Agregamos los flags -static para meter las DLL dentro del propio .exe
        g++ -O3 -s -mwindows -static -static-libgcc -static-libstdc++ main.cpp resource.res -o dist/mini_dlna_player.exe -lws2_32 -lcomdlg32
      shell: powershell

    - name: 4. Guardar Ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: mini_dlna_player_portable
        path: dist/mini_dlna_player.exe

    - name: 5. Publicar en Releases de GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v3.1.${{ github.run_number }}"
        name: "Lite DLNA Player Portable v3.1.${{ github.run_number }}"
        body: "Programa ejecutable común portable creado en C++. Interfaz nativa de Windows con tu icono.ico y DLLs integradas."
        files: dist/mini_dlna_player.exe
