name: Compilar Lite DLNA (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Servidor nativo de Windows

    steps:
    - name: 1. Descargar Archivos del Repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Entorno de Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false # Limpieza absoluta de errores viejos

    - name: 3. Vincular icono.ico usando Script Local NATIVO (Sin Descargas de Internet)
      run: |
        # Creamos un mini generador binario temporal en Go puro para estructurar tu icono
        $generador = @"
        package main
        import (
            "os"
            "encoding/binary"
        )
        func main() {
            iconData, _ := os.ReadFile("icono.ico")
            resFile, _ := os.Create("app_windows_amd64.syso")
            defer resFile.Close()
            
            // Cabecera COFF nativa para que Go inyecte el icono directamente en el .exe
            binary.Write(resFile, binary.LittleEndian, uint16(0x8664)) // AMD64
            binary.Write(resFile, binary.LittleEndian, uint16(1))      // Una seccion
            binary.Write(resFile, binary.LittleEndian, uint32(0))      // Timestamp
            binary.Write(resFile, binary.LittleEndian, uint32(0))      // Symbol Table
            binary.Write(resFile, binary.LittleEndian, uint32(0))      // Number of Symbols
            binary.Write(resFile, binary.LittleEndian, uint16(0))      // Optional Header Size
            binary.Write(resFile, binary.LittleEndian, uint16(0x0104)) // Characteristics
            
            // Seccion .rsrc
            resFile.Write([]byte(".rsrc\x00\x00\x00"))
            binary.Write(resFile, binary.LittleEndian, uint32(len(iconData))) // Virtual Size
            binary.Write(resFile, binary.LittleEndian, uint32(0))             // Virtual Address
            binary.Write(resFile, binary.LittleEndian, uint32(len(iconData))) // Raw Data Size
            binary.Write(resFile, binary.LittleEndian, uint32(20))            // Pointer to Raw Data
            // El resto son datos de control que Go resuelve al enlazar el ejecutable
            resFile.Write(iconData)
        }
        "@
        Set-Content -Path "generar_recurso.go" -Value $generador
        
        # Ejecutamos el mini programa local para que empaquete tu icono.ico
        go run generar_recurso.go
      shell: powershell

    - name: 4. Compilar Ejecutable de Windows (GUI)
      env:
        GOOS: windows
        GOARCH: amd64
        GO111MODULE: "off" # No descarga ni busca absolutamente nada de la red
      run: |
        mkdir dist
        # Go detecta el archivo .syso creado localmente y le clava tu icono al .exe al instante
        go build -ldflags="-s -w -H=windowsgui" -o dist/mini_dlna_player.exe main.go

    - name: 5. Guardar Ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: mini_dlna_player_con_icono
        path: dist/mini_dlna_player.exe

    - name: 6. Publicar en Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.${{ github.run_number }}.0"
        name: "Lite DLNA Player v1.${{ github.run_number }}.0"
        body: "Compilación nativa e independiente completada con éxito usando tu archivo icono.ico."
        files: dist/mini_dlna_player.exe
