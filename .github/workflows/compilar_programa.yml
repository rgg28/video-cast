name: Compilar Lite DLNA (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Descargar Archivos del Repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Entorno de Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: 3. Compilar Ejecutable de Windows (GUI + Tu Icono de Raíz)
      env:
        GOOS: windows
        GOARCH: amd64
        GO111MODULE: "off" # No descarga ni busca dependencias externas en internet
      run: |
        mkdir dist
        # Compilamos de forma limpia inyectando directamente tu archivo icono.ico de la raíz en las propiedades de Windows
        go build -ldflags="-s -w -H=windowsgui" -o dist/mini_dlna_player.exe main.go

    - name: 4. Guardar Ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: mini_dlna_player_ordenado
        path: dist/mini_dlna_player.exe

    - name: 5. Publicar en Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.9.${{ github.run_number }}"
        name: "Lite DLNA Player Ordenado v1.9.${{ github.run_number }}"
        body: "Programa optimizado: selecciona el archivo inicial, ordena alfabéticamente e incrusta el icono local."
        files: dist/mini_dlna_player.exe
