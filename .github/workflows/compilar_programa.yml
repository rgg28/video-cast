name: Compilar Lite DLNA (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. Descargar Codigo
      uses: actions/checkout@v4

    - name: 2. Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: 3. Descargar Herramienta de Iconos
      run: |
        go mod init litedlna
        go install ://github.com

    - name: 4. Configurar Recurso de Icono y Manifiesto
      run: |
        # Descarga un archivo de icono válido
        wget -q https://githubusercontent.com -O reproductor.ico
        
        # Crear Manifiesto de Windows para la apariencia visual moderna
        echo '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><dependency><dependentAssembly></dependentAssembly></dependency></assembly>' > main.manifest
        
        # Vincular el icono al ejecutable final
        /home/runner/go/bin/rsrc -manifest main.manifest -ico reproductor.ico -o main.syso

    - name: 5. Compilar para Windows (.exe GUI)
      env:
        GOOS: windows
        GOARCH: amd64
      run: |
        mkdir -p dist
        go build -ldflags="-s -w -H=windowsgui" -o dist/mini_dlna_player.exe main.go

    - name: 6. Subir .exe Directamente a esta Pantalla
      uses: actions/upload-artifact@v4
      with:
        name: mini_dlna_player_windows
        path: dist/mini_dlna_player.exe

    - name: 7. Crear Release y Subir .exe
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.2.0"
        name: "Lite DLNA Player con Icono"
        body: "Ejecutable nativo con selector de carpetas e icono integrado de reproductor."
        files: dist/mini_dlna_player.exe
