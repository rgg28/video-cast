name: Compilar Lite DLNA (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. Descargar Codigo
      uses: actions/checkout@v4

    - name: 2. Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: 3. Descargar Herramientas de Iconos y GUI
      run: |
        go mod init litedlna
        go get ://github.com
        go get ://github.com
        go install ://github.com
        go mod tidy

    - name: 4. Descargar Icono de Reproductor y Generar Recursos de Windows
      run: |
        # Descarga un icono público de reproductor de video en formato .ico
        curl -sL "https://flaticon.com" -o icon.png
        # Usamos una herramienta básica para simular un .ico o estructura de recurso
        wget -q https://githubusercontent.com -O reproductor.ico
        
        # Crear un archivo de manifiesto para que Windows reconozca los controles de la ventana moderna
        echo '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><dependency><dependentAssembly></dependentAssembly></dependency></assembly>' > main.manifest
        
        # Compilar el manifiesto y el icono en un archivo de recursos de Windows (.syso)
        /home/runner/go/bin/rsrc -manifest main.manifest -ico reproductor.ico -o main.syso

    - name: 5. Compilar para Windows (.exe GUI)
      env:
        GOOS: windows
        GOARCH: amd64
      run: |
        mkdir dist
        # El flag -H=windowsgui quita la ventana negra de la consola por completo
        go build -ldflags="-s -w -H=windowsgui" -o dist/mini_dlna_player.exe main.go

    - name: 6. Subir .exe Directamente a esta Pantalla
      uses: actions/upload-artifact@v4
      with:
        name: mini_dlna_player_windows_gui
        path: dist/mini_dlna_player.exe

    - name: 7. Crear Release y Subir .exe
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.1.0"
        name: "Lite DLNA Player con GUI"
        body: "Descarga el archivo ejecutable con interfaz gráfica y su respectivo icono."
        files: dist/mini_dlna_player.exe
