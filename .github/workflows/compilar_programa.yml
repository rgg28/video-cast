name: Compilar Lite DLNA (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Descargar Archivos Locales
      uses: actions/checkout@v4

    - name: 2. Configurar Entorno de Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: 3. Generar Icono de Sistema Compatible
      run: |
        # Generamos el archivo .ico desde tu PNG local de forma compatible
        Add-Type -AssemblyName System.Drawing
        $png = [System.Drawing.Bitmap]::FromFile("icono.PNG")
        $hIcon = $png.GetHicon()
        $ico = [System.Drawing.Icon]::FromHandle($hIcon)
        $stream = [System.IO.File]::Create("app.ico")
        $ico.Save($stream)
        $stream.Close()
        $png.Dispose()
        $ico.Dispose()

        # Creamos el archivo de recursos (.rc)
        Set-Content -Path "app.rc" -Value "1 ICON ""app.ico"""
        
        # Agregamos al PATH las herramientas nativas de Microsoft Windows (Kit de desarrollo)
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installationPath = &$vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $rcPath = Get-ChildItem -Path "$installationPath\VC\Tools\MSVC" -Recurse -Filter "rc.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
        
        # Compilamos el recurso usando la herramienta oficial de Microsoft (rc.exe) en vez de windres
        & "$rcPath\rc.exe" /r /fo app.res app.rc
      shell: powershell

    - name: 4. Compilar Ejecutable de Windows (GUI)
      env:
        GOOS: windows
        GOARCH: amd64
        GO111MODULE: "off"
      run: |
        mkdir dist
        # Compilamos vinculando directamente el archivo de recursos .res oficial de Windows
        go build -ldflags="-s -w -H=windowsgui" -o dist/mini_dlna_player.exe main.go app.res

    - name: 5. Guardar Ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: mini_dlna_player_con_icono
        path: dist/mini_dlna_player.exe

    - name: 6. Publicar Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.${{ github.run_number }}.0"
        name: "Lite DLNA Player v1.${{ github.run_number }}.0"
        body: "Compilación nativa completada con éxito usando tu icono."
        files: dist/mini_dlna_player.exe
