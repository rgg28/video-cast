name: Build DLNA Cast Chrome

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "DLNA CAST BUILD"
          Write-Host "=============================================="

          $root = Join-Path $env:GITHUB_WORKSPACE "DLNA-Cast"
          $extension = Join-Path $root "extension"
          $helper = Join-Path $root "helper"
          $nativeHost = Join-Path $root "native-host"
          $publish = Join-Path $root "publish"

          New-Item -ItemType Directory -Force -Path $extension | Out-Null
          New-Item -ItemType Directory -Force -Path $helper | Out-Null
          New-Item -ItemType Directory -Force -Path $nativeHost | Out-Null
          New-Item -ItemType Directory -Force -Path $publish | Out-Null

          function Write-File {
              param(
                  [string]$Path,
                  [string]$Content
              )

              $parent = Split-Path -Parent $Path

              if ($parent) {
                  New-Item -ItemType Directory -Force -Path $parent | Out-Null
              }

              [System.IO.File]::WriteAllText(
                  $Path,
                  $Content,
                  [System.Text.UTF8Encoding]::new($false)
              )
          }

          # ============================================================
          # GENERATE EXTENSION KEY
          # ============================================================

          Write-Host "Generating Chrome extension key..."

          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $publicDer = $rsa.ExportSubjectPublicKeyInfo()
          $publicKey = [Convert]::ToBase64String($publicDer)

          $hash = [System.Security.Cryptography.SHA256]::HashData($publicDer)
          $idBuilder = [System.Text.StringBuilder]::new()

          foreach ($byte in $hash[0..15]) {
              [void]$idBuilder.Append([char](97 + (($byte -shr 4) -band 15)))
              [void]$idBuilder.Append([char](97 + ($byte -band 15)))
          }

          $extensionId = $idBuilder.ToString()

          Write-Host "Extension ID: $extensionId"

          # ============================================================
          # EXTENSION MANIFEST
          # ============================================================

          $manifest = @"
          {
            "manifest_version": 3,
            "name": "DLNA Cast",
            "version": "1.0.0",
            "description": "Envía el vídeo actual de Chrome a una TV DLNA.",
            "permissions": [
              "activeTab",
              "scripting",
              "nativeMessaging"
            ],
            "background": {
              "service_worker": "service-worker.js"
            },
            "action": {
              "default_title": "DLNA Cast",
              "default_popup": "popup.html"
            },
            "key": "$publicKey"
          }
          "@

          Write-File `
            (Join-Path $extension "manifest.json") `
            $manifest

          # ============================================================
          # SERVICE WORKER
          # ============================================================

          $serviceWorker = @'
          const HOST = "com.rgg28.dlnacast";

          let port = null;
          let nextId = 1;
          const pending = new Map();

          function connectHost() {
              if (port) {
                  return port;
              }

              port = chrome.runtime.connectNative(HOST);

              port.onMessage.addListener((message) => {
                  if (!message || !message.id) {
                      return;
                  }

                  const request = pending.get(message.id);

                  if (!request) {
                      return;
                  }

                  pending.delete(message.id);

                  if (message.ok) {
                      request.resolve(message);
                  } else {
                      request.reject(
                          new Error(
                              message.error || "Error del helper"
                          )
                      );
                  }
              });

              port.onDisconnect.addListener(() => {
                  const error =
                      chrome.runtime.lastError?.message ||
                      "El helper DLNA se desconectó.";

                  for (const request of pending.values()) {
                      request.reject(new Error(error));
                  }

                  pending.clear();
                  port = null;
              });

              return port;
          }

          function nativeCall(action, data = {}) {
              return new Promise((resolve, reject) => {
                  const nativePort = connectHost();
                  const id = String(nextId++);

                  pending.set(id, {
                      resolve,
                      reject
                  });

                  try {
                      nativePort.postMessage({
                          id,
                          action,
                          ...data
                      });
                  } catch (error) {
                      pending.delete(id);
                      reject(error);
                  }
              });
          }

          chrome.runtime.onMessage.addListener(
              (message, sender, sendResponse) => {
                  if (!message || message.type !== "native") {
                      return false;
                  }

                  nativeCall(
                      message.action,
                      message.data || {}
                  )
                  .then((result) => {
                      sendResponse({
                          ok: true,
                          result
                      });
                  })
                  .catch((error) => {
                      sendResponse({
                          ok: false,
                          error: error.message
                      });
                  });

                  return true;
              }
          );
          '@

          Write-File `
            (Join-Path $extension "service-worker.js") `
            $serviceWorker

          # ============================================================
          # POPUP
          # ============================================================

          $popupHtml = @'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <title>DLNA Cast</title>

              <style>
                  * {
                      box-sizing: border-box;
                  }

                  body {
                      margin: 0;
                      width: 360px;
                      background: #111827;
                      color: #ffffff;
                      font-family: Arial, sans-serif;
                  }

                  header {
                      padding: 16px;
                      background: #1f2937;
                      border-bottom: 1px solid #374151;
                  }

                  h1 {
                      margin: 0;
                      font-size: 20px;
                  }

                  .subtitle {
                      margin-top: 5px;
                      color: #9ca3af;
                      font-size: 12px;
                  }

                  main {
                      padding: 16px;
                  }

                  label {
                      display: block;
                      margin-bottom: 6px;
                      font-size: 12px;
                      color: #cbd5e1;
                  }

                  select {
                      width: 100%;
                      padding: 10px;
                      background: #0f172a;
                      border: 1px solid #374151;
                      border-radius: 7px;
                      color: white;
                  }

                  button {
                      width: 100%;
                      margin-top: 10px;
                      padding: 11px;
                      border: 0;
                      border-radius: 7px;
                      color: white;
                      font-weight: bold;
                      cursor: pointer;
                  }

                  button:disabled {
                      opacity: .45;
                      cursor: default;
                  }

                  #discover {
                      background: #374151;
                  }

                  #cast {
                      background: #2563eb;
                  }

                  #stop {
                      background: #991b1b;
                  }

                  .box {
                      margin-top: 12px;
                      padding: 10px;
                      background: #0f172a;
                      border-radius: 7px;
                      color: #cbd5e1;
                      font-size: 12px;
                      white-space: pre-wrap;
                      overflow-wrap: anywhere;
                  }
              </style>
          </head>

          <body>
              <header>
                  <h1>📺 DLNA Cast</h1>
                  <div class="subtitle">
                      Envía el vídeo actual a tu TV
                  </div>
              </header>

              <main>

                  <label for="devices">
                      Dispositivo DLNA
                  </label>

                  <select id="devices">
                      <option value="">
                          Buscando...
                      </option>
                  </select>

                  <button id="discover">
                      🔎 Buscar TV
                  </button>

                  <button id="cast" disabled>
                      📺 Enviar a TV
                  </button>

                  <button id="stop" disabled>
                      ⏹ Detener
                  </button>

                  <div id="video" class="box">
                      Vídeo: no detectado
                  </div>

                  <div id="status" class="box">
                      El vídeo permanece en el PC hasta que pulses
                      "Enviar a TV".
                  </div>

              </main>

              <script src="popup.js"></script>
          </body>
          </html>
          '@

          Write-File `
            (Join-Path $extension "popup.html") `
            $popupHtml

          # ============================================================
          # POPUP JS
          # ============================================================

          $popupJs = @'
          const devicesElement =
              document.getElementById("devices");

          const discoverButton =
              document.getElementById("discover");

          const castButton =
              document.getElementById("cast");

          const stopButton =
              document.getElementById("stop");

          const videoElement =
              document.getElementById("video");

          const statusElement =
              document.getElementById("status");

          let devices = [];

          function status(text) {
              statusElement.textContent = text;
          }

          function native(action, data = {}) {
              return new Promise((resolve, reject) => {
                  chrome.runtime.sendMessage(
                      {
                          type: "native",
                          action,
                          data
                      },
                      (response) => {
                          if (chrome.runtime.lastError) {
                              reject(
                                  new Error(
                                      chrome.runtime.lastError.message
                                  )
                              );
                              return;
                          }

                          if (!response) {
                              reject(
                                  new Error(
                                      "Sin respuesta del helper."
                                  )
                              );
                              return;
                          }

                          if (!response.ok) {
                              reject(
                                  new Error(
                                      response.error ||
                                      "Error del helper."
                                  )
                              );
                              return;
                          }

                          resolve(response.result);
                      }
                  );
              });
          }

          async function findVideo() {
              const tabs =
                  await chrome.tabs.query({
                      active: true,
                      currentWindow: true
                  });

              if (!tabs.length || !tabs[0].id) {
                  throw new Error(
                      "No existe una pestaña activa."
                  );
              }

              const tabId = tabs[0].id;

              const results =
                  await chrome.scripting.executeScript({
                      target: {
                          tabId: tabId,
                          allFrames: true
                      },

                      func: () => {
                          const videos =
                              Array.from(
                                  document.querySelectorAll("video")
                              );

                          const list =
                              videos
                                  .map((video) => ({
                                      url:
                                          video.currentSrc ||
                                          video.src ||
                                          "",

                                      paused:
                                          video.paused,

                                      title:
                                          document.title ||
                                          "",

                                      pageUrl:
                                          location.href
                                  }))
                                  .filter(
                                      (item) => item.url
                                  );

                          const playing =
                              list.find(
                                  (item) => !item.paused
                              );

                          return {
                              videos: list,
                              selected:
                                  playing ||
                                  list[0] ||
                                  null,
                              pageUrl:
                                  location.href,
                              pageTitle:
                                  document.title || ""
                          };
                      }
                  });

              for (const frame of results) {
                  if (
                      frame &&
                      frame.result &&
                      frame.result.selected
                  ) {
                      return {
                          ...frame.result,
                          selected:
                              frame.result.selected
                      };
                  }
              }

              throw new Error(
                  "No se encontró ningún vídeo HTML5."
              );
          }

          async function discover() {
              discoverButton.disabled = true;
              castButton.disabled = true;

              status(
                  "Buscando dispositivos DLNA..."
              );

              try {
                  const result =
                      await native("discover");

                  devices =
                      Array.isArray(result.devices)
                          ? result.devices
                          : [];

                  devicesElement.innerHTML = "";

                  if (!devices.length) {
                      const option =
                          document.createElement("option");

                      option.value = "";
                      option.textContent =
                          "No se encontraron TVs";

                      devicesElement.appendChild(option);

                      status(
                          "No se encontraron dispositivos DLNA.\n" +
                          "Comprueba que PC y TV estén en la misma red."
                      );

                      return;
                  }

                  devices.forEach(
                      (device, index) => {
                          const option =
                              document.createElement("option");

                          option.value =
                              String(index);

                          option.textContent =
                              device.name ||
                              "Dispositivo DLNA";

                          devicesElement.appendChild(
                              option
                          );
                      }
                  );

                  castButton.disabled = false;

                  status(
                      `Encontrados ${devices.length} dispositivo(s).`
                  );
              } catch (error) {
                  status(
                      "Error DLNA:\n" +
                      error.message
                  );
              } finally {
                  discoverButton.disabled = false;
              }
          }

          async function cast() {
              const index =
                  Number(devicesElement.value);

              if (!devices[index]) {
                  status(
                      "Selecciona una TV."
                  );
                  return;
              }

              castButton.disabled = true;

              try {
                  status(
                      "Detectando vídeo..."
                  );

                  const info =
                      await findVideo();

                  const video =
                      info.selected;

                  videoElement.textContent =
                      "Vídeo:\n" +
                      (video.title ||
                          info.pageTitle ||
                          "Sin título") +
                      "\n\nURL:\n" +
                      video.url;

                  if (
                      video.url.startsWith("blob:") ||
                      video.url.startsWith("data:")
                  ) {
                      throw new Error(
                          "El vídeo usa blob:/data:.\n" +
                          "Ese stream no tiene una URL DLNA accesible."
                      );
                  }

                  status(
                      "Enviando vídeo a la TV..."
                  );

                  await native(
                      "cast",
                      {
                          device:
                              devices[index],

                          url:
                              video.url,

                          title:
                              video.title ||
                              info.pageTitle ||
                              "Chrome Video",

                          pageUrl:
                              info.pageUrl
                      }
                  );

                  stopButton.disabled = false;

                  status(
                      "Vídeo enviado correctamente."
                  );
              } catch (error) {
                  status(
                      "No se pudo enviar:\n" +
                      error.message
                  );
              } finally {
                  castButton.disabled = false;
              }
          }

          async function stop() {
              const index =
                  Number(devicesElement.value);

              if (!devices[index]) {
                  return;
              }

              stopButton.disabled = true;

              try {
                  await native(
                      "stop",
                      {
                          device:
                              devices[index]
                      }
                  );

                  status(
                      "Reproducción detenida."
                  );
              } catch (error) {
                  status(
                      "No se pudo detener:\n" +
                      error.message
                  );

                  stopButton.disabled = false;
              }
          }

          discoverButton.addEventListener(
              "click",
              discover
          );

          castButton.addEventListener(
              "click",
              cast
          );

          stopButton.addEventListener(
              "click",
              stop
          );

          discover();
          '@

          Write-File `
            (Join-Path $extension "popup.js") `
            $popupJs

          # ============================================================
          # CSP / BASIC VALIDATION
          # ============================================================

          $manifestCheck = Get-Content `
              (Join-Path $extension "manifest.json") `
              -Raw |
              ConvertFrom-Json

          if ($manifestCheck.manifest_version -ne 3) {
              throw "Manifest V3 inválido."
          }

          if (!$manifestCheck.permissions) {
              throw "No existen permisos de extensión."
          }

          # ============================================================
          # C# PROJECT
          # ============================================================

          $csproj = @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <AssemblyName>DLNACastHelper</AssemblyName>
              <RootNamespace>DLNACastHelper</RootNamespace>
            </PropertyGroup>

          </Project>
          '@

          Write-File `
            (Join-Path $helper "DLNACastHelper.csproj") `
            $csproj

          # ============================================================
          # C# PROGRAM
          # ============================================================

          $program = @'
          using System.Net;
          using System.Net.NetworkInformation;
          using System.Net.Sockets;
          using System.Runtime.InteropServices;
          using System.Security;
          using System.Text;
          using System.Text.Json;
          using System.Xml.Linq;

          namespace DLNACastHelper;

          public sealed class Request
          {
              public string? Id { get; set; }
              public string? Action { get; set; }
              public Device? Device { get; set; }
              public string? Url { get; set; }
              public string? Title { get; set; }
              public string? PageUrl { get; set; }
          }

          public sealed class Response
          {
              public string Id { get; set; } = "";
              public bool Ok { get; set; }
              public string? Message { get; set; }
              public string? Error { get; set; }
              public List<Device>? Devices { get; set; }
          }

          public sealed class Device
          {
              public string Name { get; set; } = "";
              public string Location { get; set; } = "";
              public string ControlUrl { get; set; } = "";
              public string ServiceType { get; set; } = "";
              public string DeviceId { get; set; } = "";
          }

          internal static class Program
          {
              private const int BinaryMode = 0x8000;

              [DllImport(
                  "msvcrt.dll",
                  CallingConvention = CallingConvention.Cdecl
              )]
              private static extern int _setmode(
                  int fd,
                  int mode
              );

              private static readonly JsonSerializerOptions JsonOptions =
                  new()
                  {
                      PropertyNamingPolicy =
                          JsonNamingPolicy.CamelCase
                  };

              private static readonly HttpClient Http =
                  new();

              private static readonly object ProxyLock =
                  new();

              private static TcpListener? ProxyListener;
              private static CancellationTokenSource? ProxyCancellation;

              private static string? CurrentSource;
              private static string? CurrentPage;

              public static async Task Main()
              {
                  _setmode(0, BinaryMode);
                  _setmode(1, BinaryMode);

                  Stream input =
                      Console.OpenStandardInput();

                  Stream output =
                      Console.OpenStandardOutput();

                  while (true)
                  {
                      byte[]? message =
                          await ReadMessage(input);

                      if (message == null)
                          break;

                      Response response;

                      try
                      {
                          Request? request =
                              JsonSerializer.Deserialize<Request>(
                                  message,
                                  JsonOptions
                              );

                          if (request == null)
                              throw new Exception(
                                  "Request inválido."
                              );

                          response =
                              await Handle(
                                  request
                              );
                      }
                      catch (Exception ex)
                      {
                          response =
                              new Response
                              {
                                  Id = "",
                                  Ok = false,
                                  Error = ex.Message
                              };

                          Console.Error.WriteLine(
                              ex.ToString()
                          );
                      }

                      await WriteMessage(
                          output,
                          response
                      );
                  }
              }

              private static async Task<Response> Handle(
                  Request request
              )
              {
                  string id =
                      request.Id ?? "";

                  switch (
                      (request.Action ?? "")
                      .ToLowerInvariant()
                  )
                  {
                      case "ping":
                          return new Response
                          {
                              Id = id,
                              Ok = true,
                              Message = "OK"
                          };

                      case "discover":
                      {
                          List<Device> devices =
                              await Ssdp.Discover();

                          return new Response
                          {
                              Id = id,
                              Ok = true,
                              Devices = devices
                          };
                      }

                      case "cast":
                      {
                          if (request.Device == null)
                              throw new Exception(
                                  "No se seleccionó una TV."
                              );

                          if (string.IsNullOrWhiteSpace(
                                  request.Url
                              ))
                          {
                              throw new Exception(
                                  "No se encontró la URL del vídeo."
                              );
                          }

                          string source =
                              request.Url.Trim();

                          if (
                              source.StartsWith(
                                  "blob:",
                                  StringComparison.OrdinalIgnoreCase
                              ) ||
                              source.StartsWith(
                                  "data:",
                                  StringComparison.OrdinalIgnoreCase
                              )
                          )
                          {
                              throw new Exception(
                                  "La fuente blob:/data: no puede ser reproducida por DLNA."
                              );
                          }

                          string mediaUrl;

                          if (
                              source.Contains(
                                  ".m3u8",
                                  StringComparison.OrdinalIgnoreCase
                              ) ||
                              source.Contains(
                                  ".mpd",
                                  StringComparison.OrdinalIgnoreCase
                              )
                          )
                          {
                              mediaUrl = source;
                          }
                          else
                          {
                              StartProxy(
                                  source,
                                  request.PageUrl
                              );

                              mediaUrl =
                                  GetProxyUrl(
                                      request.Device
                                  );
                          }

                          string title =
                              string.IsNullOrWhiteSpace(
                                  request.Title
                              )
                                  ? "Chrome Video"
                                  : request.Title.Trim();

                          await Dlna.SetUri(
                              request.Device,
                              mediaUrl,
                              title
                          );

                          await Dlna.Play(
                              request.Device
                          );

                          return new Response
                          {
                              Id = id,
                              Ok = true,
                              Message =
                                  "Vídeo enviado a la TV."
                          };
                      }

                      case "stop":
                      {
                          if (request.Device == null)
                              throw new Exception(
                                  "No se seleccionó una TV."
                              );

                          await Dlna.Stop(
                              request.Device
                          );

                          return new Response
                          {
                              Id = id,
                              Ok = true,
                              Message =
                                  "Reproducción detenida."
                          };
                      }

                      default:
                          throw new Exception(
                              "Acción desconocida."
                          );
                  }
              }

              private static async Task<byte[]?> ReadMessage(
                  Stream input
              )
              {
                  byte[] header = new byte[4];

                  int headerRead =
                      await ReadExactly(
                          input,
                          header
                      );

                  if (headerRead == 0)
                      return null;

                  if (headerRead != 4)
                      throw new Exception(
                          "Cabecera Native Messaging incompleta."
                      );

                  int length =
                      BitConverter.ToInt32(
                          header,
                          0
                      );

                  if (length <= 0 ||
                      length > 1024 * 1024)
                  {
                      throw new Exception(
                          "Tamaño Native Messaging inválido."
                      );
                  }

                  byte[] data =
                      new byte[length];

                  int dataRead =
                      await ReadExactly(
                          input,
                          data
                      );

                  if (dataRead != length)
                      throw new Exception(
                          "Mensaje Native Messaging incompleto."
                      );

                  return data;
              }

              private static async Task<int> ReadExactly(
                  Stream stream,
                  byte[] buffer
              )
              {
                  int total = 0;

                  while (total < buffer.Length)
                  {
                      int read =
                          await stream.ReadAsync(
                              buffer,
                              total,
                              buffer.Length - total
                          );

                      if (read == 0)
                          break;

                      total += read;
                  }

                  return total;
              }

              private static async Task WriteMessage(
                  Stream output,
                  Response response
              )
              {
                  byte[] json =
                      JsonSerializer.SerializeToUtf8Bytes(
                          response,
                          JsonOptions
                      );

                  if (json.Length >
                      1024 * 1024)
                  {
                      throw new Exception(
                          "Respuesta demasiado grande."
                      );
                  }

                  byte[] length =
                      BitConverter.GetBytes(
                          json.Length
                      );

                  await output.WriteAsync(
                      length
                  );

                  await output.WriteAsync(
                      json
                  );

                  await output.FlushAsync();
              }

              private static void StartProxy(
                  string source,
                  string? pageUrl
              )
              {
                  lock (ProxyLock)
                  {
                      CurrentSource = source;
                      CurrentPage = pageUrl;

                      if (ProxyListener != null)
                          return;

                      ProxyCancellation =
                          new CancellationTokenSource();

                      ProxyListener =
                          new TcpListener(
                              IPAddress.Any,
                              38555
                          );

                      ProxyListener.Start();

                      _ = Task.Run(
                          ProxyLoop
                      );
                  }
              }

              private static string GetProxyUrl(
                  Device device
              )
              {
                  string ip =
                      GetLocalIp(
                          device
                      );

                  return
                      $"http://{ip}:38555/media";
              }

              private static string GetLocalIp(
                  Device device
              )
              {
                  try
                  {
                      if (
                          Uri.TryCreate(
                              device.Location,
                              UriKind.Absolute,
                              out Uri? uri
                          )
                      )
                      {
                          using Socket socket =
                              new(
                                  AddressFamily.InterNetwork,
                                  SocketType.Dgram,
                                  ProtocolType.Udp
                              );

                          socket.Connect(
                              uri.Host,
                              1900
                          );

                          if (
                              socket.LocalEndPoint
                              is IPEndPoint endpoint
                          )
                          {
                              return endpoint.Address.ToString();
                          }
                      }
                  }
                  catch
                  {
                  }

                  foreach (
                      NetworkInterface nic
                      in NetworkInterface.GetAllNetworkInterfaces()
                  )
                  {
                      if (
                          nic.OperationalStatus !=
                          OperationalStatus.Up
                      )
                          continue;

                      foreach (
                          UnicastIPAddressInformation address
                          in nic
                              .GetIPProperties()
                              .UnicastAddresses
                      )
                      {
                          if (
                              address.Address.AddressFamily ==
                              AddressFamily.InterNetwork &&
                              !IPAddress.IsLoopback(
                                  address.Address
                              )
                          )
                          {
                              return address.Address.ToString();
                          }
                      }
                  }

                  return "127.0.0.1";
              }

              private static async Task ProxyLoop()
              {
                  while (
                      ProxyCancellation != null &&
                      !ProxyCancellation.IsCancellationRequested
                  )
                  {
                      try
                      {
                          TcpClient client =
                              await ProxyListener!
                                  .AcceptTcpClientAsync();

                          _ = Task.Run(
                              () => HandleClient(
                                  client
                              )
                          );
                      }
                      catch
                      {
                          await Task.Delay(100);
                      }
                  }
              }

              private static async Task HandleClient(
                  TcpClient client
              )
              {
                  using (client)
                  {
                      try
                      {
                          using NetworkStream stream =
                              client.GetStream();

                          string request =
                              await ReadHeaders(
                                  stream
                              );

                          if (string.IsNullOrWhiteSpace(
                                  request
                              ))
                              return;

                          string[] lines =
                              request.Split(
                                  "\r\n",
                                  StringSplitOptions.RemoveEmptyEntries
                              );

                          if (lines.Length == 0)
                              return;

                          string[] first =
                              lines[0].Split(
                                  ' ',
                                  StringSplitOptions.RemoveEmptyEntries
                              );

                          if (first.Length < 2)
                              return;

                          string method =
                              first[0].ToUpperInvariant();

                          string path =
                              first[1];

                          if (
                              method != "GET" &&
                              method != "HEAD"
                          )
                          {
                              await SendError(
                                  stream,
                                  405,
                                  "Method Not Allowed"
                              );

                              return;
                          }

                          if (
                              !path.StartsWith(
                                  "/media",
                                  StringComparison.OrdinalIgnoreCase
                              )
                          )
                          {
                              await SendError(
                                  stream,
                                  404,
                                  "Not Found"
                              );

                              return;
                          }

                          string? source;
                          string? page;

                          lock (ProxyLock)
                          {
                              source = CurrentSource;
                              page = CurrentPage;
                          }

                          if (string.IsNullOrWhiteSpace(
                                  source
                              ))
                          {
                              await SendError(
                                  stream,
                                  404,
                                  "No media"
                              );

                              return;
                          }

                          using HttpRequestMessage httpRequest =
                              new(
                                  HttpMethod.Get,
                                  source
                              );

                          httpRequest.Headers.TryAddWithoutValidation(
                              "User-Agent",
                              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"
                          );

                          if (
                              Uri.TryCreate(
                                  page,
                                  UriKind.Absolute,
                                  out Uri? referrer
                              )
                          )
                          {
                              httpRequest.Headers.Referrer =
                                  referrer;
                          }

                          string? range =
                              GetHeader(
                                  lines,
                                  "Range"
                              );

                          if (!string.IsNullOrWhiteSpace(
                                  range
                              ))
                          {
                              httpRequest.Headers.TryAddWithoutValidation(
                                  "Range",
                                  range
                              );
                          }

                          using HttpResponseMessage response =
                              await Http.SendAsync(
                                  httpRequest,
                                  HttpCompletionOption.ResponseHeadersRead
                              );

                          string contentType =
                              response.Content.Headers.ContentType?
                                  .ToString()
                              ?? "application/octet-stream";

                          long? contentLength =
                              response.Content.Headers.ContentLength;

                          int status =
                              (int)response.StatusCode;

                          string reason =
                              response.ReasonPhrase ??
                              "OK";

                          StringBuilder header =
                              new();

                          header.Append(
                              $"HTTP/1.1 {status} {reason}\r\n"
                          );

                          header.Append(
                              $"Content-Type: {contentType}\r\n"
                          );

                          if (contentLength.HasValue)
                          {
                              header.Append(
                                  $"Content-Length: {contentLength.Value}\r\n"
                              );
                          }

                          if (
                              response.Content.Headers
                                  .ContentRange != null
                          )
                          {
                              header.Append(
                                  "Content-Range: " +
                                  response.Content.Headers
                                      .ContentRange +
                                  "\r\n"
                              );
                          }

                          header.Append(
                              "Accept-Ranges: bytes\r\n"
                          );

                          header.Append(
                              "Connection: close\r\n"
                          );

                          header.Append(
                              "\r\n"
                          );

                          byte[] headerBytes =
                              Encoding.ASCII.GetBytes(
                                  header.ToString()
                              );

                          await stream.WriteAsync(
                              headerBytes
                          );

                          if (method == "HEAD")
                              return;

                          await using Stream sourceStream =
                              await response.Content
                                  .ReadAsStreamAsync();

                          await sourceStream.CopyToAsync(
                              stream
                          );
                      }
                      catch (Exception ex)
                      {
                          Console.Error.WriteLine(
                              "Proxy: " + ex.Message
                          );
                      }
                  }
              }

              private static async Task<string> ReadHeaders(
                  NetworkStream stream
              )
              {
                  using MemoryStream memory =
                      new();

                  byte[] buffer =
                      new byte[4096];

                  while (memory.Length < 65536)
                  {
                      int read =
                          await stream.ReadAsync(
                              buffer
                          );

                      if (read <= 0)
                          break;

                      memory.Write(
                          buffer,
                          0,
                          read
                      );

                      byte[] data =
                          memory.ToArray();

                      for (
                          int i = 3;
                          i < data.Length;
                          i++
                      )
                      {
                          if (
                              data[i - 3] == 13 &&
                              data[i - 2] == 10 &&
                              data[i - 1] == 13 &&
                              data[i] == 10
                          )
                          {
                              return Encoding.ASCII.GetString(
                                  data
                              );
                          }
                      }
                  }

                  return Encoding.ASCII.GetString(
                      memory.ToArray()
                  );
              }

              private static string? GetHeader(
                  string[] lines,
                  string name
              )
              {
                  foreach (string line in lines)
                  {
                      int separator =
                          line.IndexOf(':');

                      if (separator <= 0)
                          continue;

                      string key =
                          line[..separator]
                              .Trim();

                      if (
                          key.Equals(
                              name,
                              StringComparison.OrdinalIgnoreCase
                          )
                      )
                      {
                          return line[
                              (separator + 1)..
                          ].Trim();
                      }
                  }

                  return null;
              }

              private static async Task SendError(
                  NetworkStream stream,
                  int code,
                  string message
              )
              {
                  byte[] body =
                      Encoding.UTF8.GetBytes(
                          message
                      );

                  string header =
                      $"HTTP/1.1 {code} {message}\r\n" +
                      "Content-Type: text/plain\r\n" +
                      $"Content-Length: {body.Length}\r\n" +
                      "Connection: close\r\n" +
                      "\r\n";

                  await stream.WriteAsync(
                      Encoding.ASCII.GetBytes(
                          header
                      )
                  );

                  await stream.WriteAsync(
                      body
                  );
              }
          }

          internal static class Ssdp
          {
              public static async Task<List<Device>> Discover()
              {
                  using UdpClient udp =
                      new(
                          new IPEndPoint(
                              IPAddress.Any,
                              0
                          )
                      );

                  string request =
                      "M-SEARCH * HTTP/1.1\r\n" +
                      "HOST: 239.255.255.250:1900\r\n" +
                      "MAN: \"ssdp:discover\"\r\n" +
                      "MX: 2\r\n" +
                      "ST: urn:schemas-upnp-org:device:MediaRenderer:1\r\n" +
                      "\r\n";

                  byte[] data =
                      Encoding.ASCII.GetBytes(
                          request
                      );

                  await udp.SendAsync(
                      data,
                      data.Length,
                      new IPEndPoint(
                          IPAddress.Parse(
                              "239.255.255.250"
                          ),
                          1900
                      )
                  );

                  Dictionary<string, Device> found =
                      new(
                          StringComparer.OrdinalIgnoreCase
                      );

                  DateTime end =
                      DateTime.UtcNow.AddSeconds(3);

                  while (
                      DateTime.UtcNow < end
                  )
                  {
                      try
                      {
                          using CancellationTokenSource timeout =
                              new(
                                  TimeSpan.FromMilliseconds(
                                      700
                                  )
                              );

                          UdpReceiveResult result =
                              await udp.ReceiveAsync(
                                  timeout.Token
                              );

                          string response =
                              Encoding.ASCII.GetString(
                                  result.Buffer
                              );

                          string? location =
                              GetHeader(
                                  response,
                                  "LOCATION"
                              );

                          if (
                              string.IsNullOrWhiteSpace(
                                  location
                              )
                          )
                              continue;

                          Device? device =
                              await ReadDevice(
                                  location
                              );

                          if (device == null)
                              continue;

                          found[
                              device.ControlUrl
                          ] = device;
                      }
                      catch
                      {
                      }
                  }

                  return found.Values
                      .OrderBy(
                          x => x.Name,
                          StringComparer.OrdinalIgnoreCase
                      )
                      .ToList();
              }

              private static string? GetHeader(
                  string text,
                  string name
              )
              {
                  foreach (
                      string line in text.Split(
                          "\r\n",
                          StringSplitOptions.RemoveEmptyEntries
                      )
                  )
                  {
                      int separator =
                          line.IndexOf(':');

                      if (separator <= 0)
                          continue;

                      string key =
                          line[..separator].Trim();

                      if (
                          key.Equals(
                              name,
                              StringComparison.OrdinalIgnoreCase
                          )
                      )
                      {
                          return line[
                              (separator + 1)..
                          ].Trim();
                      }
                  }

                  return null;
              }

              private static async Task<Device?> ReadDevice(
                  string location
              )
              {
                  try
                  {
                      using HttpClient client =
                          new();

                      client.Timeout =
                          TimeSpan.FromSeconds(5);

                      string xml =
                          await client.GetStringAsync(
                              location
                          );

                      XDocument document =
                          XDocument.Parse(
                              xml
                          );

                      XElement? device =
                          document
                              .Descendants()
                              .FirstOrDefault(
                                  x =>
                                      x.Name.LocalName ==
                                      "device"
                              );

                      string name =
                          device?
                              .Elements()
                              .FirstOrDefault(
                                  x =>
                                      x.Name.LocalName ==
                                      "friendlyName"
                              )?
                              .Value
                          ?? "DLNA Renderer";

                      foreach (
                          XElement service
                          in document
                              .Descendants()
                              .Where(
                                  x =>
                                      x.Name.LocalName ==
                                      "service"
                              )
                      )
                      {
                          string serviceType =
                              service
                                  .Elements()
                                  .FirstOrDefault(
                                      x =>
                                          x.Name.LocalName ==
                                          "serviceType"
                                  )?
                                  .Value
                              ?? "";

                          if (
                              !serviceType.Contains(
                                  "AVTransport",
                                  StringComparison.OrdinalIgnoreCase
                              )
                          )
                              continue;

                          string control =
                              service
                                  .Elements()
                                  .FirstOrDefault(
                                      x =>
                                          x.Name.LocalName ==
                                          "controlURL"
                                  )?
                                  .Value
                              ?? "";

                          if (
                              string.IsNullOrWhiteSpace(
                                  control
                              )
                          )
                              continue;

                          Uri baseUri =
                              new(location);

                          Uri controlUri =
                              new(
                                  baseUri,
                                  control
                              );

                          return new Device
                          {
                              Name =
                                  name.Trim(),

                              Location =
                                  location,

                              ControlUrl =
                                  controlUri.ToString(),

                              ServiceType =
                                  serviceType.Trim(),

                              DeviceId =
                                  controlUri.ToString()
                          };
                      }
                  }
                  catch
                  {
                  }

                  return null;
              }
          }

          internal static class Dlna
          {
              private static readonly HttpClient Http =
                  new();

              public static async Task SetUri(
                  Device device,
                  string mediaUrl,
                  string title
              )
              {
                  string mime =
                      Mime(mediaUrl);

                  string metadata =
                      BuildMetadata(
                          mediaUrl,
                          title,
                          mime
                      );

                  string body =
                      "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
                      "<s:Envelope " +
                      "xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" " +
                      "s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">" +
                      "<s:Body>" +
                      "<u:SetAVTransportURI " +
                      "xmlns:u=\"urn:schemas-upnp-org:service:AVTransport:1\">" +
                      "<InstanceID>0</InstanceID>" +
                      "<CurrentURI>" +
                      Escape(mediaUrl) +
                      "</CurrentURI>" +
                      "<CurrentURIMetaData>" +
                      Escape(metadata) +
                      "</CurrentURIMetaData>" +
                      "</u:SetAVTransportURI>" +
                      "</s:Body>" +
                      "</s:Envelope>";

                  await Soap(
                      device,
                      "SetAVTransportURI",
                      body
                  );
              }

              public static async Task Play(
                  Device device
              )
              {
                  string body =
                      "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
                      "<s:Envelope " +
                      "xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" " +
                      "s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">" +
                      "<s:Body>" +
                      "<u:Play " +
                      "xmlns:u=\"urn:schemas-upnp-org:service:AVTransport:1\">" +
                      "<InstanceID>0</InstanceID>" +
                      "<Speed>1</Speed>" +
                      "</u:Play>" +
                      "</s:Body>" +
                      "</s:Envelope>";

                  await Soap(
                      device,
                      "Play",
                      body
                  );
              }

              public static async Task Stop(
                  Device device
              )
              {
                  string body =
                      "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
                      "<s:Envelope " +
                      "xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" " +
                      "s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">" +
                      "<s:Body>" +
                      "<u:Stop " +
                      "xmlns:u=\"urn:schemas-upnp-org:service:AVTransport:1\">" +
                      "<InstanceID>0</InstanceID>" +
                      "</u:Stop>" +
                      "</s:Body>" +
                      "</s:Envelope>";

                  await Soap(
                      device,
                      "Stop",
                      body
                  );
              }

              private static async Task Soap(
                  Device device,
                  string action,
                  string body
              )
              {
                  using HttpRequestMessage request =
                      new(
                          HttpMethod.Post,
                          device.ControlUrl
                      );

                  request.Content =
                      new StringContent(
                          body,
                          Encoding.UTF8,
                          "text/xml"
                      );

                  request.Headers.TryAddWithoutValidation(
                      "SOAPAction",
                      $"\"{device.ServiceType}#{action}\""
                  );

                  using HttpResponseMessage response =
                      await Http.SendAsync(
                          request
                      );

                  if (!response.IsSuccessStatusCode)
                  {
                      string text =
                          await response.Content
                              .ReadAsStringAsync();

                      throw new Exception(
                          $"La TV rechazó {action}: " +
                          $"{(int)response.StatusCode} " +
                          $"{response.ReasonPhrase}\n" +
                          text
                      );
                  }
              }

              private static string BuildMetadata(
                  string url,
                  string title,
                  string mime
              )
              {
                  return
                      "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
                      "<DIDL-Lite " +
                      "xmlns=\"urn:schemas-upnp-org:metadata-1-0/DIDL-Lite/\" " +
                      "xmlns:dc=\"http://purl.org/dc/elements/1.1/\" " +
                      "xmlns:upnp=\"urn:schemas-upnp-org:metadata-1-0/upnp/\">" +
                      "<item id=\"0\" parentID=\"-1\" restricted=\"1\">" +
                      "<dc:title>" +
                      Escape(title) +
                      "</dc:title>" +
                      "<upnp:class>object.item.videoItem</upnp:class>" +
                      "<res protocolInfo=\"http-get:*:" +
                      mime +
                      ":*\">" +
                      Escape(url) +
                      "</res>" +
                      "</item>" +
                      "</DIDL-Lite>";
              }

              private static string Mime(
                  string url
              )
              {
                  string value =
                      url.ToLowerInvariant();

                  if (value.Contains(".m3u8"))
                      return "application/vnd.apple.mpegurl";

                  if (value.Contains(".mpd"))
                      return "application/dash+xml";

                  if (value.Contains(".webm"))
                      return "video/webm";

                  if (value.Contains(".mkv"))
                      return "video/x-matroska";

                  if (value.Contains(".mov"))
                      return "video/quicktime";

                  return "video/mp4";
              }

              private static string Escape(
                  string value
              )
              {
                  return
                      SecurityElement
                          .Escape(value)
                      ?? "";
              }
          }
          '@

          Write-File `
            (Join-Path $helper "Program.cs") `
            $program

          # ============================================================
          # RESTORE
          # ============================================================

          Write-Host "=============================================="
          Write-Host "DOTNET RESTORE"
          Write-Host "=============================================="

          dotnet restore `
            (Join-Path $helper "DLNACastHelper.csproj")

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          # ============================================================
          # BUILD
          # ============================================================

          Write-Host "=============================================="
          Write-Host "DOTNET PUBLISH"
          Write-Host "=============================================="

          $helperOutput = Join-Path $publish "helper"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $helperOutput |
            Out-Null

          dotnet publish `
            (Join-Path $helper "DLNACastHelper.csproj") `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $helperOutput `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed."
          }

          if (!(Test-Path (Join-Path $helperOutput "DLNACastHelper.exe"))) {
              throw "DLNACastHelper.exe was not generated."
          }

          # ============================================================
          # COPY EXTENSION
          # ============================================================

          $publishedExtension =
              Join-Path $publish "extension"

          $publishedNativeHost =
              Join-Path $publish "native-host"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $publishedExtension |
              Out-Null

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $publishedNativeHost |
              Out-Null

          Copy-Item `
              (Join-Path $extension "*") `
              $publishedExtension `
              -Recurse `
              -Force

          # ============================================================
          # NATIVE HOST MANIFEST
          # ============================================================

          $nativeManifest = @"
          {
            "name": "com.rgg28.dlnacast",
            "description": "DLNA Cast Native Messaging Host",
            "path": "DLNACastHelper.exe",
            "type": "stdio",
            "allowed_origins": [
              "chrome-extension://$extensionId/"
            ]
          }
          "@

          Write-File `
              (Join-Path $publishedNativeHost "com.rgg28.dlnacast.json") `
              $nativeManifest

          # ============================================================
          # INSTALLER
          # ============================================================

          $installer = @'
          @echo off
          setlocal

          echo.
          echo ==========================================
          echo DLNA CAST INSTALLER
          echo ==========================================
          echo.

          set "BASE=%~dp0"
          set "INSTALL=%LOCALAPPDATA%\DLNACast"
          set "HOST=%INSTALL%\host"
          set "EXT=%INSTALL%\extension"

          if not exist "%INSTALL%" mkdir "%INSTALL%"
          if not exist "%HOST%" mkdir "%HOST%"

          if exist "%EXT%" rmdir /S /Q "%EXT%"
          mkdir "%EXT%"

          echo Copying helper...
          copy /Y "%BASE%helper\DLNACastHelper.exe" "%HOST%\DLNACastHelper.exe"

          if errorlevel 1 (
              echo ERROR copying helper.
              pause
              exit /b 1
          )

          echo Copying host manifest...
          copy /Y "%BASE%native-host\com.rgg28.dlnacast.json" "%HOST%\com.rgg28.dlnacast.json"

          if errorlevel 1 (
              echo ERROR copying host manifest.
              pause
              exit /b 1
          )

          echo Copying extension...
          xcopy "%BASE%extension\*" "%EXT%\" /E /I /Y

          if errorlevel 1 (
              echo ERROR copying extension.
              pause
              exit /b 1
          )

          echo.
          echo Registering Native Messaging host...

          reg add "HKCU\Software\Google\Chrome\NativeMessagingHosts\com.rgg28.dlnacast" ^
              /ve ^
              /t REG_SZ ^
              /d "%HOST%\com.rgg28.dlnacast.json" ^
              /f

          if errorlevel 1 (
              echo ERROR registering Native Messaging.
              pause
              exit /b 1
          )

          echo.
          echo Opening Chrome extensions...
          start "" chrome://extensions/

          echo.
          echo ==========================================
          echo INSTALLATION COMPLETE
          echo ==========================================
          echo.
          echo In Chrome:
          echo.
          echo 1. Enable Developer mode.
          echo 2. Click Load unpacked.
          echo 3. Select:
          echo.
          echo %EXT%
          echo.
          echo Then pin DLNA Cast.
          echo.

          pause
          exit /b 0
          '@

          Write-File `
              (Join-Path $publish "Install-DLNACast.bat") `
              $installer

          # ============================================================
          # UNINSTALLER
          # ============================================================

          $uninstaller = @'
          @echo off
          setlocal

          echo Removing DLNA Cast...

          reg delete "HKCU\Software\Google\Chrome\NativeMessagingHosts\com.rgg28.dlnacast" /f

          if exist "%LOCALAPPDATA%\DLNACast" (
              rmdir /S /Q "%LOCALAPPDATA%\DLNACast"
          )

          echo.
          echo DLNA Cast removed.
          pause
          exit /b 0
          '@

          Write-File `
              (Join-Path $publish "Uninstall-DLNACast.bat") `
              $uninstaller

          # ============================================================
          # README
          # ============================================================

          $readme = @"
          DLNA CAST
          =========

          Chrome extension + native Windows DLNA helper.

          Extension ID:
          $extensionId

          Native host:
          com.rgg28.dlnacast

          INSTALL
          -------

          1. Run Install-DLNACast.bat.
          2. Chrome opens chrome://extensions/.
          3. Enable Developer mode.
          4. Click Load unpacked.
          5. Select:

             %LOCALAPPDATA%\DLNACast\extension

          6. Pin DLNA Cast.

          USE
          ---

          1. Open a video in Chrome.
          2. Play it.
          3. Click DLNA Cast.
          4. Click Buscar TV.
          5. Select your TV.
          6. Click Enviar a TV.

          The video is NOT automatically sent.

          STOP
          ----

          Click Detener.

          LIMITATIONS
          -----------

          Normal HTTP/HTTPS MP4 video is the main supported case.

          blob:, data:, DRM and browser-only MediaSource streams
          cannot be directly converted into DLNA.

          HLS/DASH support depends on the TV.

          The local proxy uses TCP port 38555.

          PC and TV must be on the same LAN.
          "@

          Write-File `
              (Join-Path $publish "README.txt") `
              $readme

          # ============================================================
          # VALIDATION
          # ============================================================

          Write-Host "=============================================="
          Write-Host "VALIDATING BUILD"
          Write-Host "=============================================="

          $files = @(
              (Join-Path $publish "helper\DLNACastHelper.exe"),
              (Join-Path $publish "extension\manifest.json"),
              (Join-Path $publish "extension\popup.html"),
              (Join-Path $publish "extension\popup.js"),
              (Join-Path $publish "extension\service-worker.js"),
              (Join-Path $publish "native-host\com.rgg28.dlnacast.json"),
              (Join-Path $publish "Install-DLNACast.bat"),
              (Join-Path $publish "Uninstall-DLNACast.bat"),
              (Join-Path $publish "README.txt")
          )

          foreach ($file in $files) {
              if (!(Test-Path $file)) {
                  throw "MISSING: $file"
              }

              Write-Host "OK: $file"
          }

          # Validate JSON files
          Get-Content `
              (Join-Path $publish "extension\manifest.json") `
              -Raw |
              ConvertFrom-Json |
              Out-Null

          Get-Content `
              (Join-Path $publish "native-host\com.rgg28.dlnacast.json") `
              -Raw |
              ConvertFrom-Json |
              Out-Null

          Write-Host ""
          Write-Host "ALL VALIDATIONS PASSED."

          # ============================================================
          # ZIP
          # ============================================================

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "DLNA-Cast-Windows.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
              -Path (Join-Path $publish "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
              throw "ZIP was not created."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILD SUCCESS"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Extension ID: $extensionId"
          Write-Host "ZIP: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLNA-Cast-Windows
          path: |
            DLNA-Cast-Windows.zip
            DLNA-Cast/publish
          if-no-files-found: error
          retention-days: 30
