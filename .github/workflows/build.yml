          # ========================================================
          # LOCAL HTTP MEDIA SERVER
          # ========================================================

          @'
using System.Net;
using System.Net.Http;
using System.Net.Sockets;

namespace DLNABrowser;

public sealed class LocalMediaServer : IDisposable
{
    private readonly HttpListener listener =
        new();

    private readonly CancellationTokenSource cts =
        new();

    private string? currentUrl;


    public int Port { get; private set; }


    public string? CurrentMediaUrl =>
        currentUrl;


    public async Task<string> StartAsync(
        string sourceUrl)
    {
        currentUrl =
            sourceUrl;


        Port =
            FindFreePort();


        listener.Prefixes.Add(
            $"http://+:{Port}/");


        listener.Start();


        _ = Task.Run(
            ProcessAsync,
            cts.Token);


        string localIp =
            GetLocalIPv4();


        return
            $"http://{localIp}:{Port}/media";
    }


    private async Task ProcessAsync()
    {
        while (!cts.IsCancellationRequested)
        {
            HttpListenerContext context;


            try
            {
                context =
                    await listener.GetContextAsync();
            }
            catch
            {
                break;
            }


            _ = Task.Run(
                () => HandleAsync(context),
                cts.Token);
        }
    }


    private async Task HandleAsync(
        HttpListenerContext context)
    {
        try
        {
            if (context.Request.Url?.AbsolutePath !=
                "/media")
            {
                context.Response.StatusCode =
                    404;

                context.Response.Close();

                return;
            }


            if (string.IsNullOrWhiteSpace(
                    currentUrl))
            {
                context.Response.StatusCode =
                    404;

                context.Response.Close();

                return;
            }


            using var client =
                new HttpClient();


            using var request =
                new HttpRequestMessage(
                    HttpMethod.Get,
                    currentUrl);


            string? range =
                context.Request.Headers["Range"];


            if (!string.IsNullOrWhiteSpace(
                    range))
            {
                request.Headers.TryAddWithoutValidation(
                    "Range",
                    range);
            }


            string? userAgent =
                context.Request.Headers["User-Agent"];


            if (!string.IsNullOrWhiteSpace(
                    userAgent))
            {
                request.Headers.TryAddWithoutValidation(
                    "User-Agent",
                    userAgent);
            }


            using HttpResponseMessage response =
                await client.SendAsync(
                    request,
                    HttpCompletionOption.ResponseHeadersRead,
                    cts.Token);


            context.Response.StatusCode =
                (int)response.StatusCode;


            if (response.Content.Headers.ContentType !=
                null)
            {
                context.Response.ContentType =
                    response.Content.Headers.ContentType
                        .ToString();
            }
            else
            {
                context.Response.ContentType =
                    "video/mp4";
            }


            if (response.Content.Headers.ContentLength
                .HasValue)
            {
                context.Response.ContentLength64 =
                    response.Content.Headers.ContentLength.Value;
            }


            if (response.Headers.TryGetValues(
                    "Accept-Ranges",
                    out IEnumerable<string>? ranges))
            {
                context.Response.Headers[
                    "Accept-Ranges"] =
                    string.Join(
                        ",",
                        ranges);
            }


            if (response.Content.Headers.ContentRange
                != null)
            {
                context.Response.Headers[
                    "Content-Range"] =
                    response.Content.Headers
                        .ContentRange
                        .ToString();
            }


            if (response.Headers.TryGetValues(
                    "Content-Range",
                    out IEnumerable<string>? responseRanges))
            {
                context.Response.Headers[
                    "Content-Range"] =
                    string.Join(
                        ",",
                        responseRanges);
            }


            await using Stream stream =
                await response.Content.ReadAsStreamAsync(
                    cts.Token);


            await stream.CopyToAsync(
                context.Response.OutputStream,
                cts.Token);


            context.Response.OutputStream.Close();
        }
        catch
        {
            try
            {
                context.Response.Abort();
            }
            catch
            {
            }
        }
    }


    private static int FindFreePort()
    {
        var tcp =
            new TcpListener(
                IPAddress.Loopback,
                0);


        tcp.Start();


        int port =
            ((IPEndPoint)tcp.LocalEndpoint)
                .Port;


        tcp.Stop();


        return port;
    }


    private static string GetLocalIPv4()
    {
        try
        {
            foreach (IPAddress address
                in Dns.GetHostEntry(
                    Dns.GetHostName()).AddressList)
            {
                if (address.AddressFamily ==
                        AddressFamily.InterNetwork &&
                    !IPAddress.IsLoopback(address))
                {
                    return address.ToString();
                }
            }
        }
        catch
        {
        }


        return "127.0.0.1";
    }


    public void Dispose()
    {
        cts.Cancel();


        try
        {
            listener.Stop();
            listener.Close();
        }
        catch
        {
        }


        cts.Dispose();
    }
}
