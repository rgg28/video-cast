          @'
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using System.Net;
          using System.Net.Http;
          using System.Net.Sockets;
          using System.Text;
          using System.Threading;
          using System.Threading.Tasks;
          using System.Xml.Linq;

          namespace DLNABrowser;

          public sealed class DlnaDevice
          {
              public string DisplayName { get; set; } = "";
              public string Location { get; set; } = "";
              public string FriendlyName { get; set; } = "";
              public string DeviceType { get; set; } = "";
              public string ControlUrl { get; set; } = "";
              public string ServiceType { get; set; } = "";

              public override string ToString()
                  => string.IsNullOrWhiteSpace(FriendlyName)
                      ? DisplayName
                      : FriendlyName;
          }

          public static class SsdpDiscovery
          {
              private static readonly HttpClient Http = new()
              {
                  Timeout = TimeSpan.FromSeconds(5)
              };

              public static async Task<List<DlnaDevice>> DiscoverAsync(
                  CancellationToken cancellationToken = default)
              {
                  var result = new List<DlnaDevice>();

                  using var udp = new UdpClient();

                  udp.Client.SetSocketOption(
                      SocketOptionLevel.Socket,
                      SocketOptionName.ReuseAddress,
                      true);

                  udp.EnableBroadcast = true;

                  var endpoint = new IPEndPoint(
                      IPAddress.Parse("239.255.255.250"),
                      1900);

                  string request =
                      "M-SEARCH * HTTP/1.1\r\n" +
                      "HOST: 239.255.255.250:1900\r\n" +
                      "MAN: \"ssdp:discover\"\r\n" +
                      "MX: 2\r\n" +
                      "ST: urn:schemas-upnp-org:device:MediaRenderer:1\r\n" +
                      "\r\n";

                  byte[] data = Encoding.UTF8.GetBytes(request);

                  await udp.SendAsync(data, data.Length, endpoint);

                  var timeout = Task.Delay(
                      TimeSpan.FromSeconds(3),
                      cancellationToken);

                  while (!timeout.IsCompleted)
                  {
                      var receive = udp.ReceiveAsync();

                      var completed =
                          await Task.WhenAny(receive, timeout);

                      if (completed != receive)
                          break;

                      UdpReceiveResult packet;

                      try
                      {
                          packet = receive.Result;
                      }
                      catch
                      {
                          break;
                      }

                      string response =
                          Encoding.UTF8.GetString(packet.Buffer);

                      var headers =
                          ParseHeaders(response);

                      if (!headers.TryGetValue(
                              "location",
                              out var location))
                          continue;

                      if (result.Any(x =>
                              string.Equals(
                                  x.Location,
                                  location,
                                  StringComparison.OrdinalIgnoreCase)))
                          continue;

                      try
                      {
                          var device =
                              await LoadDeviceAsync(location);

                          if (device != null)
                              result.Add(device);
                      }
                      catch
                      {
                      }
                  }

                  return result;
              }

              private static Dictionary<string, string> ParseHeaders(
                  string response)
              {
                  var result =
                      new Dictionary<string, string>(
                          StringComparer.OrdinalIgnoreCase);

                  foreach (var line in response.Split(
                               new[] { "\r\n", "\n" },
                               StringSplitOptions.RemoveEmptyEntries))
                  {
                      int p = line.IndexOf(':');

                      if (p <= 0)
                          continue;

                      string key =
                          line[..p].Trim();

                      string value =
                          line[(p + 1)..].Trim();

                      result[key] = value;
                  }

                  return result;
              }

              private static async Task<DlnaDevice?> LoadDeviceAsync(
                  string location)
              {
                  string xml =
                      await Http.GetStringAsync(location);

                  var doc =
                      XDocument.Parse(xml);

                  XNamespace ns =
                      "urn:schemas-upnp-org:device-1-0";

                  var device =
                      doc.Descendants(ns + "device")
                         .FirstOrDefault();

                  if (device == null)
                      return null;

                  string friendly =
                      device.Element(ns + "friendlyName")?.Value
                      ?? "DLNA TV";

                  var services =
                      device.Descendants(ns + "service");

                  foreach (var service in services)
                  {
                      string serviceType =
                          service.Element(ns + "serviceType")?.Value
                          ?? "";

                      if (!serviceType.Contains(
                              "AVTransport",
                              StringComparison.OrdinalIgnoreCase))
                          continue;

                      string control =
                          service.Element(ns + "controlURL")?.Value
                          ?? "";

                      if (string.IsNullOrWhiteSpace(control))
                          continue;

                      var baseUri =
                          new Uri(location);

                      string controlUrl =
                          new Uri(
                              baseUri,
                              control).ToString();

                      return new DlnaDevice
                      {
                          DisplayName = friendly,
                          FriendlyName = friendly,
                          Location = location,
                          ControlUrl = controlUrl,
                          ServiceType = serviceType,
                          DeviceType =
                              device.Element(
                                  ns + "deviceType")?.Value ?? ""
                      };
                  }

                  return null;
              }
          }
          '@ | Set-Content "src/DLNABrowser/DlnaDiscovery.cs" -Encoding UTF8

          @'
          using System;
          using System.Net.Http;
          using System.Text;
          using System.Threading.Tasks;

          namespace DLNABrowser;

          public static class DlnaRenderer
          {
              private static readonly HttpClient Http = new()
              {
                  Timeout = TimeSpan.FromSeconds(15)
              };

              public static async Task SetMediaAsync(
                  DlnaDevice device,
                  string mediaUrl,
                  string mimeType,
                  string title)
              {
                  string escapedUrl =
                      System.Security.SecurityElement.Escape(
                          mediaUrl);

                  string escapedTitle =
                      System.Security.SecurityElement.Escape(
                          title);

                  string metadata =
                      $"<DIDL-Lite " +
                      $"xmlns=\"urn:schemas-upnp-org:metadata-1-0/DIDL-Lite/\" " +
                      $"xmlns:dc=\"http://purl.org/dc/elements/1.1/\" " +
                      $"xmlns:upnp=\"urn:schemas-upnp-org:metadata-1-0/upnp/\">" +
                      $"<item id=\"1\" parentID=\"0\" restricted=\"1\">" +
                      $"<dc:title>{escapedTitle}</dc:title>" +
                      $"<upnp:class>object.item.videoItem</upnp:class>" +
                      $"<res protocolInfo=\"http-get:*:{mimeType}:*\">" +
                      $"{escapedUrl}</res>" +
                      $"</item>" +
                      $"</DIDL-Lite>";

                  string body =
                      Soap(
                          "SetAVTransportURI",
                          device.ServiceType,
                          $@"
                            <InstanceID>0</InstanceID>
                            <CurrentURI>{escapedUrl}</CurrentURI>
                            <CurrentURIMetaData>
                              {System.Security.SecurityElement.Escape(metadata)}
                            </CurrentURIMetaData>");

                  await SendAsync(
                      device.ControlUrl,
                      device.ServiceType,
                      "SetAVTransportURI",
                      body);
              }

              public static async Task PlayAsync(
                  DlnaDevice device)
              {
                  string body =
                      Soap(
                          "Play",
                          device.ServiceType,
                          "<InstanceID>0</InstanceID>" +
                          "<Speed>1</Speed>");

                  await SendAsync(
                      device.ControlUrl,
                      device.ServiceType,
                      "Play",
                      body);
              }

              public static async Task StopAsync(
                  DlnaDevice device)
              {
                  string body =
                      Soap(
                          "Stop",
                          device.ServiceType,
                          "<InstanceID>0</InstanceID>");

                  await SendAsync(
                      device.ControlUrl,
                      device.ServiceType,
                      "Stop",
                      body);
              }

              private static string Soap(
                  string action,
                  string service,
                  string arguments)
              {
                  return
                      $@"<?xml version=""1.0"" encoding=""utf-8""?>
                      <s:Envelope
                          xmlns:s=""http://schemas.xmlsoap.org/soap/envelope/""
                          s:encodingStyle=""http://schemas.xmlsoap.org/soap/encoding/"">
                        <s:Body>
                          <u:{action}
                            xmlns:u=""{service}"">
                            {arguments}
                          </u:{action}>
                        </s:Body>
                      </s:Envelope>";
              }

              private static async Task SendAsync(
                  string url,
                  string service,
                  string action,
                  string body)
              {
                  using var request =
                      new HttpRequestMessage(
                          HttpMethod.Post,
                          url);

                  request.Content =
                      new StringContent(
                          body,
                          Encoding.UTF8,
                          "text/xml");

                  request.Headers.Add(
                      "SOAPACTION",
                      $"\"{service}#{action}\"");

                  using var response =
                      await Http.SendAsync(request);

                  string text =
                      await response.Content.ReadAsStringAsync();

                  if (!response.IsSuccessStatusCode)
                  {
                      throw new Exception(
                          $"DLNA {action} failed: " +
                          $"{(int)response.StatusCode} " +
                          text);
                  }
              }
          }
          '@ | Set-Content "src/DLNABrowser/DlnaRenderer.cs" -Encoding UTF8

          @'
          using System;
          using System.IO;
          using System.Net;
          using System.Net.Sockets;
          using System.Threading;
          using System.Threading.Tasks;

          namespace DLNABrowser;

          public sealed class LocalMediaServer : IDisposable
          {
              private readonly HttpListener listener =
                  new();

              private readonly CancellationTokenSource cts =
                  new();

              private string? currentUrl;

              public int Port { get; private set; }

              public string? CurrentMediaUrl
                  => currentUrl;

              public async Task<string> StartAsync(
                  string sourceUrl)
              {
                  currentUrl = sourceUrl;

                  Port = FindFreePort();

                  listener.Prefixes.Add(
                      $"http://+:{Port}/");

                  listener.Start();

                  _ = Task.Run(
                      ProcessAsync,
                      cts.Token);

                  string localIp =
                      GetLocalIPv4();

                  return
                      $"http://{localIp}:{Port}/media";
              }

              private async Task ProcessAsync()
              {
                  while (!cts.IsCancellationRequested)
                  {
                      HttpListenerContext context;

                      try
                      {
                          context =
                              await listener.GetContextAsync();
                      }
                      catch
                      {
                          break;
                      }

                      _ = Task.Run(
                          () => HandleAsync(context),
                          cts.Token);
                  }
              }

              private async Task HandleAsync(
                  HttpListenerContext context)
              {
                  try
                  {
                      if (context.Request.Url?.AbsolutePath
                              != "/media")
                      {
                          context.Response.StatusCode = 404;
                          context.Response.Close();
                          return;
                      }

                      if (string.IsNullOrWhiteSpace(
                              currentUrl))
                      {
                          context.Response.StatusCode = 404;
                          context.Response.Close();
                          return;
                      }

                      using var client =
                          new HttpClient();

                      using var request =
                          new HttpRequestMessage(
                              HttpMethod.Get,
                              currentUrl);

                      if (!string.IsNullOrWhiteSpace(
                              context.Request.Headers["Range"]))
                      {
                          request.Headers.TryAddWithoutValidation(
                              "Range",
                              context.Request.Headers["Range"]);
                      }

                      using var response =
                          await client.SendAsync(
                              request,
                              HttpCompletionOption.ResponseHeadersRead);

                      context.Response.StatusCode =
                          (int)response.StatusCode;

                      if (response.Content.Headers.ContentType
                              != null)
                      {
                          context.Response.ContentType =
                              response.Content.Headers.ContentType
                                  .ToString();
                      }
                      else
                      {
                          context.Response.ContentType =
                              "video/mp4";
                      }

                      if (response.Content.Headers.ContentLength
                             .HasValue)
                      {
                          context.Response.ContentLength64 =
                              response.Content.Headers.ContentLength.Value;
                      }

                      if (response.Headers.TryGetValues(
                              "Accept-Ranges",
                              out var ranges))
                      {
                          context.Response.Headers["Accept-Ranges"] =
                              string.Join(",", ranges);
                      }

                      await using var stream =
                          await response.Content.ReadAsStreamAsync();

                      await stream.CopyToAsync(
                          context.Response.OutputStream);

                      context.Response.OutputStream.Close();
                  }
                  catch
                  {
                      try
                      {
                          context.Response.Abort();
                      }
                      catch
                      {
                      }
                  }
              }

              private static int FindFreePort()
              {
                  var tcp =
                      new TcpListener(
                          IPAddress.Loopback,
                          0);

                  tcp.Start();

                  int port =
                      ((IPEndPoint)tcp.LocalEndpoint).Port;

                  tcp.Stop();

                  return port;
              }

              private static string GetLocalIPv4()
              {
                  foreach (var address
                      in Dns.GetHostEntry(
                          Dns.GetHostName()).AddressList)
                  {
                      if (address.AddressFamily ==
                          AddressFamily.InterNetwork &&
                          !IPAddress.IsLoopback(address))
                      {
                          return address.ToString();
                      }
                  }

                  return "127.0.0.1";
              }

              public void Dispose()
              {
                  cts.Cancel();

                  try
                  {
                      listener.Stop();
                      listener.Close();
                  }
                  catch
                  {
                  }

                  cts.Dispose();
              }
          }
          '@ | Set-Content "src/DLNABrowser/LocalMediaServer.cs" -Encoding UTF8

          @'
          using Microsoft.Web.WebView2.Core;
          using System;
          using System.Linq;
          using System.Text.Json;
          using System.Threading.Tasks;
          using System.Windows;
          using System.Windows.Input;

          namespace DLNABrowser;

          public partial class MainWindow : Window
          {
              private const string HomeUrl =
                  "https://www.google.com/";

              private readonly LocalMediaServer mediaServer =
                  new();

              private System.Collections.Generic.List<DlnaDevice>
                  devices = new();

              public MainWindow()
              {
                  InitializeComponent();

                  Loaded += MainWindow_Loaded;
                  Closed += MainWindow_Closed;
              }

              private async void MainWindow_Loaded(
                  object sender,
                  RoutedEventArgs e)
              {
                  try
                  {
                      await Browser.EnsureCoreWebView2Async();

                      Browser.CoreWebView2.Settings
                          .AreDefaultContextMenusEnabled = true;

                      Browser.CoreWebView2.Settings
                          .AreDevToolsEnabled = true;

                      Browser.CoreWebView2.Navigate(
                          HomeUrl);

                      await DiscoverDevicesAsync();
                  }
                  catch (Exception ex)
                  {
                      StatusText.Text =
                          "WebView2 error: " + ex.Message;
                  }
              }

              private void MainWindow_Closed(
                  object? sender,
                  EventArgs e)
              {
                  mediaServer.Dispose();
              }

              private async Task DiscoverDevicesAsync()
              {
                  StatusText.Text =
                      "Buscando TVs DLNA...";

                  TvList.Items.Clear();

                  try
                  {
                      devices =
                          await SsdpDiscovery.DiscoverAsync();

                      foreach (var device in devices)
                          TvList.Items.Add(device);

                      if (devices.Count > 0)
                      {
                          TvList.SelectedIndex = 0;

                          StatusText.Text =
                              $"{devices.Count} TV(s) encontrada(s)";
                      }
                      else
                      {
                          StatusText.Text =
                              "No se encontraron TVs DLNA";
                      }
                  }
                  catch (Exception ex)
                  {
                      StatusText.Text =
                          "Error DLNA: " + ex.Message;
                  }
              }

              private async void Discover_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  await DiscoverDevicesAsync();
              }

              private async void SendToTv_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (TvList.SelectedItem is not DlnaDevice device)
                  {
                      MessageBox.Show(
                          "Selecciona una TV DLNA primero.",
                          "DLNA Browser",
                          MessageBoxButton.OK,
                          MessageBoxImage.Information);

                      return;
                  }

                  try
                  {
                      StatusText.Text =
                          "Buscando video...";

                      string json =
                          await Browser.ExecuteScriptAsync(
                              @"(() => {
                                  const videos =
                                      Array.from(
                                          document.querySelectorAll('video')
                                      );

                                  const v =
                                      videos.find(x => x.currentSrc) ||
                                      videos.find(x => x.src);

                                  if (!v) return null;

                                  return JSON.stringify({
                                      src: v.currentSrc || v.src,
                                      type: v.currentSrc ?
                                          (v.currentSrc.includes('.m3u8') ?
                                              'application/vnd.apple.mpegurl' :
                                              'video/mp4') :
                                          (v.type || 'video/mp4'),
                                      title:
                                          document.title || 'Video'
                                  });
                              })()");

                      if (string.IsNullOrWhiteSpace(json) ||
                          json == "null")
                      {
                          MessageBox.Show(
                              "No se encontró un elemento de video HTML5 en esta página.",
                              "DLNA Browser",
                              MessageBoxButton.OK,
                              MessageBoxImage.Warning);

                          return;
                      }

                      string decoded =
                          JsonSerializer.Deserialize<string>(
                              json) ?? "";

                      using var data =
                          JsonDocument.Parse(decoded);

                      string source =
                          data.RootElement
                              .GetProperty("src")
                              .GetString() ?? "";

                      string title =
                          data.RootElement
                              .GetProperty("title")
                              .GetString() ??
                          "Video";

                      string type =
                          data.RootElement
                              .GetProperty("type")
                              .GetString() ??
                          "video/mp4";

                      if (!source.StartsWith(
                              "http://",
                              StringComparison.OrdinalIgnoreCase) &&
                          !source.StartsWith(
                              "https://",
                              StringComparison.OrdinalIgnoreCase))
                      {
                          throw new Exception(
                              "La URL del video no es HTTP/HTTPS.");
                      }

                      MediaText.Text =
                          source;

                      string mediaUrl =
                          source;

                      bool isHls =
                          source.Contains(
                              ".m3u8",
                              StringComparison.OrdinalIgnoreCase) ||
                          type.Contains(
                              "mpegurl",
                              StringComparison.OrdinalIgnoreCase);

                      if (!isHls)
                      {
                          mediaUrl =
                              await mediaServer.StartAsync(
                                  source);
                      }

                      StatusText.Text =
                          isHls
                              ? "Enviando HLS a la TV..."
                              : "Preparando stream local...";

                      await DlnaRenderer.SetMediaAsync(
                          device,
                          mediaUrl,
                          isHls
                              ? "application/vnd.apple.mpegurl"
                              : "video/mp4",
                          title);

                      await DlnaRenderer.PlayAsync(
                          device);

                      StatusText.Text =
                          $"Reproduciendo en {device.FriendlyName}";
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show(
                          ex.ToString(),
                          "Error DLNA",
                          MessageBoxButton.OK,
                          MessageBoxImage.Error);

                      StatusText.Text =
                          "Error al enviar video";
                  }
              }

              private void Back_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (Browser.CanGoBack)
                      Browser.GoBack();
              }

              private void Forward_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (Browser.CanGoForward)
                      Browser.GoForward();
              }

              private void Reload_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  Browser.Reload();
              }

              private void Home_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  Browser.CoreWebView2?.Navigate(
                      HomeUrl);
              }

              private void AddressBar_KeyDown(
                  object sender,
                  KeyEventArgs e)
              {
                  if (e.Key != Key.Enter)
                      return;

                  NavigateAddress();
                  e.Handled = true;
              }

              private void NavigateAddress()
              {
                  string address =
                      AddressBar.Text.Trim();

                  if (string.IsNullOrWhiteSpace(address))
                      return;

                  if (!address.StartsWith(
                          "http://",
                          StringComparison.OrdinalIgnoreCase) &&
                      !address.StartsWith(
                          "https://",
                          StringComparison.OrdinalIgnoreCase))
                  {
                      if (address.Contains('.'))
                          address = "https://" + address;
                      else
                          address =
                              "https://www.google.com/search?q=" +
                              Uri.EscapeDataString(address);
                  }

                  Browser.CoreWebView2?.Navigate(
                      address);
              }

              private void Browser_NavigationStarting(
                  object? sender,
                  CoreWebView2NavigationStartingEventArgs e)
              {
                  AddressBar.Text =
                      e.Uri;
              }

              private void Browser_NavigationCompleted(
                  object? sender,
                  CoreWebView2NavigationCompletedEventArgs e)
              {
                  if (Browser.Source != null)
                      AddressBar.Text =
                          Browser.Source.ToString();
              }

              private void TvList_SelectionChanged(
                  object sender,
                  System.Windows.Controls.SelectionChangedEventArgs e)
              {
                  if (TvList.SelectedItem is DlnaDevice device)
                  {
                      StatusText.Text =
                          device.FriendlyName;
                  }
              }
          }
          '@ | Set-Content "src/DLNABrowser/MainWindow.xaml.cs" -Encoding UTF8

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore src/DLNABrowser/DLNABrowser.csproj

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish `
            src/DLNABrowser/DLNABrowser.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o publish

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "publish/DLNABrowser.exe")) {
              throw "DLNABrowser.exe no fue generado."
          }

          Compress-Archive `
            -Path "publish/*" `
            -DestinationPath "DLNABrowser-win-x64.zip" `
            -Force

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "=============================================="
          Get-ChildItem publish | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLNABrowser-win-x64
          path: DLNABrowser-win-x64.zip
          if-no-files-found: error
