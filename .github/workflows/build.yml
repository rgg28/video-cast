          # ========================================================
          # SSDP DISCOVERY
          # ========================================================

          @'
using System.Net;
using System.Net.Sockets;
using System.Text;
using System.Xml.Linq;

namespace DLNABrowser;

public static class SsdpDiscovery
{
    private static readonly HttpClient Http =
        new HttpClient
        {
            Timeout = TimeSpan.FromSeconds(5)
        };


    public static async Task<List<DlnaDevice>> DiscoverAsync(
        CancellationToken cancellationToken = default)
    {
        var devices =
            new List<DlnaDevice>();


        using var udp =
            new UdpClient();


        udp.Client.SetSocketOption(
            SocketOptionLevel.Socket,
            SocketOptionName.ReuseAddress,
            true);


        udp.EnableBroadcast = true;


        var endpoint =
            new IPEndPoint(
                IPAddress.Parse("239.255.255.250"),
                1900);


        string request =
            "M-SEARCH * HTTP/1.1\r\n" +
            "HOST: 239.255.255.250:1900\r\n" +
            "MAN: \"ssdp:discover\"\r\n" +
            "MX: 2\r\n" +
            "ST: urn:schemas-upnp-org:device:MediaRenderer:1\r\n" +
            "\r\n";


        byte[] data =
            Encoding.UTF8.GetBytes(request);


        await udp.SendAsync(
            data,
            data.Length,
            endpoint);


        var timeoutTask =
            Task.Delay(
                TimeSpan.FromSeconds(4),
                cancellationToken);


        while (!timeoutTask.IsCompleted)
        {
            Task<UdpReceiveResult> receiveTask;

            try
            {
                receiveTask =
                    udp.ReceiveAsync();
            }
            catch
            {
                break;
            }


            Task completed =
                await Task.WhenAny(
                    receiveTask,
                    timeoutTask);


            if (completed != receiveTask)
                break;


            UdpReceiveResult packet;

            try
            {
                packet =
                    await receiveTask;
            }
            catch
            {
                break;
            }


            string response =
                Encoding.UTF8.GetString(
                    packet.Buffer);


            var headers =
                ParseHeaders(response);


            if (!headers.TryGetValue(
                    "location",
                    out string? location))
            {
                continue;
            }


            if (devices.Any(
                    x => string.Equals(
                        x.Location,
                        location,
                        StringComparison.OrdinalIgnoreCase)))
            {
                continue;
            }


            try
            {
                DlnaDevice? device =
                    await LoadDeviceAsync(
                        location,
                        cancellationToken);


                if (device != null)
                    devices.Add(device);
            }
            catch
            {
                // Ignore invalid UPnP devices.
            }
        }


        return devices;
    }


    private static Dictionary<string, string> ParseHeaders(
        string response)
    {
        var result =
            new Dictionary<string, string>(
                StringComparer.OrdinalIgnoreCase);


        foreach (string line in response.Split(
            new[] { "\r\n", "\n" },
            StringSplitOptions.RemoveEmptyEntries))
        {
            int separator =
                line.IndexOf(':');


            if (separator <= 0)
                continue;


            string key =
                line[..separator].Trim();


            string value =
                line[(separator + 1)..].Trim();


            result[key] = value;
        }


        return result;
    }


    private static async Task<DlnaDevice?> LoadDeviceAsync(
        string location,
        CancellationToken cancellationToken)
    {
        string xml =
            await Http.GetStringAsync(
                location,
                cancellationToken);


        XDocument document =
            XDocument.Parse(xml);


        XNamespace ns =
            "urn:schemas-upnp-org:device-1-0";


        XElement? device =
            document
                .Descendants(ns + "device")
                .FirstOrDefault();


        if (device == null)
            return null;


        string friendlyName =
            device.Element(
                ns + "friendlyName")
            ?.Value
            ?? "DLNA TV";


        IEnumerable<XElement> services =
            device.Descendants(ns + "service");


        foreach (XElement service in services)
        {
            string serviceType =
                service.Element(
                    ns + "serviceType")
                ?.Value
                ?? "";


            if (!serviceType.Contains(
                    "AVTransport",
                    StringComparison.OrdinalIgnoreCase))
            {
                continue;
            }


            string control =
                service.Element(
                    ns + "controlURL")
                ?.Value
                ?? "";


            if (string.IsNullOrWhiteSpace(control))
                continue;


            Uri baseUri =
                new Uri(location);


            Uri controlUri =
                new Uri(
                    baseUri,
                    control);


            return new DlnaDevice
            {
                DisplayName =
                    friendlyName,

                FriendlyName =
                    friendlyName,

                Location =
                    location,

                ControlUrl =
                    controlUri.ToString(),

                ServiceType =
                    serviceType,

                DeviceType =
                    device.Element(
                        ns + "deviceType")
                    ?.Value
                    ?? ""
            };
        }


        return null;
    }
}
