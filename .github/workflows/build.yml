          # ============================================================
          # C# NATIVE HOST
          # ============================================================

          $programCs = @'
using System.Buffers;
using System.Net;
using System.Net.NetworkInformation;
using System.Net.Sockets;
using System.Text;
using System.Text.Json;
using System.Text.Json.Serialization;
using System.Xml.Linq;

namespace DLNACastHelper;

public sealed class NativeRequest
{
    public string? Id { get; set; }
    public string? Action { get; set; }
    public DlnaDevice? Device { get; set; }
    public string? Url { get; set; }
    public string? Title { get; set; }
    public string? PageUrl { get; set; }
}

public sealed class NativeResponse
{
    public string Id { get; set; } = "";
    public bool Ok { get; set; }

    public object? Devices { get; set; }

    public string? Message { get; set; }
    public string? Error { get; set; }
}

public sealed class DlnaDevice
{
    public string Name { get; set; } = "";
    public string Location { get; set; } = "";
    public string ControlUrl { get; set; } = "";
    public string ServiceType { get; set; } = "";
    public string DeviceId { get; set; } = "";
}

public static class Program
{
    private static readonly JsonSerializerOptions JsonOptions = new()
    {
        PropertyNamingPolicy = JsonNamingPolicy.CamelCase,
        WriteIndented = false
    };

    private static readonly object Sync = new();

    private static readonly Dictionary<string, string> ActiveSources = new();

    private static TcpListener? ProxyListener;
    private static CancellationTokenSource? ProxyCts;

    private static string? CurrentSourceUrl;
    private static string? CurrentPageUrl;

    public static async Task Main(string[] args)
    {
        try
        {
            await NativeLoop();
        }
        catch (Exception ex)
        {
            Log(ex.ToString());
        }
    }

    private static async Task NativeLoop()
    {
        Stream input = Console.OpenStandardInput();
        Stream output = Console.OpenStandardOutput();

        while (true)
        {
            byte[]? data;

            try
            {
                data = await ReadNativeMessage(input);
            }
            catch (Exception ex)
            {
                Log("Read error: " + ex);
                break;
            }

            if (data == null)
            {
                break;
            }

            NativeRequest? request;

            try
            {
                request =
                    JsonSerializer.Deserialize<NativeRequest>(
                        data,
                        JsonOptions
                    );
            }
            catch (Exception ex)
            {
                Log("JSON error: " + ex);

                await WriteNativeMessage(
                    output,
                    new NativeResponse
                    {
                        Id = "",
                        Ok = false,
                        Error = "JSON inválido."
                    }
                );

                continue;
            }

            if (request == null)
            {
                continue;
            }

            NativeResponse response;

            try
            {
                response =
                    await HandleRequest(request);
            }
            catch (Exception ex)
            {
                Log(ex.ToString());

                response = new NativeResponse
                {
                    Id = request.Id ?? "",
                    Ok = false,
                    Error = ex.Message
                };
            }

            await WriteNativeMessage(
                output,
                response
            );
        }
    }

    private static async Task<NativeResponse> HandleRequest(
        NativeRequest request
    )
    {
        string id = request.Id ?? "";

        switch ((request.Action ?? "").ToLowerInvariant())
        {
            case "ping":
                return new NativeResponse
                {
                    Id = id,
                    Ok = true,
                    Message = "DLNA Cast Helper OK"
                };

            case "discover":
            {
                var devices =
                    await Ssdp.DiscoverAsync();

                return new NativeResponse
                {
                    Id = id,
                    Ok = true,
                    Devices = devices
                };
            }

            case "cast":
            {
                if (request.Device == null)
                    throw new InvalidOperationException(
                        "No se especificó una TV."
                    );

                if (string.IsNullOrWhiteSpace(request.Url))
                    throw new InvalidOperationException(
                        "No se especificó una URL de vídeo."
                    );

                string source =
                    request.Url.Trim();

                if (
                    source.StartsWith(
                        "blob:",
                        StringComparison.OrdinalIgnoreCase
                    ) ||
                    source.StartsWith(
                        "data:",
                        StringComparison.OrdinalIgnoreCase
                    )
                )
                {
                    throw new InvalidOperationException(
                        "La fuente usa blob:/data: y no puede exponerse directamente a DLNA."
                    );
                }

                string mediaUrl;

                if (
                    source.Contains(
                        ".m3u8",
                        StringComparison.OrdinalIgnoreCase
                    ) ||
                    source.Contains(
                        ".mpd",
                        StringComparison.OrdinalIgnoreCase
                    )
                )
                {
                    mediaUrl = source;
                }
                else
                {
                    await StartProxy(
                        source,
                        request.PageUrl
                    );

                    mediaUrl =
                        GetProxyUrl(
                            request.Device
                        );
                }

                string title =
                    string.IsNullOrWhiteSpace(request.Title)
                        ? "Chrome Video"
                        : request.Title.Trim();

                await DlnaRenderer.SetAvTransportUri(
                    request.Device,
                    mediaUrl,
                    title
                );

                await DlnaRenderer.Play(
                    request.Device
                );

                return new NativeResponse
                {
                    Id = id,
                    Ok = true,
                    Message =
                        "Reproducción enviada correctamente."
                };
            }

            case "stop":
            {
                if (request.Device == null)
                    throw new InvalidOperationException(
                        "No se especificó una TV."
                    );

                await DlnaRenderer.Stop(
                    request.Device
                );

                return new NativeResponse
                {
                    Id = id,
                    Ok = true,
                    Message =
                        "Reproducción detenida."
                };
            }

            default:
                throw new InvalidOperationException(
                    "Acción desconocida: " +
                    request.Action
                );
        }
    }

    private static async Task StartProxy(
        string sourceUrl,
        string? pageUrl
    )
    {
        lock (Sync)
        {
            CurrentSourceUrl = sourceUrl;
            CurrentPageUrl = pageUrl;

            if (ProxyListener != null)
            {
                return;
            }

            ProxyCts =
                new CancellationTokenSource();

            ProxyListener =
                new TcpListener(
                    IPAddress.Any,
                    38555
                );

            ProxyListener.Start();
        }

        Log("HTTP proxy started on port 38555.");

        _ = Task.Run(
            () => ProxyLoop(ProxyCts!.Token)
        );

        await Task.Delay(50);
    }

    private static string GetProxyUrl(
        DlnaDevice device
    )
    {
        string localIp =
            GetLocalAddressForDevice(
                device
            );

        return
            $"http://{localIp}:38555/media";
    }

    private static string GetLocalAddressForDevice(
        DlnaDevice device
    )
    {
        try
        {
            if (
                Uri.TryCreate(
                    device.Location,
                    UriKind.Absolute,
                    out Uri? target
                )
            )
            {
                using Socket socket =
                    new(
                        AddressFamily.InterNetwork,
                        SocketType.Dgram,
                        ProtocolType.Udp
                    );

                socket.Connect(
                    target.Host,
                    1900
                );

                if (
                    socket.LocalEndPoint
                    is IPEndPoint local
                )
                {
                    return local.Address.ToString();
                }
            }
        }
        catch
        {
        }

        try
        {
            foreach (
                NetworkInterface nic
                in NetworkInterface.GetAllNetworkInterfaces()
            )
            {
                if (
                    nic.OperationalStatus !=
                    OperationalStatus.Up
                )
                    continue;

                foreach (
                    UnicastIPAddressInformation info
                    in nic
                        .GetIPProperties()
                        .UnicastAddresses
                )
                {
                    if (
                        info.Address.AddressFamily ==
                        AddressFamily.InterNetwork &&
                        !IPAddress.IsLoopback(
                            info.Address
                        )
                    )
                    {
                        return info.Address.ToString();
                    }
                }
            }
        }
        catch
        {
        }

        return "127.0.0.1";
    }

    private static async Task ProxyLoop(
        CancellationToken cancellationToken
    )
    {
        while (!cancellationToken.IsCancellationRequested)
        {
            TcpClient? client = null;

            try
            {
                client =
                    await ProxyListener!.AcceptTcpClientAsync(
                        cancellationToken
                    );

                _ = Task.Run(
                    () => HandleProxyClient(
                        client,
                        cancellationToken
                    ),
                    cancellationToken
                );
            }
            catch (OperationCanceledException)
            {
                break;
            }
            catch (Exception ex)
            {
                Log("Proxy accept error: " + ex.Message);

                try
                {
                    client?.Dispose();
                }
                catch
                {
                }

                await Task.Delay(200);
            }
        }
    }

    private static async Task HandleProxyClient(
        TcpClient client,
        CancellationToken cancellationToken
    )
    {
        using (client)
        using (NetworkStream stream = client.GetStream())
        {
            try
            {
                string headers =
                    await ReadHttpHeaders(
                        stream,
                        cancellationToken
                    );

                if (string.IsNullOrWhiteSpace(headers))
                    return;

                string[] lines =
                    headers.Split(
                        "\r\n",
                        StringSplitOptions.RemoveEmptyEntries
                    );

                if (lines.Length == 0)
                    return;

                string[] requestParts =
                    lines[0].Split(
                        ' ',
                        StringSplitOptions.RemoveEmptyEntries
                    );

                if (requestParts.Length < 2)
                {
                    await SendHttpError(
                        stream,
                        400,
                        "Bad Request"
                    );

                    return;
                }

                string method =
                    requestParts[0].ToUpperInvariant();

                string path =
                    requestParts[1];

                if (
                    method != "GET" &&
                    method != "HEAD"
                )
                {
                    await SendHttpError(
                        stream,
                        405,
                        "Method Not Allowed"
                    );

                    return;
                }

                if (
                    !path.StartsWith(
                        "/media",
                        StringComparison.OrdinalIgnoreCase
                    )
                )
                {
                    await SendHttpError(
                        stream,
                        404,
                        "Not Found"
                    );

                    return;
                }

                string? source;

                lock (Sync)
                {
                    source = CurrentSourceUrl;
                }

                if (string.IsNullOrWhiteSpace(source))
                {
                    await SendHttpError(
                        stream,
                        404,
                        "No media"
                    );

                    return;
                }

                string? range =
                    GetHeader(
                        lines,
                        "Range"
                    );

                string? pageUrl;

                lock (Sync)
                {
                    pageUrl = CurrentPageUrl;
                }

                using HttpClient http =
                    new(
                        new HttpClientHandler
                        {
                            AutomaticDecompression =
                                System.Net.DecompressionMethods.None
                        }
                    );

                http.Timeout =
                    TimeSpan.FromMinutes(30);

                using HttpRequestMessage request =
                    new(
                        HttpMethod.Get,
                        source
                    );

                request.Headers.TryAddWithoutValidation(
                    "User-Agent",
                    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"
                );

                if (
                    Uri.TryCreate(
                        pageUrl,
                        UriKind.Absolute,
                        out Uri? referrer
                    )
                )
                {
                    request.Headers.Referrer =
                        referrer;
                }

                if (!string.IsNullOrWhiteSpace(range))
                {
                    request.Headers.TryAddWithoutValidation(
                        "Range",
                        range
                    );
                }

                using HttpResponseMessage response =
                    await http.SendAsync(
                        request,
                        HttpCompletionOption.ResponseHeadersRead,
                        cancellationToken
                    );

                string contentType =
                    response.Content.Headers.ContentType?.ToString()
                    ?? "application/octet-stream";

                long? contentLength =
                    response.Content.Headers.ContentLength;

                string status =
                    response.IsSuccessStatusCode
                        ? (
                            (int)response.StatusCode ==
                            206
                                ? "HTTP/1.1 206 Partial Content"
                                : "HTTP/1.1 200 OK"
                          )
                        : $"HTTP/1.1 {(int)response.StatusCode} {response.ReasonPhrase}";

                StringBuilder responseHeaders =
                    new();

                responseHeaders.Append(
                    status + "\r\n"
                );

                responseHeaders.Append(
                    "Content-Type: " +
                    contentType +
                    "\r\n"
                );

                if (contentLength.HasValue)
                {
                    responseHeaders.Append(
                        "Content-Length: " +
                        contentLength.Value +
                        "\r\n"
                    );
                }

                if (
                    response.Content.Headers.ContentRange
                    != null
                )
                {
                    responseHeaders.Append(
                        "Content-Range: " +
                        response.Content.Headers.ContentRange +
                        "\r\n"
                    );
                }

                responseHeaders.Append(
                    "Accept-Ranges: bytes\r\n"
                );

                responseHeaders.Append(
                    "Access-Control-Allow-Origin: *\r\n"
                );

                responseHeaders.Append(
                    "Connection: close\r\n"
                );

                responseHeaders.Append(
                    "\r\n"
                );

                byte[] headerBytes =
                    Encoding.ASCII.GetBytes(
                        responseHeaders.ToString()
                    );

                await stream.WriteAsync(
                    headerBytes,
                    cancellationToken
                );

                if (method == "HEAD")
                    return;

                await using Stream sourceStream =
                    await response.Content.ReadAsStreamAsync(
                        cancellationToken
                    );

                await sourceStream.CopyToAsync(
                    stream,
                    128 * 1024,
                    cancellationToken
                );
            }
            catch (OperationCanceledException)
            {
            }
            catch (Exception ex)
            {
                Log("Proxy client error: " + ex.Message);
            }
        }
    }

    private static async Task<string> ReadHttpHeaders(
        NetworkStream stream,
        CancellationToken cancellationToken
    )
    {
        using MemoryStream memory =
            new();

        byte[] buffer =
            ArrayPool<byte>.Shared.Rent(4096);

        try
        {
            while (memory.Length < 64 * 1024)
            {
                int read =
                    await stream.ReadAsync(
                        buffer,
                        cancellationToken
                    );

                if (read <= 0)
                    break;

                memory.Write(
                    buffer,
                    0,
                    read
                );

                if (
                    ContainsHeaderEnd(
                        memory.GetBuffer(),
                        (int)memory.Length
                    )
                )
                {
                    break;
                }
            }

            return Encoding.ASCII.GetString(
                memory.ToArray()
            );
        }
        finally
        {
            ArrayPool<byte>.Shared.Return(
                buffer
            );
        }
    }

    private static bool ContainsHeaderEnd(
        byte[] buffer,
        int length
    )
    {
        for (int i = 3; i < length; i++)
        {
            if (
                buffer[i - 3] == 13 &&
                buffer[i - 2] == 10 &&
                buffer[i - 1] == 13 &&
                buffer[i] == 10
            )
            {
                return true;
            }
        }

        return false;
    }

    private static string? GetHeader(
        string[] lines,
        string name
    )
    {
        foreach (string line in lines)
        {
            int separator =
                line.IndexOf(':');

            if (separator <= 0)
                continue;

            string key =
                line[..separator].Trim();

            if (
                key.Equals(
                    name,
                    StringComparison.OrdinalIgnoreCase
                )
            )
            {
                return line[
                    (separator + 1)..
                ].Trim();
            }
        }

        return null;
    }

    private static async Task SendHttpError(
        NetworkStream stream,
        int statusCode,
        string reason
    )
    {
        string body =
            $"DLNA Cast Helper: {reason}";

        byte[] bodyBytes =
            Encoding.UTF8.GetBytes(body);

        string header =
            $"HTTP/1.1 {statusCode} {reason}\r\n" +
            "Content-Type: text/plain; charset=utf-8\r\n" +
            $"Content-Length: {bodyBytes.Length}\r\n" +
            "Connection: close\r\n" +
            "\r\n";

        byte[] headerBytes =
            Encoding.ASCII.GetBytes(header);

        await stream.WriteAsync(
            headerBytes
        );

        await stream.WriteAsync(
            bodyBytes
        );
    }

    private static async Task<byte[]?> ReadNativeMessage(
        Stream input
    )
    {
        byte[] lengthBytes =
            new byte[4];

        int lengthRead =
            await ReadExactly(
                input,
                lengthBytes,
                0,
                4
            );

        if (lengthRead == 0)
            return null;

        if (lengthRead != 4)
            return null;

        int length =
            BitConverter.ToInt32(
                lengthBytes,
                0
            );

        if (length <= 0 || length > 1024 * 1024)
            throw new InvalidOperationException(
                $"Native message size inválido: {length}"
            );

        byte[] data =
            new byte[length];

        int dataRead =
            await ReadExactly(
                input,
                data,
                0,
                length
            );

        if (dataRead != length)
            return null;

        return data;
    }

    private static async Task<int> ReadExactly(
        Stream stream,
        byte[] buffer,
        int offset,
        int count
    )
    {
        int total = 0;

        while (total < count)
        {
            int read =
                await stream.ReadAsync(
                    buffer,
                    offset + total,
                    count - total
                );

            if (read == 0)
                break;

            total += read;
        }

        return total;
    }

    private static async Task WriteNativeMessage(
        Stream output,
        NativeResponse response
    )
    {
        byte[] json =
            JsonSerializer.SerializeToUtf8Bytes(
                response,
                JsonOptions
            );

        if (json.Length > 1024 * 1024)
            throw new InvalidOperationException(
                "Native response too large."
            );

        byte[] length =
            BitConverter.GetBytes(
                json.Length
            );

        await output.WriteAsync(
            length
        );

        await output.WriteAsync(
            json
        );

        await output.FlushAsync();
    }

    private static void Log(string text)
    {
        try
        {
            Console.Error.WriteLine(
                DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss") +
                " " +
                text
            );
        }
        catch
        {
        }
    }
}

public static class Ssdp
{
    public static async Task<List<DlnaDevice>> DiscoverAsync()
    {
        using UdpClient client =
            new(
                new IPEndPoint(
                    IPAddress.Any,
                    0
                )
            );

        client.Client.SetSocketOption(
            SocketOptionLevel.Socket,
            SocketOptionName.Broadcast,
            true
        );

        client.Client.ReceiveTimeout = 1800;

        string request =
            "M-SEARCH * HTTP/1.1\r\n" +
            "HOST: 239.255.255.250:1900\r\n" +
            "MAN: \"ssdp:discover\"\r\n" +
            "MX: 2\r\n" +
            "ST: urn:schemas-upnp-org:device:MediaRenderer:1\r\n" +
            "\r\n";

        byte[] bytes =
            Encoding.ASCII.GetBytes(
                request
            );

        await client.SendAsync(
            bytes,
            bytes.Length,
            new IPEndPoint(
                IPAddress.Parse(
                    "239.255.255.250"
                ),
                1900
            )
        );

        Dictionary<string, DlnaDevice> found =
            new(
                StringComparer.OrdinalIgnoreCase
            );

        DateTime deadline =
            DateTime.UtcNow.AddSeconds(3);

        while (
            DateTime.UtcNow < deadline
        )
        {
            try
            {
                using CancellationTokenSource timeout =
                    new(
                        TimeSpan.FromMilliseconds(700)
                    );

                UdpReceiveResult result =
                    await client.ReceiveAsync(
                        timeout.Token
                    );

                string response =
                    Encoding.ASCII.GetString(
                        result.Buffer
                    );

                Dictionary<string, string> headers =
                    ParseHeaders(response);

                if (
                    !headers.TryGetValue(
                        "location",
                        out string? location
                    )
                )
                {
                    continue;
                }

                DlnaDevice? device =
                    await ReadDevice(
                        location
                    );

                if (device == null)
                    continue;

                string key =
                    device.ControlUrl;

                if (!found.ContainsKey(key))
                {
                    found[key] = device;
                }
            }
            catch (OperationCanceledException)
            {
            }
            catch (SocketException)
            {
                break;
            }
            catch
            {
            }
        }

        return found.Values
            .OrderBy(
                x => x.Name,
                StringComparer.OrdinalIgnoreCase
            )
            .ToList();
    }

    private static Dictionary<string, string> ParseHeaders(
        string response
    )
    {
        Dictionary<string, string> result =
            new(
                StringComparer.OrdinalIgnoreCase
            );

        string[] lines =
            response.Split(
                "\r\n",
                StringSplitOptions.RemoveEmptyEntries
            );

        foreach (string line in lines)
        {
            int colon =
                line.IndexOf(':');

            if (colon <= 0)
                continue;

            string key =
                line[..colon]
                    .Trim()
                    .ToLowerInvariant();

            string value =
                line[(colon + 1)..]
                    .Trim();

            result[key] = value;
        }

        return result;
    }

    private static async Task<DlnaDevice?> ReadDevice(
        string location
    )
    {
        try
        {
            using HttpClient http =
                new();

            http.Timeout =
                TimeSpan.FromSeconds(5);

            string xml =
                await http.GetStringAsync(
                    location
                );

            XDocument document =
                XDocument.Parse(xml);

            XNamespace deviceNs =
                "urn:schemas-upnp-org:device-1-0";

            XNamespace serviceNs =
                "urn:schemas-upnp-org:device-1-0";

            XElement? device =
                document.Descendants(
                    deviceNs + "device"
                ).FirstOrDefault();

            if (device == null)
            {
                device =
                    document
                        .Descendants()
                        .FirstOrDefault(
                            x => x.Name.LocalName == "device"
                        );
            }

            string name =
                device?
                    .Elements()
                    .FirstOrDefault(
                        x =>
                            x.Name.LocalName ==
                            "friendlyName"
                    )?
                    .Value
                ?? "DLNA Media Renderer";

            IEnumerable<XElement> services =
                document
                    .Descendants()
                    .Where(
                        x =>
                            x.Name.LocalName ==
                            "service"
                    );

            foreach (XElement service in services)
            {
                string serviceType =
                    service
                        .Elements()
                        .FirstOrDefault(
                            x =>
                                x.Name.LocalName ==
                                "serviceType"
                        )?
                        .Value
                    ?? "";

                if (
                    !serviceType.Contains(
                        "AVTransport",
                        StringComparison.OrdinalIgnoreCase
                    )
                )
                {
                    continue;
                }

                string control =
                    service
                        .Elements()
                        .FirstOrDefault(
                            x =>
                                x.Name.LocalName ==
                                "controlURL"
                        )?
                        .Value
                    ?? "";

                if (string.IsNullOrWhiteSpace(control))
                    continue;

                Uri baseUri =
                    new(location);

                Uri controlUri =
                    new(
                        baseUri,
                        control
                    );

                return new DlnaDevice
                {
                    Name = name.Trim(),
                    Location = location,
                    ControlUrl =
                        controlUri.ToString(),
                    ServiceType =
                        serviceType.Trim(),
                    DeviceId =
                        controlUri.ToString()
                };
            }
        }
        catch
        {
        }

        return null;
    }
}

public static class DlnaRenderer
{
    private static readonly HttpClient Http =
        new();

    public static async Task SetAvTransportUri(
        DlnaDevice device,
        string mediaUrl,
        string title
    )
    {
        string mime =
            GuessMimeType(
                mediaUrl
            );

        string metadata =
            BuildMetadata(
                mediaUrl,
                title,
                mime
            );

        string escapedMetadata =
            SecurityElementEscape(
                metadata
            );

        string escapedUrl =
            SecurityElementEscape(
                mediaUrl
            );

        string body =
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
            "<s:Envelope " +
            "xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" " +
            "s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">" +
            "<s:Body>" +
            "<u:SetAVTransportURI " +
            "xmlns:u=\"urn:schemas-upnp-org:service:AVTransport:1\">" +
            "<InstanceID>0</InstanceID>" +
            "<CurrentURI>" +
            escapedUrl +
            "</CurrentURI>" +
            "<CurrentURIMetaData>" +
            escapedMetadata +
            "</CurrentURIMetaData>" +
            "</u:SetAVTransportURI>" +
            "</s:Body>" +
            "</s:Envelope>";

        await Soap(
            device,
            "SetAVTransportURI",
            body
        );
    }

    public static async Task Play(
        DlnaDevice device
    )
    {
        string body =
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
            "<s:Envelope " +
            "xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" " +
            "s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">" +
            "<s:Body>" +
            "<u:Play " +
            "xmlns:u=\"urn:schemas-upnp-org:service:AVTransport:1\">" +
            "<InstanceID>0</InstanceID>" +
            "<Speed>1</Speed>" +
            "</u:Play>" +
            "</s:Body>" +
            "</s:Envelope>";

        await Soap(
            device,
            "Play",
            body
        );
    }

    public static async Task Stop(
        DlnaDevice device
    )
    {
        string body =
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
            "<s:Envelope " +
            "xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" " +
            "s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">" +
            "<s:Body>" +
            "<u:Stop " +
            "xmlns:u=\"urn:schemas-upnp-org:service:AVTransport:1\">" +
            "<InstanceID>0</InstanceID>" +
            "</u:Stop>" +
            "</s:Body>" +
            "</s:Envelope>";

        await Soap(
            device,
            "Stop",
            body
        );
    }

    private static async Task Soap(
        DlnaDevice device,
        string action,
        string body
    )
    {
        using HttpRequestMessage request =
            new(
                HttpMethod.Post,
                device.ControlUrl
            );

        request.Content =
            new StringContent(
                body,
                Encoding.UTF8,
                "text/xml"
            );

        request.Headers.TryAddWithoutValidation(
            "SOAPAction",
            $"\"{device.ServiceType}#{action}\""
        );

        using HttpResponseMessage response =
            await Http.SendAsync(
                request
            );

        string responseBody =
            await response.Content.ReadAsStringAsync();

        if (!response.IsSuccessStatusCode)
        {
            throw new InvalidOperationException(
                $"La TV rechazó {action}: " +
                $"{(int)response.StatusCode} " +
                response.ReasonPhrase +
                "\n" +
                responseBody
            );
        }
    }

    private static string BuildMetadata(
        string url,
        string title,
        string mime
    )
    {
        string safeTitle =
            SecurityElementEscape(
                title
            );

        string safeUrl =
            SecurityElementEscape(
                url
            );

        return
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
            "<DIDL-Lite " +
            "xmlns=\"urn:schemas-upnp-org:metadata-1-0/DIDL-Lite/\" " +
            "xmlns:dc=\"http://purl.org/dc/elements/1.1/\" " +
            "xmlns:upnp=\"urn:schemas-upnp-org:metadata-1-0/upnp/\">" +
            "<item id=\"0\" parentID=\"-1\" restricted=\"1\">" +
            "<dc:title>" +
            safeTitle +
            "</dc:title>" +
            "<upnp:class>object.item.videoItem</upnp:class>" +
            "<res protocolInfo=\"http-get:*:" +
            mime +
            ":*\">" +
            safeUrl +
            "</res>" +
            "</item>" +
            "</DIDL-Lite>";
    }

    private static string GuessMimeType(
        string url
    )
    {
        string lower =
            url.ToLowerInvariant();

        if (lower.Contains(".m3u8"))
            return "application/vnd.apple.mpegurl";

        if (lower.Contains(".mpd"))
            return "application/dash+xml";

        if (lower.Contains(".webm"))
            return "video/webm";

        if (lower.Contains(".mov"))
            return "video/quicktime";

        if (lower.Contains(".mkv"))
            return "video/x-matroska";

        return "video/mp4";
    }

    private static string SecurityElementEscape(
        string value
    )
    {
        return
            System.Security.SecurityElement
                .Escape(value)
            ?? "";
    }
}
'@

          Write-Utf8NoBom `
            (Join-Path $helper "Program.cs") `
            $programCs

          # ============================================================
          # BUILD HELPER
          # ============================================================

          Write-Host "=============================================="
          Write-Host "BUILDING NATIVE HELPER"
          Write-Host "=============================================="

          dotnet restore `
            (Join-Path $helper "DLNACastHelper.csproj")

          $helperPublish =
            Join-Path $publish "helper"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $helperPublish |
            Out-Null

          dotnet publish `
            (Join-Path $helper "DLNACastHelper.csproj") `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o $helperPublish

          # ============================================================
          # COPY EXTENSION
          # ============================================================

          Write-Host "=============================================="
          Write-Host "PACKAGING EXTENSION"
          Write-Host "=============================================="

          $publishExt =
            Join-Path $publish "extension"

          $publishHost =
            Join-Path $publish "native-host"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $publishExt |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $publishHost |
            Out-Null

          Copy-Item `
            (Join-Path $ext "*") `
            $publishExt `
            -Recurse `
            -Force

          # ============================================================
          # NATIVE HOST MANIFEST
          #
          # Helper and manifest are installed into the same directory,
          # therefore the relative path works on Windows.
          # ============================================================

          $nativeManifest = @{
            name = "com.rgg28.dlnacast"
            description = "DLNA Cast Native Host"
            path = "DLNACastHelper.exe"
            type = "stdio"
            allowed_origins = @(
              "chrome-extension://$extensionId/"
            )
          } | ConvertTo-Json -Depth 10

          Write-Utf8NoBom `
            (Join-Path $publishHost "com.rgg28.dlnacast.json") `
            $nativeManifest

          # ============================================================
          # INSTALLER
          # ============================================================

          $installer = @'
@echo off
setlocal EnableExtensions

echo.
echo ==============================================
echo DLNA CAST INSTALLER
echo ==============================================
echo.

set "BASE=%~dp0"
set "INSTALL=%LOCALAPPDATA%\DLNACast"
set "HOSTDIR=%INSTALL%\host"
set "EXTDIR=%INSTALL%\extension"

echo Installing into:
echo %INSTALL%
echo.

if not exist "%INSTALL%" mkdir "%INSTALL%"
if not exist "%HOSTDIR%" mkdir "%HOSTDIR%"
if not exist "%EXTDIR%" mkdir "%EXTDIR%"

echo Copying native helper...
copy /Y "%BASE%helper\DLNACastHelper.exe" "%HOSTDIR%\DLNACastHelper.exe" >nul

if errorlevel 1 (
    echo ERROR: Could not copy DLNACastHelper.exe
    pause
    exit /b 1
)

echo Copying native host manifest...
copy /Y "%BASE%native-host\com.rgg28.dlnacast.json" "%HOSTDIR%\com.rgg28.dlnacast.json" >nul

if errorlevel 1 (
    echo ERROR: Could not copy native host manifest.
    pause
    exit /b 1
)

echo Copying Chrome extension...
if exist "%EXTDIR%" rmdir /S /Q "%EXTDIR%"
mkdir "%EXTDIR%"

xcopy "%BASE%extension\*" "%EXTDIR%\" /E /I /Y >nul

if errorlevel 1 (
    echo ERROR: Could not copy Chrome extension.
    pause
    exit /b 1
)

echo.
