using System.Text.Json;
using System.Windows;
using System.Windows.Input;
using Microsoft.Web.WebView2.Core;

namespace DLNABrowser;

public partial class MainWindow : Window
{
    private const string HomeUrl =
        "https://www.google.com/";


    private readonly LocalMediaServer mediaServer =
        new();


    private List<DlnaDevice> devices =
        new();


    public MainWindow()
    {
        InitializeComponent();

        Loaded +=
            MainWindow_Loaded;

        Closed +=
            MainWindow_Closed;
    }


    private async void MainWindow_Loaded(
        object sender,
        RoutedEventArgs e)
    {
        try
        {
            await Browser.EnsureCoreWebView2Async();


            Browser.CoreWebView2.Settings
                .AreDefaultContextMenusEnabled =
                true;


            Browser.CoreWebView2.Settings
                .AreDevToolsEnabled =
                true;


            Browser.CoreWebView2.Navigate(
                HomeUrl);


            await DiscoverDevicesAsync();
        }
        catch (Exception ex)
        {
            StatusText.Text =
                "WebView2: " +
                ex.Message;
        }
    }


    private void MainWindow_Closed(
        object? sender,
        EventArgs e)
    {
        mediaServer.Dispose();
    }


    private async Task DiscoverDevicesAsync()
    {
        StatusText.Text =
            "Buscando TVs DLNA...";


        TvList.Items.Clear();


        try
        {
            devices =
                await SsdpDiscovery.DiscoverAsync();


            foreach (DlnaDevice device
                in devices)
            {
                TvList.Items.Add(
                    device);
            }


            if (devices.Count > 0)
            {
                TvList.SelectedIndex =
                    0;


                StatusText.Text =
                    $"{devices.Count} TV(s) encontrada(s)";
            }
            else
            {
                StatusText.Text =
                    "No se encontraron TVs DLNA";
            }
        }
        catch (Exception ex)
        {
            StatusText.Text =
                "DLNA: " +
                ex.Message;
        }
    }


    private async void Discover_Click(
        object sender,
        RoutedEventArgs e)
    {
        await DiscoverDevicesAsync();
    }


    private async void SendToTv_Click(
        object sender,
        RoutedEventArgs e)
    {
        if (TvList.SelectedItem
            is not DlnaDevice device)
        {
            MessageBox.Show(
                "Selecciona una TV DLNA.",
                "DLNA Browser",
                MessageBoxButton.OK,
                MessageBoxImage.Information);

            return;
        }


        try
        {
            StatusText.Text =
                "Detectando video...";


            string script = @"
                (() => {

                    const videos =
                        Array.from(
                            document.querySelectorAll('video')
                        );

                    const video =
                        videos.find(
                            x => x.currentSrc
                        ) ||
                        videos.find(
                            x => x.src
                        );

                    if (!video)
                        return null;

                    return JSON.stringify({

                        src:
                            video.currentSrc ||
                            video.src,

                        type:
                            video.currentSrc &&
                            video.currentSrc
                                .toLowerCase()
                                .includes('.m3u8')
                                ? 'application/vnd.apple.mpegurl'
                                : (
                                    video.type ||
                                    'video/mp4'
                                ),

                        title:
                            document.title ||
                            'Video'

                    });

                })();
            ";


            string raw =
                await Browser.ExecuteScriptAsync(
                    script);


            if (string.IsNullOrWhiteSpace(raw) ||
                raw == "null")
            {
                MessageBox.Show(
                    "No se encontró un video HTML5 en esta página.",
                    "DLNA Browser",
                    MessageBoxButton.OK,
                    MessageBoxImage.Warning);

                return;
            }


            string decoded =
                JsonSerializer.Deserialize<string>(
                    raw)
                ?? "";


            using JsonDocument json =
                JsonDocument.Parse(
                    decoded);


            string source =
                json.RootElement
                    .GetProperty("src")
                    .GetString()
                ?? "";


            string title =
                json.RootElement
                    .GetProperty("title")
                    .GetString()
                ?? "Video";


            string mime =
                json.RootElement
                    .GetProperty("type")
                    .GetString()
                ?? "video/mp4";


            if (!source.StartsWith(
                    "http://",
                    StringComparison.OrdinalIgnoreCase) &&
                !source.StartsWith(
                    "https://",
                    StringComparison.OrdinalIgnoreCase))
            {
                throw new Exception(
                    "La URL del video no es HTTP/HTTPS.");
            }


            MediaText.Text =
                source;


            bool isHls =
                source.Contains(
                    ".m3u8",
                    StringComparison.OrdinalIgnoreCase) ||
                mime.Contains(
                    "mpegurl",
                    StringComparison.OrdinalIgnoreCase);


            string mediaUrl;


            if (isHls)
            {
                mediaUrl =
                    source;
            }
            else
            {
                StatusText.Text =
                    "Creando stream local...";


                mediaUrl =
                    await mediaServer.StartAsync(
                        source);
            }


            StatusText.Text =
                "Enviando video a la TV...";


            await DlnaRenderer.SetMediaAsync(
                device,
                mediaUrl,
                isHls
                    ? "application/vnd.apple.mpegurl"
                    : "video/mp4",
                title);


            StatusText.Text =
                "Iniciando reproducción...";


            await DlnaRenderer.PlayAsync(
                device);


            StatusText.Text =
                $"Reproduciendo en {device.FriendlyName}";
        }
        catch (Exception ex)
        {
            MessageBox.Show(
                ex.ToString(),
                "Error DLNA",
                MessageBoxButton.OK,
                MessageBoxImage.Error);


            StatusText.Text =
                "Error al enviar video";
        }
    }


    private void Back_Click(
        object sender,
        RoutedEventArgs e)
    {
        if (Browser.CanGoBack)
            Browser.GoBack();
    }


    private void Forward_Click(
        object sender,
        RoutedEventArgs e)
    {
        if (Browser.CanGoForward)
            Browser.GoForward();
    }


    private void Reload_Click(
        object sender,
        RoutedEventArgs e)
    {
        Browser.Reload();
    }


    private void Home_Click(
        object sender,
        RoutedEventArgs e)
    {
        Browser.CoreWebView2?.Navigate(
            HomeUrl);
    }


    private void AddressBar_KeyDown(
        object sender,
        KeyEventArgs e)
    {
        if (e.Key != Key.Enter)
            return;


        NavigateAddress();


        e.Handled =
            true;
    }


    private void NavigateAddress()
    {
        string address =
            AddressBar.Text.Trim();


        if (string.IsNullOrWhiteSpace(
                address))
            return;


        if (!address.StartsWith(
                "http://",
                StringComparison.OrdinalIgnoreCase) &&
            !address.StartsWith(
                "https://",
                StringComparison.OrdinalIgnoreCase))
        {
            if (address.Contains('.'))
            {
                address =
                    "https://" +
                    address;
            }
            else
            {
                address =
                    "https://www.google.com/search?q=" +
                    Uri.EscapeDataString(
                        address);
            }
        }


        Browser.CoreWebView2?.Navigate(
            address);
    }


    private void Browser_NavigationStarting(
        object? sender,
        CoreWebView2NavigationStartingEventArgs e)
    {
        AddressBar.Text =
            e.Uri;
    }


    private void Browser_NavigationCompleted(
        object? sender,
        CoreWebView2NavigationCompletedEventArgs e)
    {
        if (Browser.Source != null)
        {
            AddressBar.Text =
                Browser.Source.ToString();
        }
    }


    private void TvList_SelectionChanged(
        object sender,
        System.Windows.Controls.SelectionChangedEventArgs e)
    {
        if (TvList.SelectedItem
            is DlnaDevice device)
        {
            StatusText.Text =
                device.FriendlyName;
        }
    }
}
'@ |
          Set-Content `
            "src/DLNABrowser/MainWindow.xaml.cs" `
            -Encoding UTF8


          Write-Host ""
          Write-Host "=============================================="
          Write-Host "PROJECT CREATED"
          Write-Host "=============================================="
          Write-Host ""


      # ============================================================
      # RESTORE
      # ============================================================

      - name: Restore dependencies
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "RESTORING DEPENDENCIES"
          Write-Host "=============================================="
          Write-Host ""

          dotnet restore `
            "src/DLNABrowser/DLNABrowser.csproj"


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build application
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILDING APPLICATION"
          Write-Host "=============================================="
          Write-Host ""

          dotnet publish `
            "src/DLNABrowser/DLNABrowser.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output "publish"


      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify build
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "VERIFYING BUILD"
          Write-Host "=============================================="
          Write-Host ""

          if (!(Test-Path "publish/DLNABrowser.exe"))
          {
              Write-Host "ERROR: DLNABrowser.exe was not generated."
              exit 1
          }

          $exe =
              Get-Item "publish/DLNABrowser.exe"

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host (
              "{0:N0} bytes" -f $exe.Length
          )

          Write-Host ""
          Write-Host "Files:"
          Get-ChildItem "publish" |
              Select-Object Name, Length |
              Format-Table


      # ============================================================
      # ZIP
      # ============================================================

      - name: Create ZIP
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "CREATING ZIP"
          Write-Host "=============================================="
          Write-Host ""

          if (!(Test-Path "publish/DLNABrowser.exe"))
          {
              throw "DLNABrowser.exe not found."
          }

          if (Test-Path "DLNABrowser-win-x64.zip")
          {
              Remove-Item `
                "DLNABrowser-win-x64.zip" `
                -Force
          }

          Compress-Archive `
            -Path "publish/*" `
            -DestinationPath "DLNABrowser-win-x64.zip" `
            -CompressionLevel Optimal `
            -Force

          $zip =
              Get-Item "DLNABrowser-win-x64.zip"

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $zip.FullName

          Write-Host ""
          Write-Host "ZIP SIZE:"
          Write-Host (
              "{0:N0} bytes" -f $zip.Length
          )


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DLNABrowser-win-x64
          path: DLNABrowser-win-x64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # FINAL
      # ============================================================

      - name: Build completed
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Artifact:"
          Write-Host "DLNABrowser-win-x64"
          Write-Host ""
          Write-Host "The application is ready."
          Write-Host ""
