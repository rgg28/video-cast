netsh advfirewall firewall delete rule name="DLNA Cast Media Proxy" >nul 2>&1

netsh advfirewall firewall add rule ^
    name="DLNA Cast Media Proxy" ^
    dir=in ^
    action=allow ^
    protocol=TCP ^
    localport=38555 ^
    profile=private ^
    >nul

echo.
