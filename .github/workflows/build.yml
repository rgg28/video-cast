echo INSTALLATION COMPLETE
echo ==============================================
echo.
echo Chrome extension directory:
echo %EXTDIR%
echo.
echo NEXT:
echo.
echo 1. Open Chrome.
echo 2. Open chrome://extensions/
echo 3. Enable Developer mode.
echo 4. Click "Load unpacked".
echo 5. Select:
echo.
echo    %EXTDIR%
echo.
echo 6. Pin "DLNA Cast" to the Chrome toolbar.
echo.
echo The native helper is already registered.
echo.
echo ==============================================
echo.

start "" chrome://extensions/

pause
exit /b 0
'@

          Write-Utf8NoBom `
            (Join-Path $publish "Install-DLNACast.bat") `
            $installer

          # ============================================================
          # UNINSTALLER
          # ============================================================

          $uninstaller = @'
@echo off
setlocal EnableExtensions

echo.
echo ==============================================
echo DLNA CAST UNINSTALLER
echo ==============================================
echo.

reg delete "HKCU\Software\Google\Chrome\NativeMessagingHosts\com.rgg28.dlnacast" /f >nul 2>&1

netsh advfirewall firewall delete rule name="DLNA Cast Media Proxy" >nul 2>&1

if exist "%LOCALAPPDATA%\DLNACast" (
    rmdir /S /Q "%LOCALAPPDATA%\DLNACast"
)

echo.
echo DLNA Cast was removed.
echo.
pause
exit /b 0
'@

          Write-Utf8NoBom `
            (Join-Path $publish "Uninstall-DLNACast.bat") `
            $uninstaller

          # ============================================================
          # README
          # ============================================================

          $readme = @"
DLNA CAST FOR CHROME
====================

Extension ID:
$extensionId

Native host:
com.rgg28.dlnacast

INSTALLATION
------------

1. Run:

   Install-DLNACast.bat

2. Chrome will open chrome://extensions/

3. Enable Developer mode.

4. Click "Load unpacked".

5. Select:

   %LOCALAPPDATA%\DLNACast\extension

6. Pin "DLNA Cast" to Chrome.

USAGE
-----

1. Open a video in Chrome.
2. Play it normally.
3. Click the DLNA Cast extension.
4. Click "Buscar TV".
5. Select the TV.
6. Click "Enviar a TV".

The video remains local to the PC until "Enviar a TV" is pressed.

STOP
----

Click "Detener" from the extension popup.

IMPORTANT
---------

DLNA is not screen mirroring.

The extension can expose normal HTTP/HTTPS video URLs to the TV.

Simple MP4/HTTP video is the most compatible case.

Some formats/sites cannot be cast directly:

- blob:
- data:
- DRM / EME
- Netflix
- Disney+
- Prime Video DRM streams
- some MediaSource streams
- browser-only encrypted streams

HLS .m3u8 and MPEG-DASH .mpd are passed directly to the TV.
Whether they play depends on the TV's DLNA/player capabilities.

NETWORK
-------

The PC and TV must normally be on the same LAN.

The helper uses TCP port 38555 for the local media proxy.

The installer creates a Windows Firewall rule for Private networks.

UNINSTALL
---------

Run:

   Uninstall-DLNACast.bat
"@

          Write-Utf8NoBom `
            (Join-Path $publish "README.txt") `
            $readme

          # ============================================================
          # VERSION INFO
          # ============================================================

          $version = @"
DLNA Cast
Version: 1.0.0

Chrome Extension ID:
$extensionId

Native Host:
com.rgg28.dlnacast

Build:
$env:GITHUB_RUN_NUMBER
"@

          Write-Utf8NoBom `
            (Join-Path $publish "VERSION.txt") `
            $version

          # ============================================================
          # VALIDATE FILES
          # ============================================================

          Write-Host "=============================================="
          Write-Host "VALIDATING PACKAGE"
          Write-Host "=============================================="

          $required = @(
            (Join-Path $publishExt "manifest.json"),
            (Join-Path $publishExt "popup.html"),
            (Join-Path $publishExt "popup.js"),
            (Join-Path $publishExt "service-worker.js"),
            (Join-Path $publishHost "com.rgg28.dlnacast.json"),
            (Join-Path $publish "helper\DLNACastHelper.exe"),
            (Join-Path $publish "Install-DLNACast.bat"),
            (Join-Path $publish "Uninstall-DLNACast.bat"),
            (Join-Path $publish "README.txt")
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required file missing: $file"
            }

            Write-Host "OK: $file"
          }

          $manifestObject =
            Get-Content `
              (Join-Path $publishExt "manifest.json") `
              -Raw |
            ConvertFrom-Json

          if (
            $manifestObject.manifest_version -ne 3
          ) {
            throw "Extension manifest is not Manifest V3."
          }

          $hostObject =
            Get-Content `
              (Join-Path $publishHost "com.rgg28.dlnacast.json") `
              -Raw |
            ConvertFrom-Json

          if (
            $hostObject.name -ne
            "com.rgg28.dlnacast"
          ) {
            throw "Native host name mismatch."
          }

          if (
            $hostObject.allowed_origins[0] -ne
            "chrome-extension://$extensionId/"
          ) {
            throw "Native host allowed_origins mismatch."
          }

          # ============================================================
          # ZIP
          # ============================================================

          $zip =
            Join-Path `
              $env:GITHUB_WORKSPACE `
              "DLNA-Cast-Windows.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path (Join-Path $publish "*") `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILD COMPLETE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Extension ID:"
          Write-Host $extensionId
          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $zip
          Write-Host ""

      - name: Upload DLNA Cast
        uses: actions/upload-artifact@v4
        with:
          name: DLNA-Cast-Windows
          path: |
            DLNA-Cast-Windows.zip
            DLNA-Cast/publish/**
          if-no-files-found: error
          retention-days: 30
