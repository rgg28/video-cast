          @'
          using Microsoft.Web.WebView2.Core;
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using System.Threading.Tasks;
          using System.Windows;
          using System.Windows.Input;

          namespace DLNABrowser;

          public partial class MainWindow : Window
          {
              private readonly DlnaRenderer _renderer = new();
              private readonly LocalMediaServer _mediaServer = new();

              private List<DlnaDevice> _devices = new();

              private bool _browserReady;
              private bool _casting;


              public MainWindow()
              {
                  InitializeComponent();

                  Loaded += MainWindow_Loaded;
                  Closed += MainWindow_Closed;
              }


              private async void MainWindow_Loaded(
                  object sender,
                  RoutedEventArgs e)
              {
                  await InitializeBrowserAsync();
              }


              private async Task InitializeBrowserAsync()
              {
                  try
                  {
                      string? version =
                          CoreWebView2Environment
                              .GetAvailableBrowserVersionString();

                      if (string.IsNullOrWhiteSpace(version))
                      {
                          MessageBox.Show(
                              "WebView2 Runtime no está instalado.\n\n" +
                              "Ejecuta Start-DLNABrowser.bat para instalarlo " +
                              "automáticamente.",
                              "DLNA Browser",
                              MessageBoxButton.OK,
                              MessageBoxImage.Warning);

                          return;
                      }

                      await Browser.EnsureCoreWebView2Async();

                      Browser.CoreWebView2.Settings
                          .AreDefaultContextMenusEnabled = true;

                      Browser.CoreWebView2.Settings
                          .AreDevToolsEnabled = true;

                      Browser.CoreWebView2.NavigationCompleted +=
                          Browser_NavigationCompleted;

                      Browser.CoreWebView2.Navigate(
                          "https://www.google.com");

                      _browserReady = true;

                      StatusText.Text =
                          "Listo — el vídeo se reproduce en el PC. " +
                          "Pulsa «Enviar a TV» solamente cuando quieras transmitirlo.";
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show(
                          "No se pudo iniciar el navegador.\n\n" +
                          ex.Message,
                          "DLNA Browser",
                          MessageBoxButton.OK,
                          MessageBoxImage.Error);
                  }
              }


              private void Browser_NavigationCompleted(
                  object? sender,
                  CoreWebView2NavigationCompletedEventArgs e)
              {
                  if (Browser.CoreWebView2 != null)
                  {
                      AddressBox.Text =
                          Browser.CoreWebView2.Source;
                  }
              }


              private void AddressBox_KeyDown(
                  object sender,
                  KeyEventArgs e)
              {
                  if (e.Key == Key.Enter)
                  {
                      NavigateAddress();
                  }
              }


              private void GoButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  NavigateAddress();
              }


              private void NavigateAddress()
              {
                  if (!_browserReady)
                      return;

                  string url =
                      AddressBox.Text.Trim();

                  if (string.IsNullOrWhiteSpace(url))
                      return;

                  if (!url.Contains("://"))
                  {
                      url = "https://www.google.com/search?q=" +
                            Uri.EscapeDataString(url);
                  }

                  Browser.CoreWebView2.Navigate(url);
              }


              private void BackButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (_browserReady &&
                      Browser.CoreWebView2.CanGoBack)
                  {
                      Browser.CoreWebView2.GoBack();
                  }
              }


              private void ForwardButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (_browserReady &&
                      Browser.CoreWebView2.CanGoForward)
                  {
                      Browser.CoreWebView2.GoForward();
                  }
              }


              private void ReloadButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (_browserReady)
                      Browser.CoreWebView2.Reload();
              }


              private void HomeButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (_browserReady)
                      Browser.CoreWebView2.Navigate(
                          "https://www.google.com");
              }


              private async void DiscoverButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  await DiscoverDevicesAsync();
              }


              private async Task DiscoverDevicesAsync()
              {
                  DiscoverButton.IsEnabled = false;

                  StatusText.Text =
                      "Buscando televisores DLNA/UPnP...";

                  try
                  {
                      _devices =
                          await SsdpDiscovery.DiscoverAsync();

                      DeviceCombo.ItemsSource =
                          _devices;

                      if (_devices.Count > 0)
                      {
                          DeviceCombo.SelectedIndex = 0;

                          StatusText.Text =
                              $"Encontrados {_devices.Count} reproductor(es) DLNA.";
                      }
                      else
                      {
                          StatusText.Text =
                              "No se encontraron dispositivos DLNA.";
                      }
                  }
                  catch (Exception ex)
                  {
                      StatusText.Text =
                          "Error buscando dispositivos: " +
                          ex.Message;
                  }
                  finally
                  {
                      DiscoverButton.IsEnabled = true;
                  }
              }


              private async void CastButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (!_browserReady)
                      return;

                  if (DeviceCombo.SelectedItem is not DlnaDevice device)
                  {
                      MessageBox.Show(
                          "Primero selecciona una TV DLNA.",
                          "DLNA Browser",
                          MessageBoxButton.OK,
                          MessageBoxImage.Information);

                      return;
                  }

                  try
                  {
                      CastButton.IsEnabled = false;

                      StatusText.Text =
                          "Detectando el vídeo que está reproduciendo...";

                      string? videoUrl =
                          await Browser.CoreWebView2.ExecuteScriptAsync(
                              """
                              (() => {
                                  const videos =
                                      Array.from(document.querySelectorAll("video"));

                                  for (const v of videos) {
                                      if (!v.paused && v.currentSrc)
                                          return v.currentSrc;
                                  }

                                  for (const v of videos) {
                                      if (v.currentSrc)
                                          return v.currentSrc;
                                  }

                                  return "";
                              })()
                              """);

                      videoUrl =
                          System.Text.Json.JsonSerializer
                              .Deserialize<string>(videoUrl);

                      if (string.IsNullOrWhiteSpace(videoUrl))
                      {
                          MessageBox.Show(
                              "No pude encontrar un vídeo reproducible " +
                              "en la página actual.\n\n" +
                              "El sitio puede utilizar DRM, blob: o un " +
                              "sistema de reproducción que no expone una URL " +
                              "directa al navegador.",
                              "DLNA Browser",
                              MessageBoxButton.OK,
                              MessageBoxImage.Information);

                          return;
                      }

                      if (videoUrl.StartsWith(
                              "blob:",
                              StringComparison.OrdinalIgnoreCase))
                      {
                          MessageBox.Show(
                              "Este vídeo utiliza una URL blob: y no puede " +
                              "enviarse directamente mediante DLNA.",
                              "DLNA Browser",
                              MessageBoxButton.OK,
                              MessageBoxImage.Information);

                          return;
                      }

                      StatusText.Text =
                          "Preparando vídeo para la TV...";

                      string mediaUrl;

                      if (videoUrl.StartsWith(
                              "http://",
                              StringComparison.OrdinalIgnoreCase) ||
                          videoUrl.StartsWith(
                              "https://",
                              StringComparison.OrdinalIgnoreCase))
                      {
                          mediaUrl =
                              await _mediaServer.StartAsync(
                                  videoUrl);
                      }
                      else
                      {
                          throw new Exception(
                              "La URL del vídeo no es HTTP/HTTPS.");
                      }

                      string title =
                          "Vídeo desde DLNA Browser";

                      await _renderer.SetMediaAsync(
                          device,
                          mediaUrl,
                          title);

                      await _renderer.PlayAsync(
                          device);

                      _casting = true;

                      StatusText.Text =
                          $"📺 Transmitiendo a {device.DisplayName}";

                  }
                  catch (Exception ex)
                  {
                      StatusText.Text =
                          "Error enviando a la TV.";

                      MessageBox.Show(
                          "No se pudo enviar el vídeo.\n\n" +
                          ex.Message,
                          "DLNA Browser",
                          MessageBoxButton.OK,
                          MessageBoxImage.Error);
                  }
                  finally
                  {
                      CastButton.IsEnabled = true;
                  }
              }


              private async void StopCastButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (DeviceCombo.SelectedItem is DlnaDevice device &&
                      _casting)
                  {
                      try
                      {
                          await _renderer.StopAsync(
                              device);
                      }
                      catch
                      {
                      }
                  }

                  _casting = false;

                  _mediaServer.Stop();

                  StatusText.Text =
                      "Transmisión detenida. " +
                      "El vídeo vuelve a reproducirse solamente en el PC.";
              }


              private void MainWindow_Closed(
                  object? sender,
                  EventArgs e)
              {
                  _mediaServer.Dispose();
              }
          }
          '@ | Set-Content src\DLNABrowser\MainWindow.xaml.cs -Encoding UTF8


          # Launcher
          @'
          @echo off
          setlocal

          cd /d "%~dp0"

          echo ==============================================
          echo DLNA BROWSER
          echo ==============================================
          echo.

          if exist "%~dp0MicrosoftEdgeWebview2Setup.exe" (
              echo Comprobando WebView2 Runtime...
              "%~dp0MicrosoftEdgeWebview2Setup.exe" /silent /install
          )

          echo.
          echo Iniciando DLNA Browser...
          echo.

          start "" "%~dp0DLNABrowser.exe"

          endlocal
          '@ | Set-Content Start-DLNABrowser.bat -Encoding ASCII


      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src\DLNABrowser\DLNABrowser.csproj

      - name: Build
        shell: pwsh
        run: |
          dotnet build `
            src\DLNABrowser\DLNABrowser.csproj `
            --configuration Release `
            --no-restore

      - name: Publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish `
            src\DLNABrowser\DLNABrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish `
            /p:PublishSingleFile=false `
            /p:DebugType=None `
            /p:DebugSymbols=false

          if (!(Test-Path "publish\DLNABrowser.exe")) {
              throw "DLNABrowser.exe no fue generado."
          }

      - name: Download WebView2 Bootstrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "publish\MicrosoftEdgeWebview2Setup.exe"

          if (!(Test-Path "publish\MicrosoftEdgeWebview2Setup.exe")) {
              throw "No se pudo descargar WebView2 Bootstrapper."
          }

      - name: Copy launcher
        shell: pwsh
        run: |
          Copy-Item `
            "Start-DLNABrowser.bat" `
            "publish\Start-DLNABrowser.bat" `
            -Force

      - name: Create README
        shell: pwsh
        run: |
          @'
          DLNA Browser
          ============

          1. Ejecuta:

             Start-DLNABrowser.bat

          2. El navegador funciona normalmente en el PC.

          3. Los vídeos NO se envían automáticamente a la TV.

          4. Para transmitir:

             - reproduce un vídeo
             - pulsa "Buscar TV"
             - selecciona tu TV
             - pulsa "Enviar a TV"

          5. Para detener:

             pulsa "Detener TV"

          IMPORTANTE
          ==========

          La TV debe soportar DLNA/UPnP MediaRenderer.

          El PC y la TV deben estar en la misma red local.

          No todos los sitios web pueden transmitirse mediante DLNA.

          Vídeos MP4/HTTP son los casos más compatibles.

          Los vídeos DRM, algunas transmisiones blob:, ciertos
          HLS/DASH y reproductores protegidos pueden no exponer
          una URL que la TV pueda reproducir.

          El navegador sigue funcionando localmente aunque no
          haya ninguna TV disponible.
          '@ | Set-Content publish\README.txt -Encoding UTF8

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "DLNABrowser-win-x64.zip") {
              Remove-Item "DLNABrowser-win-x64.zip" -Force
          }

          Compress-Archive `
            -Path "publish\*" `
            -DestinationPath "DLNABrowser-win-x64.zip" `
            -CompressionLevel Optimal

          Get-Item "DLNABrowser-win-x64.zip" |
            Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLNABrowser-win-x64
          path: DLNABrowser-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
