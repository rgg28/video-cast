name: Build DLNA Browser

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:GITHUB_WORKSPACE "src\DLNABrowser"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          New-Item -ItemType Directory -Path $root -Force | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>

              <PlatformTarget>x64</PlatformTarget>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>

              <AssemblyName>DLNABrowser</AssemblyName>
              <RootNamespace>DLNABrowser</RootNamespace>

              <ApplicationManifest>app.manifest</ApplicationManifest>

              <SelfContained>true</SelfContained>
              <PublishSingleFile>false</PublishSingleFile>
              <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="Microsoft.Web.WebView2" Version="1.0.3537.50" />
            </ItemGroup>

          </Project>
          '@ | Set-Content -Path (Join-Path $root "DLNABrowser.csproj") -Encoding UTF8

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <ApplicationManifest
              xmlns="urn:schemas-microsoft-com:asm.v1"
              xmlns:asmv3="urn:schemas-microsoft-com:asm.v3">

            <assemblyIdentity
                version="1.0.0.0"
                name="DLNABrowser.app" />

            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel
                      level="asInvoker"
                      uiAccess="false" />
                </requestedPrivileges>
              </security>
            </trustInfo>

            <compatibility xmlns="urn:schemas-microsoft-com:compatibility.v1">
              <application>
                <supportedOS Id="{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}" />
              </application>
            </compatibility>

          </ApplicationManifest>
          '@ | Set-Content -Path (Join-Path $root "app.manifest") -Encoding UTF8

          @'
          <Application
              x:Class="DLNABrowser.App"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">

            <Application.Resources>
            </Application.Resources>

          </Application>
          '@ | Set-Content -Path (Join-Path $root "App.xaml") -Encoding UTF8

          @'
          using System.Windows;

          namespace DLNABrowser;

          public partial class App : Application
          {
          }
          '@ | Set-Content -Path (Join-Path $root "App.xaml.cs") -Encoding UTF8

          @'
          namespace DLNABrowser;

          public sealed class DlnaDevice
          {
              public string FriendlyName { get; set; } = "";
              public string Location { get; set; } = "";
              public string ControlUrl { get; set; } = "";

              public override string ToString()
              {
                  return FriendlyName;
              }
          }
          '@ | Set-Content -Path (Join-Path $root "DlnaDevice.cs") -Encoding UTF8

          @'
          using System.Net;
          using System.Net.Sockets;
          using System.Text;
          using System.Xml.Linq;

          namespace DLNABrowser;

          public static class SsdpDiscovery
          {
              private const string MulticastAddress = "239.255.255.250";
              private const int MulticastPort = 1900;

              private const string SearchTarget =
                  "urn:schemas-upnp-org:device:MediaRenderer:1";

              public static async Task<List<DlnaDevice>> DiscoverAsync(
                  int timeoutMilliseconds = 4000)
              {
                  var devices = new List<DlnaDevice>();

                  using var client = new UdpClient();
                  client.EnableBroadcast = true;

                  var request =
                      "M-SEARCH * HTTP/1.1\r\n" +
                      $"HOST: {MulticastAddress}:{MulticastPort}\r\n" +
                      "MAN: \"ssdp:discover\"\r\n" +
                      "MX: 2\r\n" +
                      $"ST: {SearchTarget}\r\n\r\n";

                  var data = Encoding.UTF8.GetBytes(request);

                  await client.SendAsync(
                      data,
                      data.Length,
                      new IPEndPoint(
                          IPAddress.Parse(MulticastAddress),
                          MulticastPort));

                  var locations = new HashSet<string>(
                      StringComparer.OrdinalIgnoreCase);

                  var deadline =
                      DateTime.UtcNow.AddMilliseconds(timeoutMilliseconds);

                  while (DateTime.UtcNow < deadline)
                  {
                      var remaining =
                          (int)Math.Max(
                              1,
                              (deadline - DateTime.UtcNow).TotalMilliseconds);

                      var receiveTask = client.ReceiveAsync();
                      var delayTask = Task.Delay(remaining);

                      var completed =
                          await Task.WhenAny(receiveTask, delayTask);

                      if (completed != receiveTask)
                          break;

                      var result = await receiveTask;

                      var response =
                          Encoding.UTF8.GetString(result.Buffer);

                      foreach (var line in response.Split(
                          new[] { "\r\n", "\n" },
                          StringSplitOptions.RemoveEmptyEntries))
                      {
                          var separator = line.IndexOf(':');

                          if (separator <= 0)
                              continue;

                          var name =
                              line[..separator].Trim();

                          var value =
                              line[(separator + 1)..].Trim();

                          if (name.Equals(
                                  "LOCATION",
                                  StringComparison.OrdinalIgnoreCase))
                          {
                              locations.Add(value);
                          }
                      }
                  }

                  foreach (var location in locations)
                  {
                      try
                      {
                          var device =
                              await LoadDeviceAsync(location);

                          if (device != null &&
                              !devices.Any(x =>
                                  x.ControlUrl.Equals(
                                      device.ControlUrl,
                                      StringComparison.OrdinalIgnoreCase)))
                          {
                              devices.Add(device);
                          }
                      }
                      catch
                      {
                      }
                  }

                  return devices;
              }

              private static async Task<DlnaDevice?> LoadDeviceAsync(
                  string location)
              {
                  using var http = new HttpClient
                  {
                      Timeout = TimeSpan.FromSeconds(5)
                  };

                  var xml =
                      await http.GetStringAsync(location);

                  var document =
                      XDocument.Parse(xml);

                  XNamespace deviceNs =
                      "urn:schemas-upnp-org:device-1-0";

                  XNamespace serviceNs =
                      "urn:schemas-upnp-org:service-1-0";

                  var deviceElement =
                      document
                          .Descendants(deviceNs + "device")
                          .FirstOrDefault();

                  if (deviceElement == null)
                      return null;

                  var friendlyName =
                      deviceElement
                          .Element(deviceNs + "friendlyName")
                          ?.Value
                          ?.Trim();

                  if (string.IsNullOrWhiteSpace(friendlyName))
                      friendlyName = "DLNA TV";

                  var service =
                      deviceElement
                          .Descendants(deviceNs + "service")
                          .FirstOrDefault(x =>
                              string.Equals(
                                  x.Element(deviceNs + "serviceType")?.Value,
                                  "urn:schemas-upnp-org:service:AVTransport:1",
                                  StringComparison.OrdinalIgnoreCase));

                  if (service == null)
                      return null;

                  var controlUrl =
                      service
                          .Element(deviceNs + "controlURL")
                          ?.Value;

                  if (string.IsNullOrWhiteSpace(controlUrl))
                      return null;

                  var baseUri =
                      new Uri(location);

                  var absoluteControlUrl =
                      new Uri(baseUri, controlUrl);

                  return new DlnaDevice
                  {
                      FriendlyName = friendlyName,
                      Location = location,
                      ControlUrl = absoluteControlUrl.ToString()
                  };
              }
          }
          '@ | Set-Content -Path (Join-Path $root "SsdpDiscovery.cs") -Encoding UTF8

          @'
          using System.Net.Http;
          using System.Text;

          namespace DLNABrowser;

          public static class DlnaRenderer
          {
              public static async Task SetMediaAsync(
                  DlnaDevice device,
                  string mediaUrl,
                  string contentType = "video/mp4")
              {
                  var metadata =
                      CreateMetadata(
                          mediaUrl,
                          contentType);

                  var body =
                      $"""
                      <u:SetAVTransportURI xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                        <InstanceID>0</InstanceID>
                        <CurrentURI>{Escape(mediaUrl)}</CurrentURI>
                        <CurrentURIMetaData>{Escape(metadata)}</CurrentURIMetaData>
                      </u:SetAVTransportURI>
                      """;

                  await SendSoapAsync(
                      device,
                      "SetAVTransportURI",
                      body);
              }

              public static async Task PlayAsync(
                  DlnaDevice device)
              {
                  var body =
                      """
                      <u:Play xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                        <InstanceID>0</InstanceID>
                        <Speed>1</Speed>
                      </u:Play>
                      """;

                  await SendSoapAsync(
                      device,
                      "Play",
                      body);
              }

              public static async Task StopAsync(
                  DlnaDevice device)
              {
                  var body =
                      """
                      <u:Stop xmlns:u="urn:schemas-upnp-org:service:AVTransport:1">
                        <InstanceID>0</InstanceID>
                      </u:Stop>
                      """;

                  await SendSoapAsync(
                      device,
                      "Stop",
                      body);
              }

              private static async Task SendSoapAsync(
                  DlnaDevice device,
                  string action,
                  string body)
              {
                  var envelope =
                      $"""
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope
                          s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/"
                          xmlns:s="http://schemas.xmlsoap.org/soap/envelope/">
                        <s:Body>
                          {body}
                        </s:Body>
                      </s:Envelope>
                      """;

                  using var http = new HttpClient
                  {
                      Timeout = TimeSpan.FromSeconds(15)
                  };

                  using var request =
                      new HttpRequestMessage(
                          HttpMethod.Post,
                          device.ControlUrl);

                  request.Headers.Add(
                      "SOAPACTION",
                      $"\"urn:schemas-upnp-org:service:AVTransport:1#{action}\"");

                  request.Content =
                      new StringContent(
                          envelope,
                          Encoding.UTF8,
                          "text/xml");

                  using var response =
                      await http.SendAsync(request);

                  if (!response.IsSuccessStatusCode)
                  {
                      var error =
                          await response.Content.ReadAsStringAsync();

                      throw new InvalidOperationException(
                          $"DLNA SOAP error {(int)response.StatusCode}: {error}");
                  }
              }

              private static string CreateMetadata(
                  string url,
                  string contentType)
              {
                  return
                      $"""
                      <DIDL-Lite
                          xmlns="urn:schemas-upnp-org:metadata-1-0/DIDL-Lite/"
                          xmlns:dc="http://purl.org/dc/elements/1.1/"
                          xmlns:upnp="urn:schemas-upnp-org:metadata-1-0/upnp/">
                        <item id="1" parentID="-1" restricted="1">
                          <dc:title>Video</dc:title>
                          <upnp:class>object.item.videoItem</upnp:class>
                          <res protocolInfo="http-get:*:{Escape(contentType)}:*">{Escape(url)}</res>
                        </item>
                      </DIDL-Lite>
                      """;
              }

              private static string Escape(
                  string value)
              {
                  return System.Security.SecurityElement
                      .Escape(value) ?? "";
              }
          }
          '@ | Set-Content -Path (Join-Path $root "DlnaRenderer.cs") -Encoding UTF8

          @'
          using System.Net;
          using System.Net.Http;

          namespace DLNABrowser;

          public sealed class LocalMediaServer : IDisposable
          {
              private readonly HttpListener listener;
              private readonly CancellationTokenSource cts = new();

              private readonly string sourceUrl;

              public int Port { get; }

              public string PublicUrl { get; }

              public LocalMediaServer(
                  string sourceUrl)
              {
                  this.sourceUrl = sourceUrl;

                  Port = FindFreePort();

                  listener = new HttpListener();

                  listener.Prefixes.Add(
                      $"http://127.0.0.1:{Port}/");

                  listener.Prefixes.Add(
                      $"http://+:{Port}/");

                  PublicUrl =
                      $"http://{GetLocalIPv4()}:{Port}/media";

                  listener.Start();

                  _ = Task.Run(
                      ListenLoopAsync);
              }

              private async Task ListenLoopAsync()
              {
                  while (!cts.IsCancellationRequested)
                  {
                      try
                      {
                          var context =
                              await listener.GetContextAsync();

                          _ = Task.Run(
                              () => HandleAsync(context));
                      }
                      catch
                      {
                          if (cts.IsCancellationRequested)
                              return;
                      }
                  }
              }

              private async Task HandleAsync(
                  HttpListenerContext context)
              {
                  try
                  {
                      if (!context.Request.Url!
                              .AbsolutePath
                              .Equals(
                                  "/media",
                                  StringComparison.OrdinalIgnoreCase))
                      {
                          context.Response.StatusCode = 404;
                          context.Response.Close();
                          return;
                      }

                      using var http = new HttpClient();

                      using var request =
                          new HttpRequestMessage(
                              HttpMethod.Get,
                              sourceUrl);

                      if (!string.IsNullOrWhiteSpace(
                              context.Request.Headers["Range"]))
                      {
                          request.Headers.TryAddWithoutValidation(
                              "Range",
                              context.Request.Headers["Range"]);
                      }

                      using var response =
                          await http.SendAsync(
                              request,
                              HttpCompletionOption.ResponseHeadersRead,
                              cts.Token);

                      context.Response.StatusCode =
                          (int)response.StatusCode;

                      if (response.Content.Headers.ContentType != null)
                      {
                          context.Response.ContentType =
                              response.Content.Headers.ContentType
                                  .ToString();
                      }

                      if (response.Content.Headers.ContentLength.HasValue)
                      {
                          context.Response.ContentLength64 =
                              response.Content.Headers.ContentLength.Value;
                      }

                      if (response.Content.Headers.ContentRange != null)
                      {
                          context.Response.AddHeader(
                              "Content-Range",
                              response.Content.Headers.ContentRange.ToString());
                      }

                      context.Response.AddHeader(
                          "Accept-Ranges",
                          "bytes");

                      await using var stream =
                          await response.Content.ReadAsStreamAsync(
                              cts.Token);

                      await stream.CopyToAsync(
                          context.Response.OutputStream,
                          cts.Token);
                  }
                  catch
                  {
                      try
                      {
                          context.Response.StatusCode = 500;
                      }
                      catch
                      {
                      }
                  }
                  finally
                  {
                      try
                      {
                          context.Response.Close();
                      }
                      catch
                      {
                      }
                  }
              }

              private static int FindFreePort()
              {
                  var listener =
                      new TcpListener(
                          IPAddress.Loopback,
                          0);

                  listener.Start();

                  var port =
                      ((IPEndPoint)listener.LocalEndpoint)
                          .Port;

                  listener.Stop();

                  return port;
              }

              private static string GetLocalIPv4()
              {
                  foreach (
                      var address in
                      Dns.GetHostEntry(
                          Dns.GetHostName()).AddressList)
                  {
                      if (address.AddressFamily ==
                          AddressFamily.InterNetwork &&
                          !IPAddress.IsLoopback(address))
                      {
                          return address.ToString();
                      }
                  }

                  return "127.0.0.1";
              }

              public void Dispose()
              {
                  cts.Cancel();

                  try
                  {
                      listener.Stop();
                  }
                  catch
                  {
                  }

                  listener.Close();
                  cts.Dispose();
              }
          }
          '@ | Set-Content -Path (Join-Path $root "LocalMediaServer.cs") -Encoding UTF8

          @'
          using Microsoft.Web.WebView2.Core;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Input;

          namespace DLNABrowser;

          public partial class MainWindow : Window
          {
              private readonly List<DlnaDevice> devices = new();

              private LocalMediaServer? mediaServer;

              public MainWindow()
              {
                  InitializeComponent();

                  Loaded +=
                      MainWindow_Loaded;

                  Closed +=
                      MainWindow_Closed;
              }

              private async void MainWindow_Loaded(
                  object sender,
                  RoutedEventArgs e)
              {
                  try
                  {
                      await Browser.EnsureCoreWebView2Async();

                      Browser.CoreWebView2.Settings
                          .AreDefaultContextMenusEnabled = true;

                      Browser.CoreWebView2.Settings
                          .AreDevToolsEnabled = true;

                      Browser.CoreWebView2.Navigate(
                          "https://www.google.com");
                  }
                  catch (Exception ex)
                  {
                      StatusText.Text =
                          "WebView2 error: " + ex.Message;
                  }

                  await DiscoverTvsAsync();
              }

              private async Task DiscoverTvsAsync()
              {
                  StatusText.Text =
                      "Buscando TVs DLNA...";

                  try
                  {
                      devices.Clear();

                      var found =
                          await SsdpDiscovery
                              .DiscoverAsync();

                      devices.AddRange(found);

                      TvCombo.Items.Clear();

                      foreach (var device in devices)
                      {
                          TvCombo.Items.Add(device);
                      }

                      if (TvCombo.Items.Count > 0)
                      {
                          TvCombo.SelectedIndex = 0;

                          StatusText.Text =
                              $"TVs encontradas: {TvCombo.Items.Count}";
                      }
                      else
                      {
                          StatusText.Text =
                              "No se encontraron TVs DLNA.";
                      }
                  }
                  catch (Exception ex)
                  {
                      StatusText.Text =
                          "Error DLNA: " + ex.Message;
                  }
              }

              private void GoButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  var url =
                      AddressBar.Text.Trim();

                  if (string.IsNullOrWhiteSpace(url))
                      return;

                  if (!url.StartsWith(
                          "http://",
                          StringComparison.OrdinalIgnoreCase) &&
                      !url.StartsWith(
                          "https://",
                          StringComparison.OrdinalIgnoreCase))
                  {
                      url =
                          "https://" + url;
                  }

                  AddressBar.Text = url;

                  Browser.CoreWebView2.Navigate(url);
              }

              private void AddressBar_KeyDown(
                  object sender,
                  KeyEventArgs e)
              {
                  if (e.Key == Key.Enter)
                  {
                      GoButton_Click(
                          sender,
                          new RoutedEventArgs());
                  }
              }

              private async void SendButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (TvCombo.SelectedItem is not DlnaDevice tv)
                  {
                      MessageBox.Show(
                          "Selecciona una TV DLNA primero.",
                          "DLNA",
                          MessageBoxButton.OK,
                          MessageBoxImage.Information);

                      return;
                  }

                  try
                  {
                      StatusText.Text =
                          "Detectando video...";

                      var result =
                          await Browser.CoreWebView2
                              .ExecuteScriptAsync(
                                  """
                                  (() => {
                                      const video =
                                          document.querySelector("video");

                                      if (!video)
                                          return "";

                                      return video.currentSrc ||
                                             video.src ||
                                             "";
                                  })()
                                  """);

                      var videoUrl =
                          System.Text.Json.JsonSerializer
                              .Deserialize<string>(result);

                      if (string.IsNullOrWhiteSpace(videoUrl))
                      {
                          MessageBox.Show(
                              "No se encontró un elemento <video> en esta página.",
                              "DLNA",
                              MessageBoxButton.OK,
                              MessageBoxImage.Information);

                          return;
                      }

                      if (videoUrl.StartsWith(
                              "blob:",
                              StringComparison.OrdinalIgnoreCase))
                      {
                          MessageBox.Show(
                              "Este video usa una URL blob interna. Esta versión necesita una URL HTTP/HTTPS accesible por la TV.",
                              "DLNA",
                              MessageBoxButton.OK,
                              MessageBoxImage.Information);

                          return;
                      }

                      string finalUrl;
                      string contentType;

                      if (videoUrl.EndsWith(
                              ".m3u8",
                              StringComparison.OrdinalIgnoreCase))
                      {
                          finalUrl = videoUrl;
                          contentType =
                              "application/vnd.apple.mpegurl";
                      }
                      else
                      {
                          mediaServer?.Dispose();

                          mediaServer =
                              new LocalMediaServer(
                                  videoUrl);

                          finalUrl =
                              mediaServer.PublicUrl;

                          contentType =
                              "video/mp4";
                      }

                      StatusText.Text =
                          "Enviando video a " +
                          tv.FriendlyName + "...";

                      await DlnaRenderer.SetMediaAsync(
                          tv,
                          finalUrl,
                          contentType);

                      await DlnaRenderer.PlayAsync(
                          tv);

                      StatusText.Text =
                          "Video enviado correctamente.";
                  }
                  catch (Exception ex)
                  {
                      StatusText.Text =
                          "Error: " + ex.Message;

                      MessageBox.Show(
                          ex.ToString(),
                          "Error DLNA",
                          MessageBoxButton.OK,
                          MessageBoxImage.Error);
                  }
              }

              private async void RefreshButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  await DiscoverTvsAsync();
              }

              private async void StopButton_Click(
                  object sender,
                  RoutedEventArgs e)
              {
                  if (TvCombo.SelectedItem is not DlnaDevice tv)
                      return;

                  try
                  {
                      await DlnaRenderer.StopAsync(tv);

                      StatusText.Text =
                          "Reproducción detenida.";
                  }
                  catch (Exception ex)
                  {
                      StatusText.Text =
                          "Error: " + ex.Message;
                  }
              }

              private void MainWindow_Closed(
                  object? sender,
                  EventArgs e)
              {
                  mediaServer?.Dispose();
              }
          }
          '@ | Set-Content -Path (Join-Path $root "MainWindow.xaml.cs") -Encoding UTF8

          @'
          <Window
              x:Class="DLNABrowser.MainWindow"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
              xmlns:wv2="clr-namespace:Microsoft.Web.WebView2.Wpf;assembly=Microsoft.Web.WebView2.Wpf"
              Title="DLNA Browser"
              Width="1400"
              Height="850"
              MinWidth="900"
              MinHeight="600"
              Background="#101218"
              Foreground="White">

            <Grid>
              <Grid.RowDefinitions>
                <RowDefinition Height="52"/>
                <RowDefinition Height="*"/>
                <RowDefinition Height="62"/>
              </Grid.RowDefinitions>

              <Grid
                  Grid.Row="0"
                  Background="#1b1f2a"
                  Margin="0">

                <Grid.ColumnDefinitions>
                  <ColumnDefinition Width="Auto"/>
                  <ColumnDefinition Width="*"/>
                  <ColumnDefinition Width="Auto"/>
                  <ColumnDefinition Width="Auto"/>
                </Grid.ColumnDefinitions>

                <Button
                    Grid.Column="0"
                    Content="←"
                    Width="44"
                    Margin="6"
                    Click="GoButton_Click"/>

                <TextBox
                    x:Name="AddressBar"
                    Grid.Column="1"
                    Height="34"
                    Margin="4"
                    VerticalContentAlignment="Center"
                    FontSize="15"
                    Text="https://www.google.com"
                    KeyDown="AddressBar_KeyDown"/>

                <Button
                    Grid.Column="2"
                    Content="Ir"
                    Width="55"
                    Margin="4"
                    Click="GoButton_Click"/>

                <Button
                    Grid.Column="3"
                    Content="📺 TV"
                    Width="90"
                    Margin="4"
                    Click="SendButton_Click"/>
              </Grid>

              <wv2:WebView2
                  x:Name="Browser"
                  Grid.Row="1"/>

              <Grid
                  Grid.Row="2"
                  Background="#1b1f2a">

                <Grid.ColumnDefinitions>
                  <ColumnDefinition Width="Auto"/>
                  <ColumnDefinition Width="260"/>
                  <ColumnDefinition Width="Auto"/>
                  <ColumnDefinition Width="*"/>
                  <ColumnDefinition Width="Auto"/>
                </Grid.ColumnDefinitions>

                <TextBlock
                    Grid.Column="0"
                    Text="TV:"
                    VerticalAlignment="Center"
                    Margin="12,0,6,0"
                    FontWeight="Bold"/>

                <ComboBox
                    x:Name="TvCombo"
                    Grid.Column="1"
                    Height="34"
                    VerticalAlignment="Center"
                    DisplayMemberPath="FriendlyName"/>

                <Button
                    Grid.Column="2"
                    Content="🔍 TVs"
                    Height="34"
                    Margin="8,0"
                    Padding="12,0"
                    Click="RefreshButton_Click"/>

                <TextBlock
                    x:Name="StatusText"
                    Grid.Column="3"
                    VerticalAlignment="Center"
                    Margin="10,0"
                    Text="Listo."/>

                <Button
                    Grid.Column="4"
                    Content="■ Stop"
                    Height="34"
                    Margin="6"
                    Padding="12,0"
                    Click="StopButton_Click"/>
              </Grid>
            </Grid>
          </Window>
          '@ | Set-Content -Path (Join-Path $root "MainWindow.xaml") -Encoding UTF8

      - name: Restore
        shell: pwsh
        working-directory: src/DLNABrowser
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore DLNABrowser.csproj

      - name: Build and publish
        shell: pwsh
        working-directory: src/DLNABrowser
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish DLNABrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish `
            -p:PlatformTarget=x64 `
            -p:DebugType=None `
            -p:DebugSymbols=false

          if (-not (Test-Path "publish\DLNABrowser.exe")) {
              throw "DLNABrowser.exe no fue generado."
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publish =
              Join-Path $env:GITHUB_WORKSPACE "src\DLNABrowser\publish"

          $zip =
              Join-Path $env:GITHUB_WORKSPACE "DLNABrowser-win-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
              -Path "$publish\*" `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "No se pudo crear el ZIP."
          }

          Write-Host "=============================================="
          Write-Host "BUILD COMPLETADO"
          Write-Host "=============================================="
          Get-Item $zip | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLNABrowser-win-x64
          path: DLNABrowser-win-x64.zip
          if-no-files-found: error
          compression-level: 0
