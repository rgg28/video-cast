          $popupJs = @'
const devicesSelect = document.getElementById("devices");
const discoverButton = document.getElementById("discover");
const castButton = document.getElementById("cast");
const stopButton = document.getElementById("stop");
const statusBox = document.getElementById("status");
const videoBox = document.getElementById("video");

let devices = [];

function setStatus(text) {
    statusBox.textContent = text;
}

function sendNative(action, data = {}) {
    return new Promise((resolve, reject) => {
        chrome.runtime.sendMessage(
            {
                type: "native",
                action,
                data
            },
            (response) => {
                if (chrome.runtime.lastError) {
                    reject(
                        new Error(
                            chrome.runtime.lastError.message
                        )
                    );
                    return;
                }

                if (!response) {
                    reject(
                        new Error("Sin respuesta del helper.")
                    );
                    return;
                }

                if (!response.ok) {
                    reject(
                        new Error(
                            response.error ||
                            "Error del helper."
                        )
                    );
                    return;
                }

                resolve(response.result);
            }
        );
    });
}

async function getCurrentVideo() {
    const tabs = await chrome.tabs.query({
        active: true,
        currentWindow: true
    });

    if (!tabs.length) {
        throw new Error("No se encontró la pestaña activa.");
    }

    const tabId = tabs[0].id;

    const results =
        await chrome.scripting.executeScript({
            target: {
                tabId,
                allFrames: true
            },

            func: () => {
                const videos =
                    Array.from(
                        document.querySelectorAll("video")
                    );

                const list = videos
                    .map((video) => ({
                        url:
                            video.currentSrc ||
                            video.src ||
                            "",

                        paused: video.paused,

                        currentTime:
                            Number.isFinite(video.currentTime)
                                ? video.currentTime
                                : 0,

                        duration:
                            Number.isFinite(video.duration)
                                ? video.duration
                                : 0,

                        width:
                            video.videoWidth || 0,

                        height:
                            video.videoHeight || 0,

                        title:
                            document.title || ""
                    }))
                    .filter((x) => x.url);

                const playing =
                    list.find((x) => !x.paused);

                return {
                    pageUrl: location.href,
                    pageTitle: document.title || "",
                    videos: list,
                    selected: playing || list[0] || null
                };
            }
        });

    for (const result of results) {
        if (
            result &&
            result.result &&
            result.result.selected
        ) {
            return {
                ...result.result,
                selected: result.result.selected
            };
        }
    }

    throw new Error(
        "No se encontró un elemento <video> reproducible en esta página."
    );
}

async function refreshVideoInfo() {
    try {
        const info = await getCurrentVideo();
        const video = info.selected;

        videoBox.textContent =
            "Vídeo: " +
            (video.title || info.pageTitle || "sin título") +
            "\n" +
            "URL: " +
            video.url;

        return info;
    } catch (error) {
        videoBox.textContent =
            "Vídeo: no detectado";

        throw error;
    }
}

async function discover() {
    discoverButton.disabled = true;
    castButton.disabled = true;

    setStatus("Buscando dispositivos DLNA en la red...");

    try {
        const result =
            await sendNative("discover");

        devices =
            Array.isArray(result.devices)
                ? result.devices
                : [];

        devicesSelect.innerHTML = "";

        if (!devices.length) {
            const option =
                document.createElement("option");

            option.value = "";
            option.textContent =
                "No se encontraron TVs DLNA";

            devicesSelect.appendChild(option);

            setStatus(
                "No se encontraron dispositivos DLNA.\n" +
                "Comprueba que la TV y el PC estén en la misma red."
            );

            return;
        }

        devices.forEach((device, index) => {
            const option =
                document.createElement("option");

            option.value = String(index);

            option.textContent =
                device.name ||
                device.model ||
                device.location ||
                "Dispositivo DLNA";

            devicesSelect.appendChild(option);
        });

        castButton.disabled = false;

        setStatus(
            `Encontrados ${devices.length} dispositivo(s).`
        );

    } catch (error) {
        setStatus(
            "Error al buscar TVs:\n" +
            error.message
        );
    } finally {
        discoverButton.disabled = false;
    }
}

async function cast() {
    const index =
        Number(devicesSelect.value);

    if (
        !Number.isInteger(index) ||
        !devices[index]
    ) {
        setStatus(
            "Selecciona primero una TV."
        );
        return;
    }

    castButton.disabled = true;

    try {
        setStatus(
            "Detectando el vídeo actual..."
        );

        const info =
            await refreshVideoInfo();

        const video =
            info.selected;

        if (!video.url) {
            throw new Error(
                "El vídeo no tiene una URL utilizable."
            );
        }

        if (
            video.url.startsWith("blob:") ||
            video.url.startsWith("data:")
        ) {
            throw new Error(
                "Este vídeo usa una URL blob:/data:.\n" +
                "Chrome no expone ese stream como una URL DLNA."
            );
        }

        setStatus(
            "Enviando vídeo a la TV..."
        );

        await sendNative(
            "cast",
            {
                device: devices[index],
                url: video.url,
                title:
                    video.title ||
                    info.pageTitle ||
                    "Chrome Video",
                pageUrl: info.pageUrl
            }
        );

        stopButton.disabled = false;

        setStatus(
            "Reproducción enviada a la TV.\n" +
            "El navegador puede seguir abierto normalmente."
        );

    } catch (error) {
        setStatus(
            "No se pudo enviar el vídeo:\n" +
            error.message
        );
    } finally {
        castButton.disabled = false;
    }
}

async function stop() {
    const index =
        Number(devicesSelect.value);

    if (
        !Number.isInteger(index) ||
        !devices[index]
    ) {
        return;
    }

    stopButton.disabled = true;

    try {
        await sendNative(
            "stop",
            {
                device: devices[index]
            }
        );

        setStatus(
            "Reproducción detenida en la TV."
        );

    } catch (error) {
        setStatus(
            "No se pudo detener:\n" +
            error.message
        );

        stopButton.disabled = false;
    }
}

discoverButton.addEventListener(
    "click",
    discover
);

castButton.addEventListener(
    "click",
    cast
);

stopButton.addEventListener(
    "click",
    stop
);

discover();
'@

