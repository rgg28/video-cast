name: Build DLNA Cast for Chrome

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "CREATING DLNA CAST PROJECT"
          Write-Host "=============================================="

          $root = Join-Path $env:GITHUB_WORKSPACE "DLNA-Cast"
          $ext = Join-Path $root "extension"
          $helper = Join-Path $root "helper"
          $hostDir = Join-Path $root "native-host"
          $publish = Join-Path $root "publish"

          New-Item -ItemType Directory -Force -Path $ext | Out-Null
          New-Item -ItemType Directory -Force -Path $helper | Out-Null
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          New-Item -ItemType Directory -Force -Path $publish | Out-Null

          function Write-Utf8NoBom {
            param(
              [string]$Path,
              [string]$Content
            )

            $dir = Split-Path -Parent $Path
            if ($dir) {
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
            }

            [System.IO.File]::WriteAllText(
              $Path,
              $Content,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          # ============================================================
          # GENERATE A FIXED EXTENSION KEY
          # ============================================================

          Write-Host "Generating Chrome extension key..."

          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $publicDer = $rsa.ExportSubjectPublicKeyInfo()
          $publicKeyBase64 = [Convert]::ToBase64String($publicDer)

          $sha = [System.Security.Cryptography.SHA256]::HashData($publicDer)

          $idBuilder = [System.Text.StringBuilder]::new()

          foreach ($b in $sha[0..15]) {
            [void]$idBuilder.Append(
              [char](97 + (($b -shr 4) -band 15))
            )

            [void]$idBuilder.Append(
              [char](97 + ($b -band 15))
            )
          }

          $extensionId = $idBuilder.ToString()

          Write-Host "Extension ID:"
          Write-Host $extensionId

          # ============================================================
          # MANIFEST
          # ============================================================

          $manifest = @{
            manifest_version = 3
            name = "DLNA Cast"
            version = "1.0.0"
            description = "Envía opcionalmente el video actual de Chrome a una TV DLNA/UPnP."
            permissions = @(
              "activeTab",
              "scripting",
              "nativeMessaging"
            )
            background = @{
              service_worker = "service-worker.js"
            }
            action = @{
              default_title = "DLNA Cast"
              default_popup = "popup.html"
            }
            key = $publicKeyBase64
          } | ConvertTo-Json -Depth 10

          Write-Utf8NoBom `
            (Join-Path $ext "manifest.json") `
            $manifest

          # ============================================================
          # SERVICE WORKER
          # ============================================================

          $serviceWorker = @'
const HOST_NAME = "com.rgg28.dlnacast";

let nativePort = null;
let nextRequestId = 1;
const pending = new Map();

function connectNative() {
    if (nativePort) {
        return nativePort;
    }

    nativePort = chrome.runtime.connectNative(HOST_NAME);

    nativePort.onMessage.addListener((message) => {
        if (!message || !message.id) {
            return;
        }

        const request = pending.get(message.id);

        if (!request) {
            return;
        }

        pending.delete(message.id);

        if (message.ok) {
            request.resolve(message);
        } else {
            request.reject(
                new Error(message.error || "Error del helper DLNA")
            );
        }
    });

    nativePort.onDisconnect.addListener(() => {
        const error =
            chrome.runtime.lastError?.message ||
            "El helper DLNA se desconectó.";

        for (const request of pending.values()) {
            request.reject(new Error(error));
        }

        pending.clear();
        nativePort = null;
    });

    return nativePort;
}

function callNative(action, data = {}) {
    return new Promise((resolve, reject) => {
        const port = connectNative();
        const id = String(nextRequestId++);

        pending.set(id, {
            resolve,
            reject
        });

        try {
            port.postMessage({
                id,
                action,
                ...data
            });
        } catch (error) {
            pending.delete(id);
            reject(error);
        }
    });
}

chrome.runtime.onMessage.addListener(
    (message, sender, sendResponse) => {
        if (!message || message.type !== "native") {
            return false;
        }

        callNative(
            message.action,
            message.data || {}
        )
            .then((result) => {
                sendResponse({
                    ok: true,
                    result
                });
            })
            .catch((error) => {
                sendResponse({
                    ok: false,
                    error: error.message
                });
            });

        return true;
    }
);
'@

          Write-Utf8NoBom `
            (Join-Path $ext "service-worker.js") `
            $serviceWorker

