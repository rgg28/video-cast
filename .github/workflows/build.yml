using System.Net.Http;
using System.Security;
using System.Text;

namespace DLNABrowser;

public static class DlnaRenderer
{
    private static readonly HttpClient Http =
        new HttpClient
        {
            Timeout = TimeSpan.FromSeconds(20)
        };


    public static async Task SetMediaAsync(
        DlnaDevice device,
        string mediaUrl,
        string mimeType,
        string title)
    {
        string escapedUrl =
            SecurityElement.Escape(
                mediaUrl)
            ?? mediaUrl;


        string escapedTitle =
            SecurityElement.Escape(
                title)
            ?? "Video";


        string metadata =
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +
            "<DIDL-Lite " +
            "xmlns=\"urn:schemas-upnp-org:metadata-1-0/DIDL-Lite/\" " +
            "xmlns:dc=\"http://purl.org/dc/elements/1.1/\" " +
            "xmlns:upnp=\"urn:schemas-upnp-org:metadata-1-0/upnp/\">" +

            "<item id=\"1\" parentID=\"0\" restricted=\"1\">" +

            $"<dc:title>{escapedTitle}</dc:title>" +

            "<upnp:class>" +
            "object.item.videoItem" +
            "</upnp:class>" +

            $"<res protocolInfo=\"http-get:*:{mimeType}:*\">" +
            escapedUrl +
            "</res>" +

            "</item>" +

            "</DIDL-Lite>";


        string body =
            SoapEnvelope(
                "SetAVTransportURI",
                device.ServiceType,
                "<InstanceID>0</InstanceID>" +
                $"<CurrentURI>{escapedUrl}</CurrentURI>" +
                $"<CurrentURIMetaData>" +
                SecurityElement.Escape(metadata) +
                "</CurrentURIMetaData>");


        await SendAsync(
            device,
            "SetAVTransportURI",
            body);
    }


    public static async Task PlayAsync(
        DlnaDevice device)
    {
        string body =
            SoapEnvelope(
                "Play",
                device.ServiceType,
                "<InstanceID>0</InstanceID>" +
                "<Speed>1</Speed>");


        await SendAsync(
            device,
            "Play",
            body);
    }


    public static async Task StopAsync(
        DlnaDevice device)
    {
        string body =
            SoapEnvelope(
                "Stop",
                device.ServiceType,
                "<InstanceID>0</InstanceID>");


        await SendAsync(
            device,
            "Stop",
            body);
    }


    private static string SoapEnvelope(
        string action,
        string serviceType,
        string arguments)
    {
        return
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" +

            "<s:Envelope " +
            "xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" " +
            "s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">" +

            "<s:Body>" +

            $"<u:{action} " +
            $"xmlns:u=\"{serviceType}\">" +

            arguments +

            $"</u:{action}>" +

            "</s:Body>" +

            "</s:Envelope>";
    }


    private static async Task SendAsync(
        DlnaDevice device,
        string action,
        string body)
    {
        using var request =
            new HttpRequestMessage(
                HttpMethod.Post,
                device.ControlUrl);


        request.Content =
            new StringContent(
                body,
                Encoding.UTF8,
                "text/xml");


        request.Headers.TryAddWithoutValidation(
            "SOAPACTION",
            $"\"{device.ServiceType}#{action}\"");


        using HttpResponseMessage response =
            await Http.SendAsync(
                request);


        string responseText =
            await response.Content.ReadAsStringAsync();


        if (!response.IsSuccessStatusCode)
        {
            throw new Exception(
                $"DLNA {action} failed: " +
                $"{(int)response.StatusCode} " +
                responseText);
        }
    }
}
