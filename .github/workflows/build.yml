          @'
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using System.Net;
          using System.Net.Http;
          using System.Net.Sockets;
          using System.Text;
          using System.Threading;
          using System.Threading.Tasks;
          using System.Xml.Linq;

          namespace DLNABrowser;

          public sealed class DlnaDevice
          {
              public string DisplayName { get; set; } = "";
              public string Location { get; set; } = "";
              public string ControlUrl { get; set; } = "";
              public string ServiceType { get; set; } = "";

              public override string ToString()
              {
                  return DisplayName;
              }
          }


          public static class SsdpDiscovery
          {
              private const string MulticastAddress = "239.255.255.250";
              private const int Port = 1900;

              public static async Task<List<DlnaDevice>> DiscoverAsync(
                  int timeoutMs = 3500)
              {
                  var result = new List<DlnaDevice>();

                  using var udp = new UdpClient();

                  udp.Client.SetSocketOption(
                      SocketOptionLevel.Socket,
                      SocketOptionName.Broadcast,
                      true);

                  udp.Client.ReceiveTimeout = timeoutMs;

                  string request =
                      "M-SEARCH * HTTP/1.1\r\n" +
                      "HOST: 239.255.255.250:1900\r\n" +
                      "MAN: \"ssdp:discover\"\r\n" +
                      "MX: 2\r\n" +
                      "ST: urn:schemas-upnp-org:device:MediaRenderer:1\r\n" +
                      "\r\n";

                  byte[] data = Encoding.ASCII.GetBytes(request);

                  await udp.SendAsync(
                      data,
                      data.Length,
                      MulticastAddress,
                      Port);

                  var locations =
                      new HashSet<string>(
                          StringComparer.OrdinalIgnoreCase);

                  var end =
                      DateTime.UtcNow.AddMilliseconds(timeoutMs);

                  while (DateTime.UtcNow < end)
                  {
                      try
                      {
                          int remaining =
                              Math.Max(
                                  100,
                                  (int)(end - DateTime.UtcNow).TotalMilliseconds);

                          udp.Client.ReceiveTimeout = remaining;

                          UdpReceiveResult response =
                              await udp.ReceiveAsync();

                          string text =
                              Encoding.ASCII.GetString(
                                  response.Buffer);

                          foreach (string line in
                                   text.Split(
                                       new[] { "\r\n", "\n" },
                                       StringSplitOptions.RemoveEmptyEntries))
                          {
                              int colon = line.IndexOf(':');

                              if (colon <= 0)
                                  continue;

                              string key =
                                  line[..colon].Trim();

                              string value =
                                  line[(colon + 1)..].Trim();

                              if (key.Equals(
                                      "LOCATION",
                                      StringComparison.OrdinalIgnoreCase))
                              {
                                  if (Uri.TryCreate(
                                          value,
                                          UriKind.Absolute,
                                          out _))
                                  {
                                      locations.Add(value);
                                  }
                              }
                          }
                      }
                      catch (SocketException)
                      {
                          break;
                      }
                      catch (ObjectDisposedException)
                      {
                          break;
                      }
                  }

                  using var http = new HttpClient
                  {
                      Timeout = TimeSpan.FromSeconds(5)
                  };

                  foreach (string location in locations)
                  {
                      try
                      {
                          string xml =
                              await http.GetStringAsync(location);

                          DlnaDevice? device =
                              ParseDeviceDescription(
                                  location,
                                  xml);

                          if (device != null &&
                              !result.Any(x =>
                                  x.ControlUrl.Equals(
                                      device.ControlUrl,
                                      StringComparison.OrdinalIgnoreCase)))
                          {
                              result.Add(device);
                          }
                      }
                      catch
                      {
                          // Un dispositivo que no responda correctamente
                          // no debe impedir descubrir los demás.
                      }
                  }

                  return result;
              }


              private static DlnaDevice? ParseDeviceDescription(
                  string location,
                  string xml)
              {
                  XDocument doc =
                      XDocument.Parse(xml);

                  XNamespace ns =
                      "urn:schemas-upnp-org:device-1-0";

                  XElement? deviceElement =
                      doc.Descendants(ns + "device").FirstOrDefault();

                  if (deviceElement == null)
                      return null;

                  string name =
                      deviceElement.Element(ns + "friendlyName")?.Value
                      ?? "DLNA TV";

                  foreach (XElement service
                           in deviceElement.Descendants(ns + "service"))
                  {
                      string serviceType =
                          service.Element(ns + "serviceType")?.Value
                          ?? "";

                      if (!serviceType.Contains(
                              "AVTransport",
                              StringComparison.OrdinalIgnoreCase))
                      {
                          continue;
                      }

                      string control =
                          service.Element(ns + "controlURL")?.Value
                          ?? "";

                      if (string.IsNullOrWhiteSpace(control))
                          continue;

                      Uri baseUri =
                          new Uri(location);

                      Uri controlUri =
                          new Uri(baseUri, control);

                      return new DlnaDevice
                      {
                          DisplayName = name,
                          Location = location,
                          ControlUrl = controlUri.ToString(),
                          ServiceType = serviceType
                      };
                  }

                  return null;
              }
          }
          '@ | Set-Content src\DLNABrowser\SsdpDiscovery.cs -Encoding UTF8


          @'
          using System;
          using System.Net.Http;
          using System.Text;
          using System.Threading.Tasks;

          namespace DLNABrowser;

          public sealed class DlnaRenderer
          {
              private readonly HttpClient _http = new()
              {
                  Timeout = TimeSpan.FromSeconds(15)
              };

              private const string AvTransport =
                  "urn:schemas-upnp-org:service:AVTransport:1";


              public async Task SetMediaAsync(
                  DlnaDevice device,
                  string mediaUrl,
                  string title)
              {
                  string metadata =
                      CreateMetadata(
                          mediaUrl,
                          title);

                  string escapedMetadata =
                      EscapeXml(metadata);

                  string body =
                      $"""
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope
                        s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/"
                        xmlns:s="http://schemas.xmlsoap.org/soap/envelope/">
                        <s:Body>
                          <u:SetAVTransportURI
                            xmlns:u="{AvTransport}">
                            <InstanceID>0</InstanceID>
                            <CurrentURI>{EscapeXml(mediaUrl)}</CurrentURI>
                            <CurrentURIMetaData>{escapedMetadata}</CurrentURIMetaData>
                          </u:SetAVTransportURI>
                        </s:Body>
                      </s:Envelope>
                      """;

                  await SendSoapAsync(
                      device,
                      "SetAVTransportURI",
                      body);
              }


              public async Task PlayAsync(
                  DlnaDevice device)
              {
                  string body =
                      $"""
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope
                        s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/"
                        xmlns:s="http://schemas.xmlsoap.org/soap/envelope/">
                        <s:Body>
                          <u:Play xmlns:u="{AvTransport}">
                            <InstanceID>0</InstanceID>
                            <Speed>1</Speed>
                          </u:Play>
                        </s:Body>
                      </s:Envelope>
                      """;

                  await SendSoapAsync(
                      device,
                      "Play",
                      body);
              }


              public async Task StopAsync(
                  DlnaDevice device)
              {
                  string body =
                      $"""
                      <?xml version="1.0" encoding="utf-8"?>
                      <s:Envelope
                        s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/"
                        xmlns:s="http://schemas.xmlsoap.org/soap/envelope/">
                        <s:Body>
                          <u:Stop xmlns:u="{AvTransport}">
                            <InstanceID>0</InstanceID>
                          </u:Stop>
                        </s:Body>
                      </s:Envelope>
                      """;

                  await SendSoapAsync(
                      device,
                      "Stop",
                      body);
              }


              private async Task SendSoapAsync(
                  DlnaDevice device,
                  string action,
                  string body)
              {
                  using var request =
                      new HttpRequestMessage(
                          HttpMethod.Post,
                          device.ControlUrl);

                  request.Headers.Add(
                      "SOAPACTION",
                      $"\"{AvTransport}#{action}\"");

                  request.Content =
                      new StringContent(
                          body,
                          Encoding.UTF8,
                          "text/xml");

                  using HttpResponseMessage response =
                      await _http.SendAsync(request);

                  string responseBody =
                      await response.Content.ReadAsStringAsync();

                  if (!response.IsSuccessStatusCode)
                  {
                      throw new Exception(
                          $"La TV rechazó {action}: " +
                          $"{(int)response.StatusCode} " +
                          responseBody);
                  }
              }


              private static string CreateMetadata(
                  string url,
                  string title)
              {
                  string safeTitle =
                      EscapeXml(title);

                  string safeUrl =
                      EscapeXml(url);

                  return
                      $"""
                      <DIDL-Lite
                        xmlns="urn:schemas-upnp-org:metadata-1-0/DIDL-Lite/"
                        xmlns:dc="http://purl.org/dc/elements/1.1/"
                        xmlns:upnp="urn:schemas-upnp-org:metadata-1-0/upnp/">
                        <item id="1" parentID="0" restricted="1">
                          <dc:title>{safeTitle}</dc:title>
                          <upnp:class>object.item.videoItem</upnp:class>
                          <res protocolInfo="http-get:*:video/mp4:*">{safeUrl}</res>
                        </item>
                      </DIDL-Lite>
                      """;
              }


              private static string EscapeXml(
                  string value)
              {
                  return value
                      .Replace("&", "&amp;")
                      .Replace("<", "&lt;")
                      .Replace(">", "&gt;")
                      .Replace("\"", "&quot;")
                      .Replace("'", "&apos;");
              }
          }
          '@ | Set-Content src\DLNABrowser\DlnaRenderer.cs -Encoding UTF8


          @'
          using System;
          using System.IO;
          using System.Net;
          using System.Net.Http;
          using System.Net.Sockets;
          using System.Text;
          using System.Threading;
          using System.Threading.Tasks;

          namespace DLNABrowser;

          public sealed class LocalMediaServer : IDisposable
          {
              private readonly HttpClient _http = new()
              {
                  Timeout = Timeout.InfiniteTimeSpan
              };

              private TcpListener? _listener;
              private CancellationTokenSource? _cts;

              public int Port { get; private set; }

              public string LocalAddress { get; private set; } = "";


              public async Task<string> StartAsync(
                  string sourceUrl)
              {
                  Stop();

                  Port = GetFreePort();

                  LocalAddress =
                      GetLocalIPv4();

                  _cts =
                      new CancellationTokenSource();

                  _listener =
                      new TcpListener(
                          IPAddress.Any,
                          Port);

                  _listener.Start();

                  _ = AcceptLoopAsync(
                      sourceUrl,
                      _cts.Token);

                  return
                      $"http://{LocalAddress}:{Port}/media";
              }


              private async Task AcceptLoopAsync(
                  string sourceUrl,
                  CancellationToken token)
              {
                  if (_listener == null)
                      return;

                  while (!token.IsCancellationRequested)
                  {
                      TcpClient? client = null;

                      try
                      {
                          client =
                              await _listener.AcceptTcpClientAsync(
                                  token);

                          _ = HandleClientAsync(
                              client,
                              sourceUrl,
                              token);
                      }
                      catch
                      {
                          client?.Dispose();

                          if (token.IsCancellationRequested)
                              break;
                      }
                  }
              }


              private async Task HandleClientAsync(
                  TcpClient client,
                  string sourceUrl,
                  CancellationToken token)
              {
                  using (client)
                  {
                      try
                      {
                          using NetworkStream stream =
                              client.GetStream();

                          stream.ReadTimeout = 15000;
                          stream.WriteTimeout = 15000;

                          using var reader =
                              new StreamReader(
                                  stream,
                                  Encoding.ASCII,
                                  false,
                                  8192,
                                  true);

                          string? requestLine =
                              await reader.ReadLineAsync();

                          if (string.IsNullOrWhiteSpace(requestLine))
                              return;

                          string? line;

                          string? range = null;

                          while (!string.IsNullOrEmpty(
                                     line = await reader.ReadLineAsync()))
                          {
                              if (line.StartsWith(
                                      "Range:",
                                      StringComparison.OrdinalIgnoreCase))
                              {
                                  range =
                                      line[6..].Trim();
                              }
                          }

                          using var request =
                              new HttpRequestMessage(
                                  HttpMethod.Get,
                                  sourceUrl);

                          if (!string.IsNullOrWhiteSpace(range))
                          {
                              request.Headers.TryAddWithoutValidation(
                                  "Range",
                                  range);
                          }

                          request.Headers.TryAddWithoutValidation(
                              "User-Agent",
                              "DLNABrowser/1.0");

                          using HttpResponseMessage response =
                              await _http.SendAsync(
                                  request,
                                  HttpCompletionOption.ResponseHeadersRead,
                                  token);

                          string contentType =
                              response.Content.Headers.ContentType?.ToString()
                              ?? GuessContentType(sourceUrl);

                          long? contentLength =
                              response.Content.Headers.ContentLength;

                          var headers =
                              new StringBuilder();

                          headers.Append(
                              $"HTTP/1.1 {(int)response.StatusCode} {response.ReasonPhrase}\r\n");

                          headers.Append(
                              $"Content-Type: {contentType}\r\n");

                          headers.Append(
                              "Accept-Ranges: bytes\r\n");

                          if (contentLength.HasValue)
                          {
                              headers.Append(
                                  $"Content-Length: {contentLength.Value}\r\n");
                          }

                          if (response.Content.Headers.ContentRange != null)
                          {
                              headers.Append(
                                  $"Content-Range: {response.Content.Headers.ContentRange}\r\n");
                          }

                          headers.Append(
                              "Access-Control-Allow-Origin: *\r\n");

                          headers.Append(
                              "Connection: close\r\n");

                          headers.Append("\r\n");

                          byte[] headerBytes =
                              Encoding.ASCII.GetBytes(
                                  headers.ToString());

                          await stream.WriteAsync(
                              headerBytes,
                              token);

                          await using Stream source =
                              await response.Content.ReadAsStreamAsync(
                                  token);

                          byte[] buffer =
                              new byte[64 * 1024];

                          int read;

                          while ((read =
                                  await source.ReadAsync(
                                      buffer,
                                      token)) > 0)
                          {
                              await stream.WriteAsync(
                                  buffer.AsMemory(0, read),
                                  token);
                          }
                      }
                      catch
                      {
                          // La TV puede cerrar la conexión al cambiar
                          // de vídeo o detener la reproducción.
                      }
                  }
              }


              private static string GuessContentType(
                  string url)
              {
                  string lower =
                      url.ToLowerInvariant();

                  if (lower.Contains(".webm"))
                      return "video/webm";

                  if (lower.Contains(".m3u8"))
                      return "application/vnd.apple.mpegurl";

                  if (lower.Contains(".mp4"))
                      return "video/mp4";

                  if (lower.Contains(".mkv"))
                      return "video/x-matroska";

                  if (lower.Contains(".avi"))
                      return "video/x-msvideo";

                  return "application/octet-stream";
              }


              private static int GetFreePort()
              {
                  using var tcp =
                      new TcpListener(
                          IPAddress.Loopback,
                          0);

                  tcp.Start();

                  return
                      ((IPEndPoint)tcp.LocalEndpoint).Port;
              }


              private static string GetLocalIPv4()
              {
                  try
                  {
                      using var socket =
                          new Socket(
                              AddressFamily.InterNetwork,
                              SocketType.Dgram,
                              ProtocolType.Udp);

                      socket.Connect(
                          "8.8.8.8",
                          65530);

                      if (socket.LocalEndPoint
                          is IPEndPoint ep)
                      {
                          return ep.Address.ToString();
                      }
                  }
                  catch
                  {
                  }

                  foreach (var address
                           in Dns.GetHostAddresses(
                               Dns.GetHostName()))
                  {
                      if (address.AddressFamily ==
                          AddressFamily.InterNetwork &&
                          !IPAddress.IsLoopback(address))
                      {
                          return address.ToString();
                      }
                  }

                  return "127.0.0.1";
              }


              public void Stop()
              {
                  try
                  {
                      _cts?.Cancel();
                  }
                  catch
                  {
                  }

                  try
                  {
                      _listener?.Stop();
                  }
                  catch
                  {
                  }

                  _listener = null;

                  _cts?.Dispose();
                  _cts = null;
              }


              public void Dispose()
              {
                  Stop();
                  _http.Dispose();
              }
          }
