name: Build DLNA Browser

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows DLNA Browser
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # .NET
      # ============================================================

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ============================================================
      # CREATE COMPLETE PROJECT
      # ============================================================

      - name: Create complete project
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "CREATING DLNA BROWSER PROJECT"
          Write-Host "=============================================="
          Write-Host ""

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "src/DLNABrowser" |
            Out-Null


          # ========================================================
          # CSPROJ
          # ========================================================

          @'
<Project Sdk="Microsoft.NET.Sdk">

  <PropertyGroup>

    <OutputType>WinExe</OutputType>

    <TargetFramework>net8.0-windows</TargetFramework>

    <UseWPF>true</UseWPF>

    <Nullable>enable</Nullable>

    <ImplicitUsings>enable</ImplicitUsings>

    <Platforms>x64</Platforms>

    <RuntimeIdentifier>win-x64</RuntimeIdentifier>

    <AssemblyName>DLNABrowser</AssemblyName>

    <RootNamespace>DLNABrowser</RootNamespace>

    <ApplicationManifest>app.manifest</ApplicationManifest>

    <SelfContained>true</SelfContained>

    <PublishSingleFile>false</PublishSingleFile>

    <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>

    <InvariantGlobalization>false</InvariantGlobalization>

  </PropertyGroup>

  <ItemGroup>

    <PackageReference
      Include="Microsoft.Web.WebView2"
      Version="1.0.4258.31" />

  </ItemGroup>

</Project>
