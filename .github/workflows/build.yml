name: Build DLNA Browser

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "CREATING DLNA BROWSER PROJECT"
          Write-Host "=============================================="

          New-Item -ItemType Directory -Force -Path "src/DLNABrowser" | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <Platforms>x64</Platforms>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>

              <AssemblyName>DLNABrowser</AssemblyName>
              <RootNamespace>DLNABrowser</RootNamespace>

              <ApplicationManifest>app.manifest</ApplicationManifest>

              <PublishSingleFile>false</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="Microsoft.Web.WebView2"
                                Version="1.0.4258.31" />
            </ItemGroup>

          </Project>
          '@ | Set-Content "src/DLNABrowser/DLNABrowser.csproj" -Encoding UTF8

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <assembly manifestVersion="1.0"
                    xmlns="urn:schemas-microsoft-com:asm.v1">

            <assemblyIdentity
              version="1.0.0.0"
              name="DLNABrowser.app"/>

            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel
                    level="asInvoker"
                    uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>

            <compatibility xmlns="urn:schemas-microsoft-com:compatibility.v1">
              <application>
                <supportedOS Id="{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}"/>
              </application>
            </compatibility>

          </assembly>
          '@ | Set-Content "src/DLNABrowser/app.manifest" -Encoding UTF8

          @'
          <Application
              x:Class="DLNABrowser.App"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">

              <Application.Resources>
              </Application.Resources>

          </Application>
          '@ | Set-Content "src/DLNABrowser/App.xaml" -Encoding UTF8

          @'
